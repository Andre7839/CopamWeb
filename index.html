// ===================== One-file-per-season input =====================
// A season file holds: [info] (planting_date, harvest_date, yield, optional yield_basis,
// latitude/longitude, season name), [irrigation] (date|day, depth_mm), optional [climate]
// (date, eto|tmax+tmin(+rs,rh,wind), rain, tmax, tmin) and optional [canopy] (date|day, cc_percent, biomass_t_ha).
// In .xlsx the sections are sheets named Info / Irrigation / Climate / Canopy; in .csv they are
// [info] / [irrigation] / [climate] / [canopy] marker lines.

function classifySheetName(name) {
  const n = String(name).toLowerCase();
  if (/irrig/.test(n)) return "irrigation";
  if (/clim|weather|meteo|\bmet\b/.test(n)) return "climate";
  if (/canopy|\bcc\b|observ|growth|field/.test(n)) return "canopy";
  if (/info|site|general|summary|manage|meta|param|season/.test(n)) return "info";
  return null;
}

function leadNum(v) {
  if (typeof v === "number") return v;
  const m = /^\s*([-+]?\d*\.?\d+(?:[eE][-+]?\d+)?)/.exec(String(v).replace(",", "."));
  return m ? parseFloat(m[1]) : NaN;
}
function isoDate(v) {
  if (v == null || v === "") return null;
  const n = toNum(v);
  if (!isNaN(n) && n > 20000 && n < 80000) return excelSerialToISO(n);
  const d = parseDateLoose(v);
  return d ? d.toISOString().slice(0, 10) : null;
}

function parseInfoRows(rows) {
  const norm = s => String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  const kv = [];
  const filled = r => r.filter(c => c !== "" && c != null).length;
  if (rows.length === 2 && filled(rows[0]) >= 3) rows[0].forEach((k, i) => { if (k !== "") kv.push([norm(k), rows[1][i]]); });
  else rows.forEach((r, i) => {
    if (r.length < 2 || r[0] === "" ) return;
    const k = norm(r[0]);
    if (i === 0 && /^(parameter|key|item|field|variable|name)$/.test(k) && /^(value|val)/.test(norm(r[1]))) return;
    kv.push([k, r[1]]);
  });
  const o = {};
  kv.forEach(([k, v]) => {
    if (v === "" || v == null) return;
    if (/basis|yield_(type|weight|unit)/.test(k)) { const t = String(v).toLowerCase(); o.yieldBasis = /dry|dm|dw/.test(t) ? "dry" : /fresh|wet|fw|fruit/.test(t) ? "fresh" : null; }
    else if (/^yield/.test(k)) o.yield = leadNum(v);
    else if (/plant|sow/.test(k)) o.planting = isoDate(v);
    else if (/harvest/.test(k)) o.harvest = isoDate(v);
    else if (/emerg/.test(k)) (o.stages = o.stages || {}).emergence = isoDate(v);
    else if (/max_?canopy|full_?cover|canopy_?max|peak_?canopy/.test(k)) (o.stages = o.stages || {}).maxCanopy = isoDate(v);

// Daily climate table -> rows resolved later against the planting date

    dateCell: ix.date >= 0 ? r[ix.date] : (ix.day >= 0 ? r[ix.day] : ""), dateIsDate: ix.date >= 0, hasDay: ix.date >= 0 || ix.day >= 0,
    eto: ix.eto >= 0 ? toNum(r[ix.eto]) : NaN, rain: toNum(r[ix.rain]),
    tmax: ix.tmax >= 0 ? toNum(r[ix.tmax]) : NaN, tmin: ix.tmin >= 0 ? toNum(r[ix.tmin]) : NaN,
    rs: ix.rs >= 0 ? toNum(r[ix.rs]) : NaN, rh: ix.rh >= 0 ? toNum(r[ix.rh]) : NaN, wind: ix.wind >= 0 ? toNum(r[ix.wind]) : NaN

// Observations for the calibrator (days after planting, 1 = planting date)
function seasonObs(def) {

const PHENO_KEYS = ["emergence", "maxCanopy", "flowering", "senescStart", "maturity"];

    if (cycle[order[i]] <= cycle[order[i - 1]]) { notes.push(`Mean ${PHENO_LABELS[order[i]].toLowerCase()} (day ${cycle[order[i]]}) is not later than ${PHENO_LABELS[order[i - 1]].toLowerCase()} (day ${cycle[order[i - 1]]}) — check the stage dates.`); }
  }

      if (gdd[k]) gddCycle[k] = Math.round(gdd[k].mean);

}

    collections: ["sentinel-2-l2a"], intersects: { type: "Point", coordinates: [lon, lat] },
    datetime: `${startISO}T00:00:00Z/${endISO}T23:59:59Z`, limit: 200,

  let svg = `<svg class="chart" viewBox="0 0 ${CHART_W} ${CHART_H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += axesSVG(nDays, yMax, v => v.toFixed(1), null, "days after sowing");
  svg += `<path d="${areaPath(daily, "cc", nDays, yMax)}" fill="#7cab5a" fill-opacity="0.18" stroke="none"/>`;
  svg += `<path d="${linePath(daily, "cc", nDays, yMax)}" fill="none" stroke="#7cab5a" stroke-width="2"/>`;
  const v = pts.filter(p => isFinite(p.ndvi) && p.day >= 1 && p.day <= nDays);
  if (v.length > 1) svg += `<path d="${v.map((p, i) => (i ? "L" : "M") + scaleX(p.day, nDays).toFixed(1) + " " + scaleY(Math.max(0, p.ndvi), yMax).toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>`;
  v.forEach(p => {
    const x = scaleX(p.day, nDays), y = scaleY(Math.max(0, p.ndvi), yMax), sim = daily.find(r => r.day === p.day);
    const rows = [{ label: "NDVI", value: p.ndvi.toFixed(2), color: col }];
    if (sim) rows.push({ label: "Simulated CC", value: sim.cc.toFixed(2), color: "#7cab5a" });
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${col}" stroke="#fff" stroke-width="1.2"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="transparent" pointer-events="all" data-tip='${tipHTML(p.date + " · day " + p.day, rows)}'/>`;
  });
  return svg + "</svg>";
}

// Canopy-cover chart for the Results tab: simulated CC on the left axis (%), NDVI observations on a right (Y2) axis (0–1)
function ccNdviChart({ daily, pts, nDays }) {
  const yMax = 1, col = "#e8b04a", W = CHART_W + 40;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${CHART_H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += axesSVG(nDays, yMax, v => (v * 100).toFixed(0) + "%", null, "days after sowing");
  svg += `<path d="${areaPath(daily, "cc", nDays, yMax)}" fill="#7cab5a" fill-opacity="0.18" stroke="none"/>`;
  svg += `<path d="${linePath(daily, "cc", nDays, yMax)}" fill="none" stroke="#7cab5a" stroke-width="2"/>`;
  const x2 = CHART_W - PAD_R;
  svg += `<line x1="${x2}" y1="${PAD_T}" x2="${x2}" y2="${CHART_H - PAD_B}" stroke="${col}" stroke-width="1" opacity="0.8"/>`;
  for (let i = 0; i <= 4; i++) {
    const v = i / 4, y = scaleY(v, yMax);
    svg += `<line x1="${x2}" y1="${y.toFixed(1)}" x2="${x2 + 4}" y2="${y.toFixed(1)}" stroke="${col}"/><text x="${x2 + 7}" y="${(y + 3).toFixed(1)}" font-size="9" fill="${col}" font-family="var(--font-mono)">${v.toFixed(2)}</text>`;
  }
  svg += `<text transform="translate(${W - 3} ${(PAD_T + CHART_H - PAD_B) / 2}) rotate(-90)" text-anchor="middle" font-size="9" fill="${col}">NDVI (Sentinel-2)</text>`;
  const v = pts.filter(p => isFinite(p.ndvi) && p.day >= 1 && p.day <= nDays);
  if (v.length > 1) svg += `<path d="${v.map((p, i) => (i ? "L" : "M") + scaleX(p.day, nDays).toFixed(1) + " " + scaleY(Math.max(0, p.ndvi), yMax).toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>`;
  v.forEach(p => {
    const x = scaleX(p.day, nDays), y = scaleY(Math.max(0, p.ndvi), yMax), sim = daily.find(r => r.day === p.day);

<script>
// ===================== AquaCrop-Web app logic =====================
(function () {
  "use strict";

  const cropOptions = Object.keys(CROPS).map(k => `<option value="${k}">${CROPS[k].label}</option>`).join("");
  const soilOptions = Object.keys(SOILS).map(k => `<option value="${k}" ${k === "loam" ? "selected" : ""}>${SOILS[k].label}</option>`).join("");

  // ---------------------------------------------------------------
  // CROP CALIBRATION OVERRIDES — shared store, keyed by crop id.
  // Edited from the Parameters tab (or filled in by the Calibration tab); every scenario (single-run, compare,
  // historical) that selects a given crop picks up its current calibrated
  // values automatically, the way loading a calibrated crop file in
  // AquaCrop itself would.
  // ---------------------------------------------------------------
  const cropOverrides = {};
  const cropOverrideListeners = [];
  function getCropDef(cropKey) {
    const base = CROPS[cropKey];
    const ov = cropOverrides[cropKey];
    return ov ? Object.assign({}, base, ov) : base;
  }
  function setCropOverride(cropKey, patch) {
    cropOverrides[cropKey] = Object.assign({}, cropOverrides[cropKey], patch);
    cropOverrideListeners.forEach(fn => fn(cropKey));
  }
  function clearCropOverride(cropKey) {
    delete cropOverrides[cropKey];
    cropOverrideListeners.forEach(fn => fn(cropKey));
  }
  function isCalibrated(cropKey) { return !!cropOverrides[cropKey]; }

  // ---------------------------------------------------------------
  // SHARED FIELD LOCATION — one location tab drives every scenario.
  // ---------------------------------------------------------------
  const sharedLocation = { lat: 38.535, lon: -121.776 };
  const locationListeners = [];
  function setSharedLocation(lat, lon) {
    sharedLocation.lat = lat; sharedLocation.lon = lon;
    locationListeners.forEach(fn => fn(sharedLocation));
  }
  function onLocationChange(fn) { locationListeners.push(fn); fn(sharedLocation); }

  // ---------------------------------------------------------------
  // SETUP TAB
  // ---------------------------------------------------------------
  // Stage timing used by a scenario: the crop's current parameters (Parameters tab), in calendar days or in
  // accumulated GDD (gddCycle when set, otherwise an estimate converted from the day values).
  function scenarioStages(cropKey, mode, Tbase) {
    const c = getCropDef(cropKey), d = stageDefaultsFromCrop(cropKey), gcal = c.gddCycle, useCal = mode === "gdd" && gcal;
    const conv = (days, ck) => useCal && gcal[ck] != null ? gcal[ck] : (days == null ? null : (mode === "gdd" ? gddDefaultFromDays(days, Tbase == null || isNaN(Tbase) ? c.Tbase : Tbase) : days));
    const mx = (v, lo, fb) => v == null || isNaN(v) ? fb : Math.max(v, lo);
    return {
      emergence: mx(conv(d.emergence, "emergence"), 0, c.cycle.emergence),
      maxCanopy: mx(conv(d.maxcanopy, "maxCanopy"), 1, c.cycle.maxCanopy),
      senescStart: mx(conv(d.senescence, "senescStart"), 1, c.cycle.senescStart),
      flowering: d.flowering == null ? null : conv(d.flowering, "flowering"),
      floweringDur: conv(d.floweringdur, "floweringDur") || 0,
      maturity: mx(conv(d.maturity, "maturity"), 1, c.cycle.maturity)
    };
  }

              <button type="button" class="btn ghost" id="${prefix}-sched-template">Download template</button>

          </div>

              <label>Surface mulch cover (%)</label>
              <input type="number" id="${prefix}-mulch" value="0" min="0" max="100">

          </div>

            <label>Initial root-zone depletion at sowing (fraction of TAW)</label>
            <input type="number" id="${prefix}-initdepl" value="0.3" min="0" max="1" step="0.05">
          </div>
        </fieldset>`;
  }

  function climateFieldsetHTML(prefix) {
    return `
        <fieldset>
          <legend>Climate data source</legend>
          <div class="radiorow">
            <label><input type="radio" name="${prefix}-wxmode" value="power" checked> NASA POWER (historical, by date)</label>
            <label><input type="radio" name="${prefix}-wxmode" value="upload"> Upload CSV file</label>
          </div>
          <div class="mode-block active" data-mode="power" id="${prefix}-wx-power">
            <div class="hint">Pulls daily Tmax/Tmin, humidity, wind, solar radiation and rain for the sowing-to-maturity window from NASA POWER (power.larc.nasa.gov) and computes reference ET via FAO-56 Penman-Monteith in your browser. Needs internet access to NASA's API.</div>
          </div>
          <div class="mode-block" data-mode="upload" id="${prefix}-wx-upload">
            <div class="field">
              <label>Daily climate file (.csv)</label>
              <input type="file" id="${prefix}-upload-file" accept=".csv,text/csv">
            </div>
            <div class="hint">One row per day, starting at sowing: <code>eto,rain</code> in mm, or <code>eto,rain,tmax,tmin</code> (°C) if you also want to use growing-degree-day mode below. A header row, if present, is detected and skipped. Days beyond the end of the file, or short of what the crop cycle needs, are filled conservatively.</div>
            <div class="status" id="${prefix}-upload-status"></div>
          </div>
        </fieldset>`;
  }

  function setupFormHTML(prefix) {
    return `
    <div class="grid cols-2">
      <div>${cropSoilLocStageHTML(prefix, "2026-04-15")}</div>
      <div>${climateFieldsetHTML(prefix)}${irrigationFieldMgmtHTML(prefix)}</div>
    </div>`;
  }

  function historicalClimateFieldsetHTML(prefix) {
    return `
        <fieldset>
          <legend>Historical climate source</legend>
          <div class="radiorow">
            <label><input type="radio" name="${prefix}-histmode" value="power" checked> NASA POWER (actual historical years)</label>
            <label><input type="radio" name="${prefix}-histmode" value="montecarlo"> Synthetic Monte Carlo (random seasons)</label>
          </div>
          <div class="mode-block active" data-mode="power" id="${prefix}-hist-power">
            <div class="row-inline">
              <div class="field"><label>First year</label><input type="number" id="${prefix}-year-start" value="2011" min="1984" max="2026" step="1"></div>
              <div class="field"><label>Last year</label><input type="number" id="${prefix}-year-end" value="2025" min="1984" max="2026" step="1"></div>
            </div>
            <div class="hint">Uses the sowing date's month/day each year (the year in the date field itself is ignored) and fetches the whole span from NASA POWER in a single request. Capped at 40 years to keep the request reasonable.</div>
          </div>
          <div class="mode-block" data-mode="montecarlo" id="${prefix}-hist-montecarlo">
            <div class="row-inline">
              <div class="field"><label>Number of seasons</label><input type="number" id="${prefix}-mc-n" value="30" min="5" max="200" step="5"></div>
              <div class="field"><label>Peak-season ETo (mm/day)</label><input type="number" id="${prefix}-mc-eto" value="6.0" step="0.1" min="1" max="12"></div>
            </div>
            <div class="field">
              <label>Rain pattern</label>
              <select id="${prefix}-mc-rain">
                <option value="dry">Arid / near-rainless season</option>
                <option value="mediterranean" selected>Mediterranean (dry summer)</option>
                <option value="temperate">Temperate, scattered rain</option>
                <option value="monsoon">Monsoon-influenced</option>
              </select>
            </div>

          </div>
        </fieldset>`;
  }

  function historicalFormHTML(prefix) {
    return `
    <div class="grid cols-2">
      <div>${cropSoilLocStageHTML(prefix, "2026-04-15")}</div>
      <div>${historicalClimateFieldsetHTML(prefix)}${irrigationFieldMgmtHTML(prefix)}</div>

  }

  function cropMetaHTML(cropKey) {
    const c = getCropDef(cropKey);
    const tags = [
      c.group,
      `cycle ${c.cycle.maturity} d`,
      `CCx ${(c.CCx * 100).toFixed(0)}%`,
      `root ${c.Zmin}–${c.Zmax} m`,

  function wireModeToggle(root, radioName, blockPrefix) {

  function stageDefaultsFromCrop(cropKey) {
    const c = getCropDef(cropKey).cycle;
    return {
      emergence: c.emergence, maxcanopy: c.maxCanopy, senescence: c.senescStart,
      flowering: c.flowering, floweringdur: c.floweringDur, maturity: c.maturity
    };
  }

  // Rough starting point for converting a crop's calendar-day stage lengths
  // into growing-degree-day thresholds, assuming a generic ~24°C in-season
  // mean temperature. It's only meant as a sensible default to edit from —
  // once real weather is in play the actual heat accumulation will differ.
  function gddDefaultFromDays(days, Tbase) {
    if (days == null) return null;
    const rate = Math.max(24 - Tbase, 1);
    return Math.round(days * rate);
  }

  function locSummaryText(loc) {
    return `${loc.lat.toFixed(4)}°, ${loc.lon.toFixed(4)}° — <a href="#" data-jump-tab="location">change on the Location tab</a>`;
  }

  function initCommonFields(prefix, container) {
    const g = id => container.querySelector(`#${prefix}-${id}`);

      if (g("tupper")) g("tupper").value = c.Tupper;
    }
    function refreshStageDefaults() {
      const mode = currentPhenMode(), Tbase = g("tbase") && g("tbase").value !== "" ? parseFloat(g("tbase").value) : getCropDef(cropSel.value).Tbase;
      const st = scenarioStages(cropSel.value, mode, Tbase), unit = mode === "gdd" ? "GDD" : "days";
      const f = v => v == null || isNaN(v) ? "–" : Math.round(v);
      g("stage-summary").innerHTML = `Stage timing for <strong>${getCropDef(cropSel.value).label}</strong> comes from the <strong>Parameters</strong> tab (${unit} after sowing): emergence ${f(st.emergence)} · max canopy ${f(st.maxCanopy)} · flowering ${st.flowering == null ? "none" : f(st.flowering)}${st.flowering == null ? "" : " (" + f(st.floweringDur) + " long)"} · senescence ${f(st.senescStart)} · maturity ${f(st.maturity)}. Edit them there${mode === "gdd" ? " (the GDD column; blank falls back to an estimate from the day values)" : ""}.`;
    }
    cropSel.addEventListener("change", () => { refreshMeta(); refreshTempDefaults(); refreshStageDefaults(); });
    refreshMeta();
    refreshTempDefaults();
    refreshStageDefaults();

  function initSetupPanel(prefix, container) {

  function initHistoricalPanel(prefix, container) {

  // ---------------------------------------------------------------
  // Weather assembly
  // ---------------------------------------------------------------
  function parseLatLon(str) {
    const parts = str.split(",").map(s => parseFloat(s.trim()));
    if (parts.length !== 2 || parts.some(isNaN)) return { lat: 38.535, lon: -121.776 };
    return { lat: parts[0], lon: parts[1] };
  }

  function addDays(dateStr, n) {
    const d = new Date(dateStr + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d;
  }
  function fmtYMD(d) { return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, "0") + String(d.getUTCDate()).padStart(2, "0"); }

  async function fetchPowerWeatherRange(lat, lon, startDateStr, endDateStr) {
    const start = new Date(startDateStr + "T00:00:00Z");
    const end = new Date(endDateStr + "T00:00:00Z");
    // NASA POWER daily data typically lags ~a week; if the requested window
    // runs past what's available, the API simply returns fill values (-999)
    // for those days, which we detect and flag to the caller.
    const params = "T2M_MAX,T2M_MIN,RH2M,WS2M,ALLSKY_SFC_SW_DWN,PRECTOTCORR";
    const url = `https://power.larc.nasa.gov/api/temporal/daily/point?parameters=${params}&community=AG&longitude=${lon}&latitude=${lat}&start=${fmtYMD(start)}&end=${fmtYMD(end)}&format=JSON`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("NASA POWER request failed (" + resp.status + ")");
    const json = await resp.json();
    const p = json.properties.parameter;
    const elevation = json.geometry && json.geometry.coordinates && json.geometry.coordinates[2] != null ? json.geometry.coordinates[2] : 50;
    const dateKeys = Object.keys(p.T2M_MAX).sort();
    const byDate = {};
    let missing = 0;
    dateKeys.forEach(dstr => {
      const tmax = p.T2M_MAX[dstr], tmin = p.T2M_MIN[dstr], rh = p.RH2M[dstr], ws = p.WS2M[dstr], rs = p.ALLSKY_SFC_SW_DWN[dstr], rain = p.PRECTOTCORR[dstr];
      if ([tmax, tmin, rh, ws, rs, rain].some(v => v == null || v <= -900)) { missing++; byDate[dstr] = { eto: 4.0, rain: 0, tmax: 25, tmin: 12, fallback: true }; return; }
      const d = new Date(Date.UTC(+dstr.slice(0, 4), +dstr.slice(4, 6) - 1, +dstr.slice(6, 8)));
      const doy = dayOfYear(d);
      const eto = eto_PM(tmax, tmin, rh, ws, rs, elevation, lat, doy);
      byDate[dstr] = { eto, rain: Math.max(rain, 0), tmax, tmin };
    });
    return { byDate, dateKeys, missing, elevation };
  }

  // Slice nDays of weather starting at sowDateStr out of a byDate lookup
  // (from fetchPowerWeatherRange). Days not present in byDate — e.g. because
  // the overall fetched span didn't quite cover them — fall back the same
  // way NASA POWER's own missing-data fill does.
  function sliceWeatherWindow(byDate, sowDateStr, nDays) {
    const weather = [];
    let missing = 0;
    for (let i = 0; i < nDays; i++) {
      const d = addDays(sowDateStr, i);
      const key = fmtYMD(d);
      const rec = byDate[key];
      if (!rec) { missing++; weather.push({ eto: 4.0, rain: 0, tmax: 25, tmin: 12, fallback: true }); }
      else { weather.push(rec); if (rec.fallback) missing++; }
    }
    return { weather, missing };
  }

  async function fetchPowerWeather(lat, lon, sowDateStr, nDays) {
    const endDateStr = fmtDateISO(addDays(sowDateStr, nDays - 1));
    const r = await fetchPowerWeatherRange(lat, lon, sowDateStr, endDateStr);
    const sliced = sliceWeatherWindow(r.byDate, sowDateStr, nDays);
    return { weather: sliced.weather, missing: sliced.missing, elevation: r.elevation };
  }
  function fmtDateISO(d) { return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0"); }

  function demoWeather(nDays, etoPeak, pattern) {
    const rainProfiles = {
      dry: { prob: 0.03, mean: 4 },
      mediterranean: { prob: 0.06, mean: 8 },
      temperate: { prob: 0.16, mean: 7 },
      monsoon: { prob: 0.22, mean: 14 }
    };
    const rp = rainProfiles[pattern] || rainProfiles.mediterranean;
    const weather = [];
    for (let i = 0; i < nDays; i++) {
      const seasonal = Math.sin((i / nDays) * Math.PI); // 0 at start/end, 1 mid-season
      const eto = Math.max(0.6, etoPeak * (0.35 + 0.65 * seasonal) + (Math.random() - 0.5) * 0.6);
      const rain = Math.random() < rp.prob ? Math.random() * rp.mean * 2 : 0;
      // rough temperature synthesized from the same seasonal curve, only used
      // as a stand-in for growing-degree-day mode when real temperature data
      // isn't available (this fallback climate is otherwise ETo/rain only)
      const tmax = 14 + etoPeak * 2.2 * (0.4 + 0.6 * seasonal);
      const tmin = tmax - (9 + 3 * seasonal);
      weather.push({ eto, rain, tmax, tmin });
    }
    return weather;
  }

  function parsePastedWeather(text) {
    const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
    const rows = lines.map(line => line.split(/[,\t]/).map(s => s.trim()));
    // drop a header row if its first two fields aren't both numeric
    if (rows.length && (isNaN(parseFloat(rows[0][0])) || isNaN(parseFloat(rows[0][1])))) rows.shift();
    return rows.map(parts => ({
      eto: parseFloat(parts[0]) || 0,
      rain: parseFloat(parts[1]) || 0,
      tmax: parts[2] !== undefined && parts[2] !== "" ? parseFloat(parts[2]) : undefined,
      tmin: parts[3] !== undefined && parts[3] !== "" ? parseFloat(parts[3]) : undefined
    }));
  }

  // ---------------------------------------------------------------
  // Uploaded climate CSV cache — keyed by scenario prefix
  // ---------------------------------------------------------------
  const uploadedWeatherCache = {};
  function wireClimateUpload(prefix, container) {
    const fileInput = container.querySelector(`#${prefix}-upload-file`);
    const statusEl = container.querySelector(`#${prefix}-upload-status`);
    if (!fileInput) return;
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      statusEl.innerHTML = `<span class="spinner"></span>Reading ${file.name}…`;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const weather = parsePastedWeather(String(reader.result));
          if (!weather.length) throw new Error("no rows found");
          uploadedWeatherCache[prefix] = { weather, filename: file.name };
          statusEl.innerHTML = `<span class="status ok">Loaded ${file.name} — ${weather.length} days.</span>`;
        } catch (e) {
          uploadedWeatherCache[prefix] = null;
          statusEl.innerHTML = `<span class="status err">Couldn't read ${file.name} (${e.message}).</span>`;
        }
      };
      reader.onerror = () => { statusEl.innerHTML = `<span class="status err">Failed to read ${file.name}.</span>`; };
      reader.readAsText(file);
    });
  }

  function downloadText(filename, text) {
    const blob = new Blob([text], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function downloadBytes(filename, bytes, mime) {
    const blob = new Blob([bytes], { type: mime });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function wireScheduleImport(prefix, container) {
    const fileInput = container.querySelector(`#${prefix}-sched-file`);
    if (!fileInput) return;
    const statusEl = container.querySelector(`#${prefix}-sched-status`);
    container.querySelector(`#${prefix}-sched-pick`).addEventListener("click", () => fileInput.click());
    const area = container.querySelector(`#${prefix}-fixed-events`);
    container.querySelector(`#${prefix}-sched-template`).addEventListener("click", () =>
      downloadText("irrigation_schedule_template.csv", "date,depth_mm\n2026-05-05,30\n2026-05-25,35\n2026-06-15,35\n"));
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      statusEl.innerHTML = `<span class="spinner"></span>Reading ${file.name}…`;
      try {
        const rows = (await readTableFile(file)).filter(r => !String(r[0]).startsWith("#"));
        const sow = document.getElementById(`${prefix}-sowdate`).value;
        const { events, skipped, usedDates } = parseScheduleTable(rows, sow);
        if (!events.length) throw new Error("no valid day/date + depth rows found");
        area.value = events.map(e => `${e.day},${e.depth}`).join("\n");
        area.dispatchEvent(new Event("input", { bubbles: true }));
        const total = events.reduce((a, e) => a + e.depth, 0);
        statusEl.innerHTML = `<span class="status ok">Imported ${events.length} irrigation events (${total.toFixed(0)} mm total) from ${file.name}${usedDates ? ` — dates converted relative to the sowing date (${sow})` : ""}${skipped ? `; ${skipped} row(s) skipped` : ""}.</span>`;
      } catch (e) {
        statusEl.innerHTML = `<span class="status err">Couldn't import ${file.name}: ${e.message}.</span>`;
      }
      fileInput.value = "";
    });
  }

  function parseFixedEvents(text) {
    return text.trim().split(/\r?\n/).filter(l => l.trim()).map(line => {
      const parts = line.split(",").map(s => parseFloat(s.trim()));
      return { day: parts[0], depth: parts[1] };
    });
  }

  // ---------------------------------------------------------------
  // Gather scenario config from a setup panel + run
  // ---------------------------------------------------------------
  function gatherCommonInputs(prefix) {
    const g = id => document.getElementById(`${prefix}-${id}`);
    const cropKey = g("crop").value;
    const baseCrop = getCropDef(cropKey);
    const soil = SOILS[g("soil").value];
    const sowDate = g("sowdate").value;
    const lat = sharedLocation.lat, lon = sharedLocation.lon;

    const phenModeEl = document.querySelector(`input[name="${prefix}-phenmode"]:checked`);
    const phenologyMode = phenModeEl ? phenModeEl.value : "calendar";
    const TbaseIn = parseFloat(g("tbase") ? g("tbase").value : NaN);
    const TupperIn = parseFloat(g("tupper") ? g("tupper").value : NaN);
    const Tbase = isNaN(TbaseIn) ? baseCrop.Tbase : TbaseIn;
    const Tupper = isNaN(TupperIn) ? baseCrop.Tupper : TupperIn;

    const cycle = scenarioStages(cropKey, phenologyMode, Tbase);
    const crop = Object.assign({}, baseCrop, { cycle, Tbase, Tupper });

    let nDays;
    if (phenologyMode === "gdd") {
      // We don't know actual heat accrual until weather is in hand, so
      // estimate the calendar-day window from the same ~24°C reference used
      // to default the GDD thresholds, plus a safety margin — if real
      // weather runs cooler than that, the crop may not fully reach its
      // maturity threshold within the window (reflected as an under-mature
      // result rather than a crash).
      const refRate = Math.max(24 - Tbase, 1);
      const estDays = crop.cycle.maturity / refRate;
      nDays = Math.min(Math.max(Math.ceil(estDays * 1.35) + 10, 20), 400);
    } else {
      nDays = crop.cycle.maturity + 5;
    }

    const irrMode = document.querySelector(`input[name="${prefix}-irrmode"]:checked`).value;
    const mgmt = {
      mode: irrMode,
      triggerFrac: parseFloat(g("trigger") ? g("trigger").value : 0.5),
      targetFrac: parseFloat(g("target") ? g("target").value : 0.05),
      mulchPct: parseFloat(g("mulch").value) || 0,
      wetFrac: parseFloat(g("wetfrac").value) || 1,
      initialDepletionFrac: parseFloat(g("initdepl").value)
    };
    let irrigationEvents = [];
    if (irrMode === "fixed") irrigationEvents = parseFixedEvents(g("fixed-events").value);

    return { cropKey, crop, soil, sowDate, lat, lon, nDays, mgmt, irrigationEvents, phenologyMode };
  }

  async function gatherAndRun(prefix, statusEl) {
    const prep = await prepareScenario(prefix, statusEl);
    const { common, weather, wxNote } = prep;
    const { crop, soil, sowDate, mgmt, irrigationEvents, phenologyMode } = common;
    const result = runSimulation({ crop, soil, weather, irrigationEvents, mgmt, phenologyMode });
    return { cropKey: common.cropKey, crop, soil, sowDate, weather, mgmt, result, wxNote, lat: common.lat, lon: common.lon, label: crop.label + " · " + soil.label };
  }

  // Reads the form and assembles weather; shared by single runs and field-data calibration.
  async function prepareScenario(prefix, statusEl) {
    const g = id => document.getElementById(`${prefix}-${id}`);
    const common = gatherCommonInputs(prefix);
    const { crop, soil, sowDate, lat, lon, nDays, mgmt, irrigationEvents, phenologyMode } = common;

    const wxMode = document.querySelector(`input[name="${prefix}-wxmode"]:checked`).value;
    let weather, wxNote = "";
    if (wxMode === "power") {
      statusEl.innerHTML = `<span class="spinner"></span>Fetching NASA POWER climate data…`;
      try {
        const r = await fetchPowerWeather(lat, lon, sowDate, nDays);
        weather = r.weather;
        if (r.missing > 0) wxNote = `${r.missing} of ${nDays} days had no NASA POWER data yet (too recent) and were filled with a conservative estimate.`;
      } catch (e) {
        statusEl.innerHTML = `<span class="status err">NASA POWER fetch failed (${e.message}). Falling back to a conservative built-in estimate so you can still see results — try "Upload CSV file" for real data.</span>`;
        weather = demoWeather(nDays, 6.0, "mediterranean");
        wxNote = "NASA POWER unavailable — used a built-in fallback climate estimate instead.";
      }
    } else {
      const cached = uploadedWeatherCache[prefix];
      if (!cached || !cached.weather) {
        throw new Error("upload a climate CSV file first");
      }
      weather = cached.weather.slice();
      if (weather.length < nDays) {
        wxNote = `${cached.filename}: ${weather.length} rows; crop cycle needs ${nDays}. Missing days were treated as ETo 4 mm/day, no rain.`;
        while (weather.length < nDays) weather.push({ eto: 4, rain: 0 });
      } else if (weather.length > nDays) {
        wxNote = `${cached.filename}: used the first ${nDays} of ${weather.length} rows to match the crop cycle.`;
      }
    }
    weather = weather.slice(0, nDays);

    if (phenologyMode === "gdd") {
      const withTemp = weather.filter(w => w.tmax != null && w.tmin != null).length;
      if (withTemp < weather.length * 0.5) {
        const gddWarning = `Growing-degree-day mode needs daily Tmax/Tmin, but this climate source only provided it for ${withTemp} of ${weather.length} days — canopy development will stall on the days without it. Use NASA POWER, or upload a CSV with <code>tmax,tmin</code> columns, for full GDD support.`;
        wxNote = wxNote ? wxNote + " " + gddWarning : gddWarning;
      }
    }

    return { common, weather, wxNote };
  }

  function ksLegend() {

      <span><span class="sw" style="background:var(--canopy-400)"></span>Ks expansion</span>
      <span><span class="sw" style="background:var(--water-400)"></span>Ks stomatal</span>

      <span><span class="sw" style="background:var(--ochre-400)"></span>Ks pollination</span>

  function waterBalanceTableHTML(scn) {
    const s = scn.result.summary;
    const rows = [
      ["Irrigation applied", s.seasonIrrig],
      ["Rainfall", s.seasonRain],
      ["Runoff (SCS curve number)", s.seasonRunoff],
      ["Deep drainage", s.seasonDrain],
      ["Soil evaporation (Es)", s.seasonEs],

    ];

    html += `</tbody></table>`;

  }

  function soilProfileSVG(day, row, crop, soil, TAWmax) {
    const W = 220, H = 300;
    const zMaxPx = 240, zTopY = 30;
    const ZmaxDisp = Math.max(crop.Zmax, 1.0);
    const zrPx = (row.Zr / ZmaxDisp) * zMaxPx;
    const fillFrac = row.TAW > 0 ? clamp01(1 - row.deplFrac) : 1;
    const horizons = [
      { y0: 0, y1: 0.15, color: "#3a2c20" },
      { y0: 0.15, y1: 0.5, color: "#4d3b2a" },
      { y0: 0.5, y1: 1.0, color: "#5c4630" }
    ];
    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">`;
    // soil column
    horizons.forEach(h => {
      svg += `<rect x="30" y="${(zTopY + h.y0 * zMaxPx).toFixed(1)}" width="140" height="${((h.y1 - h.y0) * zMaxPx).toFixed(1)}" fill="${h.color}" />`;
    });
    // moisture fill within root zone (blue overlay proportional to fillFrac)
    const moistH = zrPx * fillFrac;
    svg += `<rect x="30" y="${(zTopY + zrPx - moistH).toFixed(1)}" width="140" height="${moistH.toFixed(1)}" fill="var(--water-500)" fill-opacity="0.38"/>`;
    // root front line
    svg += `<line x1="30" y1="${(zTopY + zrPx).toFixed(1)}" x2="170" y2="${(zTopY + zrPx).toFixed(1)}" stroke="var(--canopy-300)" stroke-width="2" stroke-dasharray="3,2"/>`;
    svg += `<text x="175" y="${(zTopY + zrPx + 3).toFixed(1)}" font-size="9" fill="var(--canopy-300)" font-family="var(--font-mono)">root ${row.Zr.toFixed(2)}m</text>`;
    // canopy disc above ground scaled by cc
    const canopyR = 10 + row.cc * 55;
    svg += `<ellipse cx="100" cy="${(zTopY - 14).toFixed(1)}" rx="${canopyR.toFixed(1)}" ry="${(canopyR * 0.42).toFixed(1)}" fill="var(--canopy-500)" fill-opacity="0.55" stroke="var(--canopy-300)" stroke-width="1"/>`;
    // ground line
    svg += `<line x1="20" y1="${zTopY}" x2="180" y2="${zTopY}" stroke="var(--ochre-400)" stroke-width="2"/>`;
    svg += `<text x="20" y="${zTopY - 20}" font-size="9" fill="var(--paper-faint)" font-family="var(--font-mono)">CC ${(row.cc * 100).toFixed(0)}%</text>`;
    svg += `<text x="30" y="${(zTopY + zMaxPx + 16).toFixed(1)}" font-size="9" fill="var(--paper-faint)" font-family="var(--font-mono)">depletion ${(row.deplFrac * 100).toFixed(0)}% of TAW</text>`;
    svg += "</svg>";
    return svg;
  }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  function readoutHTML(row) {
    const items = [
      ["Day", row.day], ["Canopy cover", (row.cc * 100).toFixed(1) + "%"],
      ["Root depth", row.Zr.toFixed(2) + " m"], ["Depletion", (row.deplFrac * 100).toFixed(0) + "% of TAW"],
      ["Ks expansion", row.ksExp.toFixed(2)], ["Ks stomatal", row.ksSto.toFixed(2)],
      ["ETo", row.eto.toFixed(1) + " mm"], ["ETc", row.ETc.toFixed(1) + " mm"],
      ["Irrigation", row.irrig.toFixed(1) + " mm"], ["Rain", row.rain.toFixed(1) + " mm"],
      ["Cumulative biomass", row.biomass.toFixed(0) + " g/m²"], ["Harvest index", row.HI.toFixed(1) + "%"]
    ];
    return `<div class="readout-grid">` + items.map(i => `<div class="readout-item"><span class="lbl">${i[0]}</span><span class="val">${i[1]}</span></div>`).join("") + `</div>`;
  }

  // NDVI for the simulated season, fetched in the background and added to the canopy chart on a second (right) axis
  async function attachNdviToResults(idPrefix, scn, daily) {
    const chartEl = document.getElementById(`${idPrefix}-cc-chart`), st = document.getElementById(`${idPrefix}-ndvi-status`);
    if (!chartEl || !st) return;
    const nDays = daily.length, start = scn.sowDate, end = isoAdd(start, nDays - 1), key = [scn.lat, scn.lon, start, end].join("|");
    const stale = () => document.getElementById(`${idPrefix}-cc-chart`) !== chartEl;
    const draw = (series) => {
      const pts = series.points.map(p => Object.assign({}, p, { day: daysBetweenISO(start, p.date) + 1 })).filter(p => p.day >= 1 && p.day <= nDays);
      if (pts.length) chartEl.innerHTML = ccNdviChart({ daily, pts, nDays });
      const cmp = compareWithSimulation(pts, daily), f = (v, d) => v == null || isNaN(v) ? "–" : v.toFixed(d);
      let t = `NDVI for ${start} → ${end} at ${scn.lat.toFixed(3)}, ${scn.lon.toFixed(3)}: ${series.nScenes} Sentinel-2 scene${series.nScenes === 1 ? "" : "s"} found, ${pts.length} clear.`;
      if (series.errors.length) t += ` ${series.errors.length} could not be read.`;
      if (pts.length >= 3) t += ` Simulated canopy vs NDVI: r = ${f(cmp.r, 2)}. NDVI is an index, not canopy cover — compare timing and shape.`;
      else if (!pts.length) t += " No usable observations, so none are plotted.";
      st.textContent = t;
    };
    if (satCache.has(key)) { draw(satCache.get(key)); return; }
    if (start > new Date().toISOString().slice(0, 10)) { st.textContent = "NDVI not available: the simulated season starts in the future."; return; }
    st.innerHTML = '<span class="spinner"></span>Fetching Sentinel-2 NDVI for the simulated season…';
    try {
      const series = await fetchSatelliteSeries(scn.lat, scn.lon, start, end, { onProgress: (d, n) => { if (!stale()) st.innerHTML = `<span class="spinner"></span>Reading Sentinel-2 scene ${Math.min(d + 1, n)} of ${n}…`; } });
      satCache.set(key, series);
      if (!stale()) draw(series);
    } catch (e) { if (!stale()) st.innerHTML = `<span class="status err">NDVI could not be retrieved (${e.message}); the simulation itself is unaffected.</span>`; }
  }

  // ---------------------------------------------------------------
  // HISTORICAL / MULTI-YEAR STATISTICAL ANALYSIS
  // ---------------------------------------------------------------
  function sowDateForYear(refDateStr, year) {
    const ref = new Date(refDateStr + "T00:00:00Z");
    const d = new Date(Date.UTC(year, ref.getUTCMonth(), ref.getUTCDate()));
    return fmtDateISO(d);
  }

  async function runHistoricalAnalysis(prefix, statusEl) {
    const g = id => document.getElementById(`${prefix}-${id}`);
    const common = gatherCommonInputs(prefix);
    const { crop, soil, sowDate, lat, lon, nDays, mgmt, irrigationEvents, phenologyMode } = common;

    const histMode = document.querySelector(`input[name="${prefix}-histmode"]:checked`).value;
    let runs = [], sourceNote = "";

    if (histMode === "power") {
      let yStart = parseInt(g("year-start").value, 10);
      let yEnd = parseInt(g("year-end").value, 10);
      if (isNaN(yStart)) yStart = 2011;
      if (isNaN(yEnd)) yEnd = 2025;
      if (yEnd < yStart) { const t = yStart; yStart = yEnd; yEnd = t; }
      if (yEnd - yStart > 40) yEnd = yStart + 40;
      const years = [];
      for (let y = yStart; y <= yEnd; y++) years.push(y);

      statusEl.innerHTML = `<span class="spinner"></span>Fetching ${years.length} years of NASA POWER climate data (one request)…`;
      const firstSow = sowDateForYear(sowDate, years[0]);
      const lastSow = sowDateForYear(sowDate, years[years.length - 1]);
      const overallEnd = fmtDateISO(addDays(lastSow, nDays - 1));
      const r = await fetchPowerWeatherRange(lat, lon, firstSow, overallEnd);
      years.forEach(y => {
        const ySow = sowDateForYear(sowDate, y);
        const sliced = sliceWeatherWindow(r.byDate, ySow, nDays);
        runs.push({ label: String(y), weather: sliced.weather, fallbackDays: sliced.missing });
      });
      const totalFallback = runs.reduce((a, x) => a + x.fallbackDays, 0);
      if (totalFallback > 0) sourceNote = `${totalFallback} day-values across ${years.length} years had no NASA POWER data and were filled with a conservative estimate — seasons with substantial fill are shown as lighter bars below.`;
    } else {
      const n = parseInt(g("mc-n").value, 10) || 30;
      const etoPeak = parseFloat(g("mc-eto").value) || 6.0;
      const pattern = g("mc-rain").value;
      statusEl.innerHTML = `<span class="spinner"></span>Generating ${n} synthetic seasons…`;
      for (let i = 1; i <= n; i++) runs.push({ label: "S" + i, weather: demoWeather(nDays, etoPeak, pattern), fallbackDays: 0 });
      sourceNote = `${n} independent synthetic seasons for exploring the shape of a yield distribution — not tied to a real place or period.`;
    }

    statusEl.innerHTML = `<span class="spinner"></span>Running ${runs.length} seasonal simulations…`;
    const results = runs.map(r => ({
      label: r.label,
      fallback: r.fallbackDays > nDays * 0.15,
      result: runSimulation({ crop, soil, weather: r.weather, irrigationEvents, mgmt, phenologyMode })
    }));

    return { crop, soil, sowDate, mgmt, results, sourceNote, histMode, label: crop.label + " · " + soil.label };
  }

  function renderHistoricalResults(container, hist) {
    const yields = hist.results.map(r => r.result.summary.yieldFreshTha);
    const etcs = hist.results.map(r => r.result.summary.seasonETc);
    const irrigs = hist.results.map(r => r.result.summary.seasonIrrig);
    const s = summaryStats(yields);
    const sEtc = summaryStats(etcs);
    const sIrrig = summaryStats(irrigs);
    const unit = hist.histMode === "power" ? "year" : "realization";
    const isRainfed = hist.mgmt.mode === "rainfed";

    let html = `<div class="panel"><h2>${hist.label}<small>${hist.results.length} seasons simulated · sowing ${hist.sowDate.slice(5)} each ${unit}</small></h2>`;
    if (hist.sourceNote) html += `<div class="callout">${hist.sourceNote}</div>`;
    html += `<div class="grid cols-4">
      <div class="stat"><div class="k">Mean fresh yield</div><div class="v green">${fmt(s.mean, 1)}<span class="unit">t/ha</span></div></div>
      <div class="stat"><div class="k">Std deviation</div><div class="v">±${fmt(s.stdev, 1)}<span class="unit">t/ha · CV ${fmt(s.cv, 0)}%</span></div></div>
      <div class="stat"><div class="k">Median</div><div class="v">${fmt(s.median, 1)}<span class="unit">t/ha</span></div></div>
      <div class="stat"><div class="k">Range</div><div class="v">${fmt(s.min, 1)}–${fmt(s.max, 1)}<span class="unit">t/ha</span></div></div>
      <div class="stat"><div class="k">Exceeded 90% of seasons</div><div class="v ochre">${fmt(s.p10, 1)}<span class="unit">t/ha</span></div></div>
      <div class="stat"><div class="k">Exceeded 10% of seasons</div><div class="v ochre">${fmt(s.p90, 1)}<span class="unit">t/ha</span></div></div>
      <div class="stat"><div class="k">Mean seasonal ETc</div><div class="v blue">${fmt(sEtc.mean, 0)}<span class="unit">mm</span></div></div>
      <div class="stat"><div class="k">Mean irrigation</div><div class="v blue">${fmt(sIrrig.mean, 0)}<span class="unit">mm</span></div></div>
    </div></div>`;

    html += `<div class="panel"><h2>Statistical distribution (box &amp; whisker)<small>Box spans the 25th–75th percentile with the median line; whiskers reach the min and max across all ${hist.results.length} seasons.</small></h2>
      <div class="grid cols-2">
        <div class="chartwrap"><h3>Fresh yield (t/ha)</h3><div id="hist-box-yield"></div></div>
        <div class="chartwrap"><h3>Irrigation need (mm)</h3><div id="hist-box-irrig"></div></div>
      </div></div>`;

    html += `<div class="panel"><h2>Yield &amp; irrigation need by ${unit}<small>${unit === "year" ? "Years" : "Runs"} are ordered left to right from lowest to highest irrigation need, so dry and wet seasons stand out at a glance.</small></h2>
      <div class="chartwrap"><div id="hist-bar-chart"></div>
        <div class="legend"><span><span class="sw" style="background:var(--canopy-400)"></span>Fresh-weight yield (t/ha, left axis)</span><span><span class="sw" style="background:var(--water-400)"></span>Irrigation applied (mm, right axis)</span><span><span class="sw" style="background:var(--ochre-400)"></span>Mean yield</span>${hist.histMode === "power" ? '<span>Lighter bars = substantial missing NASA POWER data that year</span>' : ""}</div>
      </div></div>`;

    html += isRainfed
      ? `<div class="panel"><h2>Yield reliability (exceedance) curve<small>No irrigation is applied in this scenario, so this tracks yield instead of irrigation demand.</small></h2>
      <div class="chartwrap"><h3>Probability that fresh-weight yield meets or exceeds a given value</h3><div id="hist-exceed-chart"></div>
      <div class="chartnote">The point at 90% is the yield achieved in at least 9 of 10 seasons. Low points on this curve are your dry years; high points are your wet years.</div></div></div>`
      : `<div class="panel"><h2>Irrigation demand reliability (exceedance) curve</h2>
      <div class="chartwrap"><h3>Probability that irrigation need meets or exceeds a given value</h3><div id="hist-exceed-chart"></div>
      <div class="chartnote">Reads like a water-supply planning curve: the point at 90% is the irrigation demand met or exceeded in 9 of 10 seasons. High points on this curve are your dry years (more irrigation needed to make up the deficit); low points are your wet years.</div></div></div>`;

    html += `<div class="panel"><h2>${hist.histMode === "power" ? "Year-by-year" : "Realization-by-realization"} results</h2>
      <div style="max-height:360px;overflow:auto;">
      <table class="wb"><thead><tr><th>${hist.histMode === "power" ? "Year" : "Run"}</th><th>Dry yield (t/ha)</th><th>Fresh yield (t/ha)</th><th>ETc (mm)</th><th>Irrigation (mm)</th><th>Rain (mm)</th><th>WP (kg/m³)</th></tr></thead><tbody>
      ${hist.results.map(r => `<tr${r.fallback ? ' style="opacity:0.55"' : ""}><td>${r.label}</td><td>${fmt(r.result.summary.yieldTha, 2)}</td><td>${fmt(r.result.summary.yieldFreshTha, 1)}</td><td>${fmt(r.result.summary.seasonETc, 0)}</td><td>${fmt(r.result.summary.seasonIrrig, 0)}</td><td>${fmt(r.result.summary.seasonRain, 0)}</td><td>${fmt(r.result.summary.wpEtc, 2)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="btnrow" style="margin-top:10px;"><button class="btn ghost" id="hist-export">Export summary (CSV)</button></div>
    </div>`;

    container.innerHTML = html;

    document.getElementById("hist-box-yield").innerHTML = boxWhiskerChart({ values: yields, color: "#7cab5a", yFmt: v => v.toFixed(1), title: "Fresh yield (t/ha)" });
    document.getElementById("hist-box-irrig").innerHTML = boxWhiskerChart({ values: irrigs, color: "#5fa0c8", yFmt: v => v.toFixed(0), title: "Irrigation need (mm)" });

    const barData = hist.results
      .map(r => ({ label: r.label, yieldFreshTha: r.result.summary.yieldFreshTha, seasonIrrig: r.result.summary.seasonIrrig, fallback: r.fallback }))
      .sort((a, b) => a.seasonIrrig - b.seasonIrrig);
    document.getElementById("hist-bar-chart").innerHTML = barChart({
      data: barData, key: "yieldFreshTha", labelKey: "label", color: "#7cab5a", yFmt: v => v.toFixed(1), refLine: s.mean, label: "Fresh yield (t/ha)",
      line: { key: "seasonIrrig", color: "#5fa0c8", yFmt: v => v.toFixed(0), label: "Irrigation applied (mm)" }
    });

    const curve = isRainfed ? exceedanceCurve(yields) : exceedanceCurve(irrigs);
    document.getElementById("hist-exceed-chart").innerHTML = lineChart({
      data: curve.map(p => ({ day: p.prob, value: p.value })), nDays: 100,
      series: [{ key: "value", color: isRainfed ? "#7cab5a" : "#5fa0c8", area: true, label: isRainfed ? "Fresh yield" : "Irrigation need" }],
      yFmt: v => v.toFixed(isRainfed ? 1 : 0), xLabel: "probability of exceedance (%)", xFmt: v => v.toFixed(0) + "%"
    });

    document.getElementById("hist-export").addEventListener("click", () => {
      const header = "label,dry_yield_tha,fresh_yield_tha,etc_mm,irrigation_mm,rain_mm,wp_kg_m3,fallback_flag";
      const rows = hist.results.map(r => [r.label, r.result.summary.yieldTha.toFixed(3), r.result.summary.yieldFreshTha.toFixed(2), r.result.summary.seasonETc.toFixed(1), r.result.summary.seasonIrrig.toFixed(1), r.result.summary.seasonRain.toFixed(1), r.result.summary.wpEtc.toFixed(3), r.fallback ? "1" : "0"].join(","));
      const csv = header + "\n" + rows.join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `aquacrop-web_${hist.crop.label.replace(/\s+/g, "_")}_historical.csv`;
      a.click();
    });
  }

            <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--paper);"><input type="checkbox" id="cal-ponded" style="width:auto;"> Paddy/ponded crop (exempt from the waterlogging penalty)</label>
          </fieldset>
        </div>
      </div>

      <details id="cal-adv" style="margin-top:14px;border:1px solid var(--line, #5a4a3a);border-radius:8px;padding:10px 14px;">
        <summary style="cursor:pointer;font-weight:600;">Advanced — conservative parameters <span id="cal-adv-flag" style="font-weight:400;font-size:0.82rem;"></span></summary>
        <div class="hint" style="margin:10px 0;border-left:3px solid #d98a1c;padding:6px 10px;"><strong>Change these only if you are sure.</strong> Water productivity (WP*), canopy growth/decline rates, Kcb, harvest-index stress effects and the water-stress thresholds are <em>conservative</em>: they are meant to stay nearly constant across sites, seasons and cultivars of a crop. Edit them only with values calibrated under real, well-controlled field conditions (your own trial data or a published calibration). Guessing here shifts every simulation that uses this crop.</div>
        <label style="display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:0.88rem;color:var(--paper);"><input type="checkbox" id="cal-adv-unlock" style="width:auto;"> I understand — unlock editing of conservative parameters</label>
        <div id="cal-adv-body" class="grid cols-2">
          <div>
            <fieldset>
              <legend>Canopy growth &amp; decline rates</legend>
              <label style="display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:0.85rem;color:var(--paper);"><input type="checkbox" id="cal-autoRates" style="width:auto;" checked> Auto-derive canopy growth/decline rate from stage lengths (recommended)</label>
              <div class="row-inline">
                <div class="field"><label>Canopy growth coefficient, CGC (/day)</label><input type="number" id="cal-CGC" step="0.001" min="0.001" max="0.5"></div>
                <div class="field"><label>Canopy decline coefficient, CDC (/day)</label><input type="number" id="cal-CDC" step="0.001" min="0.001" max="0.5"></div>
              </div>
              <div class="hint">Uncheck to set literal calibrated coefficients — the way a calibrated AquaCrop crop file specifies them directly.</div>
            </fieldset>

            <fieldset>
              <legend>Transpiration &amp; ageing</legend>
              <div class="row-inline">
                <div class="field"><label>Crop coefficient at full canopy, Kcb</label><input type="number" id="cal-Kcb" step="0.01" min="0.5" max="1.5"></div>
                <div class="field"><label>Late-season ageing decline (%/day)</label><input type="number" id="cal-fage" step="0.01" min="0" max="1"></div>
              </div>
            </fieldset>

            <fieldset>
              <legend>Biomass &amp; harvest-index response</legend>
              <div class="row-inline">
                <div class="field"><label>Normalized water productivity, WP* (g/m²)</label><input type="number" id="cal-WP" step="0.5" min="5" max="45"></div>
                <div class="field"><label>WP adjustment in yield formation (%)</label><input type="number" id="cal-WPyield" step="1" min="50" max="150"></div>
              </div>
              <div class="row-inline">
                <div class="field"><label>HI boost from mild pre-flowering stress (%)</label><input type="number" id="cal-dHIpre" step="0.5" min="0" max="20"></div>
                <div class="field"><label>HI penalty from late-season stress (%)</label><input type="number" id="cal-bHI" step="0.5" min="0" max="20"></div>
              </div>
            </fieldset>
          </div>
          <div>
          <fieldset>
            <legend>Water stress response thresholds</legend>
            <div class="hint" style="margin-top:-4px;margin-bottom:10px;">Each p is the fraction of total available water depleted before that response kicks in — lower p means more sensitive. Shape controls how abruptly the response ramps up (higher = more abrupt).</div>
            <div class="row-inline">
              <div class="field"><label>Canopy expansion threshold, p<sub>exp</sub></label><input type="number" id="cal-pExpUpper" step="0.05" min="0" max="1"></div>
              <div class="field"><label>Expansion response shape</label><input type="number" id="cal-shapeExp" step="0.1" min="0.5" max="8"></div>
            </div>
            <div class="row-inline">
              <div class="field"><label>Stomatal closure threshold, p<sub>sto</sub></label><input type="number" id="cal-pSto" step="0.05" min="0" max="1"></div>
              <div class="field"><label>Stomatal response shape</label><input type="number" id="cal-shapeSto" step="0.1" min="0.5" max="8"></div>
            </div>
            <div class="row-inline">
              <div class="field"><label>Early senescence threshold, p<sub>sen</sub></label><input type="number" id="cal-pSen" step="0.05" min="0" max="1"></div>
              <div class="field"><label>Senescence response shape</label><input type="number" id="cal-shapeSen" step="0.1" min="0.5" max="8"></div>
            </div>
            <div class="field"><label>Pollination-failure threshold, p<sub>pol</sub> (blank = not sensitive)</label><input type="number" id="cal-pPol" step="0.05" min="0" max="1"></div>
          </fieldset>
          </div>
        </div>
      </details>
    </div>

    <div class="panel">
      <h2>Canopy development preview<small>Canopy cover over the crop's default cycle length, unstressed, using the parameters above. Add satellite NDVI below to check it.</small></h2>
      <div class="chartwrap"><div id="cal-preview-chart"></div></div>
      <div id="cal-sat"></div>
    </div>`;
  }

  const ADV_FIELDS = ["CGC", "CDC", "Kcb", "fage", "WP", "WPyield", "dHIpre", "bHI", "pExpUpper", "shapeExp", "pSto", "shapeSto", "pSen", "shapeSen", "pPol"];
  const BOOL_FIELDS = ["forage", "ponded", "useManualRates"];
  function cropKeyFromName(name) {
    const n = String(name || "").trim().toLowerCase();
    return Object.keys(CROPS).find(k => k.toLowerCase() === n || CROPS[k].label.toLowerCase() === n) || null;
  }
  // Every parameter of a crop as [name, value] rows (the effective values, built-in + overrides)
  function cropParamRows(cropKey) {
    const c = getCropDef(cropKey), rows = [];
    CAL_FIELDS.forEach(f => { if (c[f] != null) rows.push([f, c[f]]); });
    if (!c.useManualRates) { const r = deriveCanopyRates(c); rows.push(["CGC", +r.CGC.toFixed(5)], ["CDC", +r.CDC.toFixed(5)]); }
    PHENO_FORM.forEach(([k]) => { if (c.cycle[k] != null) rows.push(["cycle." + k, c.cycle[k]]); });
    if (c.gddCycle) PHENO_FORM.forEach(([k]) => { if (c.gddCycle[k] != null) rows.push(["gddCycle." + k, c.gddCycle[k]]); });
    BOOL_FIELDS.forEach(f => rows.push([f, c[f] ? 1 : 0]));
    return rows;
  }
  function cropParamsCSV(cropKeys) {
    const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
    const out = ["# AquaCrop-Web crop parameters — one row per parameter; edit values and re-import", "crop,parameter,value"];
    cropKeys.forEach(k => cropParamRows(k).forEach(([p, v]) => out.push([q(CROPS[k].label), p, v].join(","))));
    return out.join("\n") + "\n";
  }
  // rows → { cropKey: patch }, plus warnings
  function parseCropParamRows(rows) {
    const warns = [], patches = {};
    rows = rows.filter(r => r.length && !String(r[0]).trim().startsWith("#") && r.some(c => String(c).trim() !== ""));
    const hi = rows.findIndex(r => r.some(c => /^parameter$/i.test(String(c).trim())));
    if (hi < 0) throw new Error("no 'parameter' column found — expected columns: crop, parameter, value");
    const head = rows[hi].map(c => String(c).trim().toLowerCase());
    const ic = head.indexOf("crop"), ip = head.indexOf("parameter");
    let iv = head.indexOf("calibrated"); if (iv < 0) iv = head.indexOf("value");
    if (iv < 0) throw new Error("no 'value' (or 'calibrated') column found");
    const seen = {};
    rows.slice(hi + 1).forEach(r => {
      const pn = String(r[ip] == null ? "" : r[ip]).trim(); if (!pn || pn.startsWith("#")) return;
      const key = cropKeyFromName(ic >= 0 ? r[ic] : null);
      if (!key) { const nm = ic >= 0 ? String(r[ic]).trim() : ""; if (nm && !warns.includes(`crop "${nm}" not recognised — rows skipped`)) warns.push(`crop "${nm}" not recognised — rows skipped`); return; }
      const raw = r[iv], p = (patches[key] = patches[key] || { _cyc: {}, _gdd: {} });
      seen[key] = seen[key] || new Set(); seen[key].add(pn);
      if (pn.startsWith("cycle.")) { const v = toNum(raw); if (!isNaN(v)) p._cyc[pn.slice(6)] = v; return; }
      if (pn.startsWith("gddCycle.")) { const v = toNum(raw); if (!isNaN(v)) p._gdd[pn.slice(9)] = v; return; }
      if (BOOL_FIELDS.includes(pn)) { const t = String(raw).trim().toLowerCase(); p[pn] = t === "1" || t === "true" || t === "yes"; return; }
      if (CAL_FIELDS.includes(pn)) { if (String(raw).trim() === "" && pn === "pPol") { p[pn] = null; return; } const v = toNum(raw); if (!isNaN(v)) p[pn] = v; else warns.push(`${CROPS[key].label}: ${pn} = "${raw}" is not a number — ignored`); return; }
      warns.push(`unknown parameter "${pn}" ignored`);
    });
    Object.keys(patches).forEach(key => {
      const p = patches[key], base = getCropDef(key);
      if (Object.keys(p._cyc).length) p.cycle = Object.assign({}, base.cycle, p._cyc);
      if (Object.keys(p._gdd).length) p.gddCycle = Object.assign({}, base.gddCycle || {}, p._gdd);
      delete p._cyc; delete p._gdd;
      if (!("useManualRates" in p) && seen[key].has("CGC") && seen[key].has("CDC")) p.useManualRates = true;
    });
    return { patches, warns };
  }

  // ---------- Satellite NDVI on the canopy development review (+ optional fit of the canopy to NDVI) ----------
  const satCache = new Map();
  function mountSeasonSatellite(host, o) {
    const thisYear = new Date().getFullYear(), yearOpts = [];
    for (let y = thisYear; y >= 2017; y--) yearOpts.push(`<option value="${y}">${y}</option>`);
    host.innerHTML = `<div style="margin-top:18px;border-top:1px solid var(--line-soft);padding-top:12px;">
      <h3 style="margin-top:0;">Check against satellite — Sentinel-2 NDVI</h3>
      <div class="hint" style="margin-bottom:10px;">Pick the growing season to read. NDVI measured at your field coordinates is added to the canopy chart above (<span style="color:#7cab5a">▬</span> simulated canopy cover in %, left axis; <span style="color:#e8b04a">●</span> NDVI, right Y2 axis), so you can judge whether the canopy timing and shape make sense.</div>
      <div class="grid cols-3">
        <div class="field"><label>1 · Growing-season year</label><select data-sat="year"><option value="">Select a year…</option>${yearOpts.join("")}</select></div>
        <div class="field"><label>Planting date</label><input type="date" data-sat="start"></div>
        <div class="field"><label>Harvest / season end</label><input type="date" data-sat="end"></div>
      </div>
      <div class="hint" data-sat="loc"></div>
      <div class="btnrow" style="align-items:center;gap:10px;flex-wrap:wrap;">
        <button class="btn secondary" data-sat="go" disabled>2 · Fetch NDVI</button>
        <span data-sat="status"><span class="status">Select a year to enable.</span></span>
      </div>
      <div class="hint" data-sat="stats"></div>
      <div data-sat="fitbox" style="display:none;margin-top:10px;border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;">
        <strong>3 · Adjust the growing-season pattern to the NDVI</strong>
        <div class="hint" style="margin:6px 0;">Keeps the canopy-cover range (CC₀ and CCx) exactly as set above and assumes canopy cover is proportional to NDVI: the season's NDVI is rescaled onto that range and the growth coefficient (CGC), decline coefficient (CDC), full-canopy day and senescence start are refitted so the curve follows the NDVI pattern in time. NDVI also sees soil background and saturates when the canopy is dense, so the shape is more reliable than any single value — check it against more than one season.</div>
        <div class="btnrow" style="align-items:center;gap:10px;flex-wrap:wrap;">
          <button class="btn" data-sat="fit">Adjust season pattern to NDVI</button>
          <button class="btn ghost" data-sat="undo" disabled>Undo adjustment</button>
          <span data-sat="fitmsg"></span>
        </div>
      </div>
      <div class="hint" style="margin-top:10px;">Data: Sentinel-2 L2A from the Earth Search catalogue (free, no key), clouds and shadows removed with the scene classification layer; red and near-infrared reflectances are averaged over the 3×3 pixels (≈30 m) at the field coordinates before NDVI = (NIR−Red)/(NIR+Red) is formed, so values stay within −1…1. Make sure the coordinates fall inside the field. Only a few image tiles around the point are downloaded (a few MB per clear scene), so it can take a minute.</div></div>`;
    const q = k => host.querySelector(`[data-sat="${k}"]`);
    const keyNow = () => [sharedLocation.lat, sharedLocation.lon, q("start").value, q("end").value].join("|");
    const showLoc = () => { q("loc").textContent = `Location: ${sharedLocation.lat.toFixed(4)}, ${sharedLocation.lon.toFixed(4)} (set on the Location tab).`; };
    // NDVI points for the selected season, as day-after-planting, or null
    function overlay() {
      const series = satCache.get(keyNow()); if (!series || !q("start").value || !q("end").value) return null;
      const start = q("start").value, seasonDays = daysBetweenISO(start, q("end").value) + 1;
      const pts = series.points.map(p => Object.assign({}, p, { day: daysBetweenISO(start, p.date) + 1 })).filter(p => p.day >= 1 && p.day <= seasonDays);
      return { pts, seasonDays, series };
    }
    function update() {
      const ov = overlay();
      if (!ov) { q("stats").textContent = ""; q("fitbox").style.display = "none"; o.onChange(); return; }
      const cmp = compareWithSimulation(ov.pts, o.getDaily(ov.seasonDays)), f = (v, d) => v == null || isNaN(v) ? "–" : v.toFixed(d);
      let t = `${ov.series.nScenes} Sentinel-2 scene${ov.series.nScenes === 1 ? "" : "s"} found in the season, ${ov.pts.length} clear at this point.`;
      if (ov.series.errors.length) t += ` ${ov.series.errors.length} could not be read (${ov.series.errors[0]}).`;
      if (ov.pts.length >= 3) t += ` Simulated canopy vs NDVI: r = ${f(cmp.r, 2)}, RMSE = ${f(cmp.rmse, 3)}. Day each reaches 90% of its seasonal peak — simulated: ${f(cmp.fullSim, 0)}, NDVI: ${f(cmp.fullNdvi, 0)}.`;
      else if (ov.pts.length) t += " Too few clear scenes for a comparison — try another year or check the coordinates.";
      else t += " No usable observations — the point may be cloudy all season or outside coverage.";
      q("stats").textContent = t;
      q("fitbox").style.display = ov.pts.length >= 5 ? "" : "none";
      o.onChange();
    }
    q("year").addEventListener("change", () => {
      const y = q("year").value;
      if (!y) { q("go").disabled = true; q("status").innerHTML = '<span class="status">Select a year to enable.</span>'; update(); return; }
      const sow = document.getElementById("main-sowdate"), md = sow && /^\d{4}-\d{2}-\d{2}$/.test(sow.value) ? sow.value.slice(5) : "04-15";
      q("start").value = `${y}-${md}`; q("end").value = isoAdd(q("start").value, Math.max(30, o.getSeasonDays()) - 1);
      q("go").disabled = false; showLoc();
      q("status").innerHTML = '<span class="status">Check the season dates, then fetch.</span>';
      update();
    });
    ["start", "end"].forEach(k => q(k).addEventListener("change", update));
    q("go").addEventListener("click", async () => {
      const st = q("status"), start = q("start").value, end = q("end").value;
      if (!start || !end || end <= start) { st.innerHTML = '<span class="status err">Enter a planting date and a later harvest date.</span>'; return; }
      if (daysBetweenISO(start, end) > 400) { st.innerHTML = '<span class="status err">Season longer than 400 days — shorten it.</span>'; return; }
      showLoc(); q("go").disabled = true;
      try {
        if (!satCache.has(keyNow())) {
          st.innerHTML = '<span class="spinner"></span>Searching Sentinel-2 scenes…';
          const series = await fetchSatelliteSeries(sharedLocation.lat, sharedLocation.lon, start, end, { evi: false, onProgress: (d, n) => { st.innerHTML = `<span class="spinner"></span>Reading scene ${Math.min(d + 1, n)} of ${n}…`; } });
          satCache.set(keyNow(), series);
        }
        update();
        st.innerHTML = '<span class="status ok">Done.</span>' + (+start.slice(0, 4) >= new Date().getFullYear() && end > new Date().toISOString().slice(0, 10) ? ' <span class="status">The season extends past today — later scenes are not available yet.</span>' : "");
      } catch (e) { st.innerHTML = `<span class="status err">Couldn't get satellite data: ${e.message}</span>`; }
      finally { q("go").disabled = false; }
    });
    q("fit").addEventListener("click", () => { const ov = overlay(); if (ov) { q("fitmsg").innerHTML = o.fit(ov.pts, ov.seasonDays); q("undo").disabled = false; } });
    q("undo").addEventListener("click", () => { q("fitmsg").innerHTML = o.undo(); q("undo").disabled = true; });
    return { overlay, update };
  }

  let reloadParametersForm = () => {};
  function initParametersPanel(container) {
    container.innerHTML = parametersFormHTML();
    const g = id => document.getElementById(id);
    const cropSel = g("cal-crop");

    function loadCropIntoForm(cropKey) {
      const c = getCropDef(cropKey);
      CAL_FIELDS.forEach(f => {
        const el = g("cal-" + f);
        if (!el) return;
        const v = c[f];
        el.value = (v == null) ? "" : v;
      });
      PHENO_FORM.forEach(([k]) => {
        g("cal-cyc-" + k).value = c.cycle[k] == null ? "" : c.cycle[k];
        g("cal-gdd-" + k).value = c.gddCycle && c.gddCycle[k] != null ? c.gddCycle[k] : "";
      });
      g("cal-forage").checked = !!c.forage;
      g("cal-ponded").checked = !!c.ponded;
      g("cal-autoRates").checked = !c.useManualRates;
      toggleRateFields();
      updateStatus();
      renderPreview();
    }

    function applyAdvLock() {
      const unlocked = g("cal-adv-unlock").checked;
      g("cal-adv-body").querySelectorAll("input").forEach(el => { el.disabled = !unlocked; });
      toggleRateFields();
    }
    function toggleRateFields() {
      const auto = g("cal-autoRates").checked, locked = !g("cal-adv-unlock").checked;
      g("cal-CGC").disabled = auto || locked;
      g("cal-CDC").disabled = auto || locked;
      if (auto) {
        const c = getCropDef(cropSel.value);
        const rates = deriveCanopyRates(c);
        g("cal-CGC").value = rates.CGC.toFixed(4);
        g("cal-CDC").value = rates.CDC.toFixed(4);
      }
    }

    function updateStatus() {
      const base = CROPS[cropSel.value], cur = getCropDef(cropSel.value);
      const advChanged = ADV_FIELDS.some(f => (cur[f] == null ? null : cur[f]) !== (base[f] == null ? null : base[f]) && !((f === "CGC" || f === "CDC") && !cur.useManualRates)) || (!!cur.useManualRates !== !!base.useManualRates);
      g("cal-adv-flag").innerHTML = advChanged ? '<span style="color:#d98a1c;">· modified from built-in values</span>' : "";
      g("cal-status").innerHTML = isCalibrated(cropSel.value)
        ? '<span class="status ok">Custom calibrated values — used everywhere this crop is selected.</span>'
        : '<span class="status">Showing built-in defaults.</span>';
    }

    function applyFormToOverride() {
      const patch = {};
      CAL_FIELDS.forEach(f => {
        const el = g("cal-" + f);
        if (!el) return;
        if (f === "pPol" && el.value === "") { patch[f] = null; return; }
        const v = parseFloat(el.value);
        if (!isNaN(v)) patch[f] = v;
      });
      const base = getCropDef(cropSel.value);
      const cyc = Object.assign({}, base.cycle), gc = {};
      PHENO_FORM.forEach(([k]) => {
        const dv = g("cal-cyc-" + k).value, gv = g("cal-gdd-" + k).value;
        if (dv !== "") cyc[k] = parseFloat(dv); else if (k === "flowering") cyc[k] = null;
        if (gv !== "") gc[k] = parseFloat(gv);
      });
      patch.cycle = cyc;
      patch.gddCycle = ["emergence", "maxCanopy", "senescStart", "maturity"].every(k => gc[k] != null) ? gc : undefined;
      patch.forage = g("cal-forage").checked;
      patch.ponded = g("cal-ponded").checked;
      patch.useManualRates = !g("cal-autoRates").checked;
      setCropOverride(cropSel.value, patch);
      updateStatus();
      renderPreview();
    }

    let satPanel = null;
    function previewDaily(nDays) {
      const c = getCropDef(cropSel.value), rates = c.useManualRates ? { CGC: c.CGC, CDC: c.CDC } : deriveCanopyRates(c), pc = Object.assign({}, c, rates);
      return Array.from({ length: nDays }, (_, i) => ({ day: i + 1, cc: canopyCoverBase(i + 1, pc) }));
    }
    function renderPreview() {
      const c = getCropDef(cropSel.value);
      const rates = c.useManualRates ? { CGC: c.CGC, CDC: c.CDC } : deriveCanopyRates(c);
      const previewCrop = Object.assign({}, c, rates);
      const nDays = c.cycle.maturity + 5;
      const data = [];
      for (let t = 1; t <= nDays; t++) data.push({ day: t, cc: canopyCoverBase(t, previewCrop) });
      const ov = satPanel && satPanel.overlay();
      if (ov && ov.pts.length) {
        const n = Math.max(nDays, ov.seasonDays);
        g("cal-preview-chart").innerHTML = ccNdviChart({ daily: previewDaily(n), pts: ov.pts, nDays: n });
        return;
      }
      g("cal-preview-chart").innerHTML = lineChart({ data, series: [{ key: "cc", color: "#7cab5a", area: true, label: "Canopy cover" }], nDays, yMax: 1.0, yFmt: v => (v * 100).toFixed(0) + "%" });
    }

    cropSel.addEventListener("change", () => { g("cal-adv-unlock").checked = false; loadCropIntoForm(cropSel.value); applyAdvLock(); });
    g("cal-adv-unlock").addEventListener("change", applyAdvLock);
    function handleFieldChange(e) {
      if (!e.target.closest("fieldset")) return;
      if (e.target.id === "cal-autoRates") toggleRateFields();
      applyFormToOverride();
    }
    container.addEventListener("input", handleFieldChange);
    container.addEventListener("change", handleFieldChange);
    g("cal-reset").addEventListener("click", () => {
      clearCropOverride(cropSel.value);
      loadCropIntoForm(cropSel.value);
    });

    // ---- import / export of crop parameters ----
    const ioMsg = (html) => { g("cal-io-status").innerHTML = html; };
    g("cal-export").addEventListener("click", () => {
      const k = cropSel.value;
      downloadText(`crop_parameters_${k}.csv`, cropParamsCSV([k]));
      ioMsg(`<span class="status ok">Exported ${CROPS[k].label}${isCalibrated(k) ? " (with your custom values)" : " (built-in values)"}.</span>`);
    });
    g("cal-export-all").addEventListener("click", () => {
      const ks = Object.keys(cropOverrides);
      if (!ks.length) { ioMsg('<span class="status">No crop has custom values yet — nothing to export. Use "Export this crop" for a built-in crop.</span>'); return; }
      downloadText("crop_parameters_customised.csv", cropParamsCSV(ks));
      ioMsg(`<span class="status ok">Exported ${ks.length} customised crop${ks.length > 1 ? "s" : ""}.</span>`);
    });
    g("cal-import").addEventListener("click", () => g("cal-import-file").click());
    g("cal-import-file").addEventListener("change", async () => {
      const files = [...(g("cal-import-file").files || [])]; if (!files.length) return;
      const loaded = [], warns = [], errs = [];
      for (const f of files) {
        try {
          const rows = await readTableFile(f);
          const { patches, warns: w } = parseCropParamRows(rows);
          warns.push(...w);
          Object.keys(patches).forEach(k => { setCropOverride(k, patches[k]); if (!loaded.includes(k)) loaded.push(k); });
          if (!Object.keys(patches).length) errs.push(`${f.name}: no recognised crop rows`);

    let fitUndo = null;
    function fitToNDVI(pts0, seasonDays) {
      const key = cropSel.value, c0 = getCropDef(key), prevOverride = cropOverrides[key] ? Object.assign({}, cropOverrides[key]) : null;
      const rates0 = c0.useManualRates ? { CGC: c0.CGC, CDC: c0.CDC } : deriveCanopyRates(c0);
      // CC0 and CCx stay as they are. NDVI is rescaled onto that range (its seasonal minimum → CC0, its peak → CCx),
      // so only the shape / timing of the season is taken from the satellite.
      const med3 = (i) => { const w = [pts0[Math.max(i - 1, 0)].ndvi, pts0[i].ndvi, pts0[Math.min(i + 1, pts0.length - 1)].ndvi].sort((a, b) => a - b); return w[1]; };
      const sm = pts0.map((p, i) => med3(i)), nMin = Math.min(...sm), nMax = Math.max(...sm);
      if (nMax - nMin < 0.15) return '<span class="status err">NDVI hardly changes over this season (range &lt; 0.15) — there is no growth pattern to follow. Check the coordinates and season dates.</span>';
      const pts = pts0.map(p => ({ day: p.day, ndvi: p.ndvi, t: Math.min(Math.max(c0.CCo + (p.ndvi - nMin) / (nMax - nMin) * (c0.CCx - c0.CCo), 0), c0.CCx) }));
      const mk = x => Object.assign({}, c0, { CGC: x[0], CDC: x[1], cycle: Object.assign({}, c0.cycle, { senescStart: x[2] }) });
      // Truncated-quadratic loss: points that miss by more than ~0.2 CC (a cloud-contaminated scene that slipped
      // through the mask) stop pulling on the fit, so the curve follows the majority pattern.
      const CAP = 0.2 * c0.CCx;
      const huber = (ps) => x => {
        if (x[0] < 0.01 || x[0] > 0.5 || x[1] < 0.005 || x[1] > 0.5 || x[2] < 15 || x[2] > seasonDays) return 1e6;
        const m = mk(x); return ps.reduce((a, p) => { const e = Math.abs(canopyCoverBase(p.day, m) - p.t); return a + Math.min(e * e, CAP * CAP); }, 0);
      };
      let used = pts;
      const sq = x => { const m = mk(x); return used.reduce((a, p) => a + (canopyCoverBase(p.day, m) - p.t) ** 2, 0); };
      const pk = pts.reduce((b, p) => p.t > b.t ? p : b, pts[0]).day;
      const after = pts.filter(p => p.day > pk && p.t < 0.9 * c0.CCx)[0];
      const starts = [c0.cycle.senescStart, after ? after.day - 5 : seasonDays * 0.7, pk + 15, seasonDays * 0.6].map(v => Math.min(Math.max(v, 20), seasonDays - 1));
      const search = ps => {
        let bst = null;
        starts.forEach(ts => [0.05, 0.12, rates0.CGC].forEach(cg => {
          const x0 = [Math.min(Math.max(cg, 0.02), 0.45), Math.min(Math.max(rates0.CDC, 0.01), 0.45), ts];
          const r = nelderMead(huber(ps), x0, [0.02, 0.02, 8], 600);
          if (!bst || r.f < bst.f) bst = r;
        }));
        return bst;
      };
      let best = search(pts), nOut = 0;
      // second pass: plain least squares on the points the first fit explains (within the cap)
      const res = pts.map(p => Math.abs(canopyCoverBase(p.day, mk(best.x)) - p.t));
      const keep = pts.filter((p, i) => res[i] <= CAP);
      if (keep.length < pts.length && keep.length >= 5) {
        nOut = pts.length - keep.length;
        const lsq = ps => x => { if (x[0] < 0.01 || x[0] > 0.5 || x[1] < 0.005 || x[1] > 0.5 || x[2] < 15 || x[2] > seasonDays) return 1e6; const m = mk(x); return ps.reduce((a, p) => a + (canopyCoverBase(p.day, m) - p.t) ** 2, 0); };
        const r2 = nelderMead(lsq(keep), best.x, [0.01, 0.01, 4], 600); if (r2.f <= lsq(keep)(best.x)) best = r2;
      }
      used = nOut ? keep : pts;
      const x = best.x, rmse = v => Math.sqrt(v / used.length), before = sq([rates0.CGC, rates0.CDC, c0.cycle.senescStart]);
      const m = mk(x);
      // full-canopy day: first day the fitted canopy reaches 98% of CCx (kept between emergence and senescence)
      let tMax = 1; while (tMax < x[2] && canopyGrowthPhase(tMax, m) < 0.98 * c0.CCx) tMax++;
      const cyc = Object.assign({}, c0.cycle, { senescStart: Math.round(x[2]), maxCanopy: Math.min(Math.max(tMax, c0.cycle.emergence + 1), Math.round(x[2]) - 1) });
      cyc.maturity = Math.max(cyc.maturity, cyc.senescStart + 1);
      fitUndo = { key, prevOverride };
      setCropOverride(key, { CGC: +x[0].toFixed(4), CDC: +x[1].toFixed(4), useManualRates: true, cycle: cyc });
      loadCropIntoForm(key); applyAdvLock(); refreshStageFieldsFor(key);
      return `<span class="status ok">Season pattern adjusted (CC₀ ${c0.CCo} and CCx ${c0.CCx} unchanged): CGC ${rates0.CGC.toFixed(3)} → ${x[0].toFixed(3)}, CDC ${rates0.CDC.toFixed(3)} → ${x[1].toFixed(3)}, full canopy day ${c0.cycle.maxCanopy} → ${cyc.maxCanopy}, senescence starts day ${c0.cycle.senescStart} → ${cyc.senescStart}. RMSE vs rescaled NDVI ${rmse(before).toFixed(3)} → ${rmse(sq(x)).toFixed(3)}${nOut ? ` (${nOut} outlying scene${nOut > 1 ? "s" : ""} ignored in the fit)` : ""}. Applied to the crop everywhere; the Advanced section shows the rates as modified.</span>`;
    }

      cropSel.value = key; loadCropIntoForm(key); applyAdvLock(); refreshStageFieldsFor(key);

  }

    function exportAll(kind) {

    function readExtra(text, planting) {
      const rows = parseDelimited(text.trim() ? text : "").filter(r => r.length && !String(r[0]).startsWith("#"));
      const out = { cc: [], biomass: [] };
      const raw = rows.map(r => ({ day: dayFromCell(r[0], planting, false), cc: toNum(r[1]), b: toNum(r[2]) })).filter(r => !isNaN(r.day) && r.day >= 1);
      const ccv = raw.map(r => r.cc).filter(v => !isNaN(v));

      raw.forEach(r => { if (!isNaN(r.cc)) out.cc.push({ day: Math.round(r.day), v: Math.min(r.cc / div, 1) }); if (!isNaN(r.b)) out.biomass.push({ day: Math.round(r.day), v: r.b }); });

    async function collectYears(statusEl, crop) {
