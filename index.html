        if (!planting || !harvest) throw new Error(`${label}: set planting and harvest dates`);
        if (harvest <= planting) throw new Error(`${label}: harvest must be after planting`);
        const nDays = Math.min(400, Math.max(20, daysBetweenISO(planting, harvest) + 1));
        const lat = parseFloat(g("lat").value), lon = parseFloat(g("lon").value);
        const wxMode = container.querySelector(`input[name="y${id}-wx"]:checked`).value;
        let weather;
        if (wxMode === "file") {
          if (!yearData[id].climateRows) throw new Error(`${label}: import a climate file, or switch to NASA POWER`);
          weather = seasonWeatherFromRows({ planting, climateRows: yearData[id].climateRows }, nDays, isNaN(lat) ? sharedLocation.lat : lat).weather;
        } else {
          if (isNaN(lat) || isNaN(lon)) throw new Error(`${label}: set latitude and longitude`);
          statusEl.innerHTML = `<span class="spinner"></span>Fetching NASA POWER for ${label}…`;
          try { weather = (await fetchPowerWeather(lat, lon, planting, nDays)).weather; }
          catch (e) { throw new Error(`NASA POWER failed for ${label} (${e.message}) — import a climate file for that year`); }
          yearData[id].lastWeather = { planting, lat, lon, weather };
        }
        let events = [];
        const irrMode = container.querySelector(`input[name="y${id}-irr"]:checked`).value;
        if (irrMode === "events") {
          const r = parseScheduleTable(parseDelimited(g("irrtext").value), planting);
          events = r.events;
          if (!events.length) throw new Error(`${label}: no valid irrigation events (use date,depth_mm per line) — or choose Rainfed`);
        }
        const stageDays = {};
        STAGE_INPUTS.forEach(([k]) => { const v = g("st-" + k).value; stageDays[k] = v ? daysBetweenISO(planting, v) + 1 : null; if (stageDays[k] != null && (stageDays[k] < 1 || stageDays[k] > nDays + 60)) throw new Error(`${label}: ${k} date is outside the season`); });
        const yv = parseFloat(g("yield").value);

          stageDays, yield: isNaN(yv) ? null : yv, yieldBasis: g("ybasis").value || defBasis, extra: readExtra(g("extra").value, planting), validation: g("hold").checked, irrMode });

    }

    $("cal2-run").addEventListener("click", async () => {

        const cropP = pheno ? Object.assign({}, crop0, { cycle: pheno.cycle }, pheno.gddCycle ? { gddCycle: pheno.gddCycle, Tbase: pheno.Tbase } : {}) : crop0;
        if (pheno) pheno.notes.forEach(n => notes.push(n));
        // 2. yield / parameters

        const seasons = runs.map(r => {
          const cyc = Object.assign({}, cropP.cycle);

          PHENO_KEYS.forEach(k => { if (r.stageDays[k] != null) cyc[k] = r.stageDays[k]; });
          if (r.stageDays.maturity == null) cyc.maturity = Math.max(r.nDays, cyc.senescStart + 3);
          cyc.maxCanopy = Math.max(cyc.maxCanopy, cyc.emergence + 1); cyc.senescStart = Math.max(cyc.senescStart, cyc.maxCanopy + 1); cyc.maturity = Math.max(cyc.maturity, cyc.senescStart + 1);
          if (r.nDays < cyc.maturity - 3) notes.push(`${r.label}: harvest (day ${r.nDays}) is before the maturity used (day ${cyc.maturity}) — simulated yield is truncated.`);

          return { label: r.label, validation: r.validation, yieldBasis: r.yieldBasis,
            obs: { cc: r.extra.cc, biomass: r.extra.biomass, yield: r.yield, events: [] },
            simulate: c => runSimulation({ crop: Object.assign({}, c, { cycle: cyc }), soil: r.soil, weather: r.weather, irrigationEvents: r.events, mgmt, phenologyMode: "calendar" }) };
        });

  function calibrationCSV(cropKey, crop0, patch, run) {
    const rows = [["crop", "parameter", "previous", "calibrated"]];
    const label = CROPS[cropKey].label;
    const rates0 = crop0.useManualRates && crop0.CGC != null ? { CGC: crop0.CGC, CDC: crop0.CDC } : deriveCanopyRates(crop0);
    Object.keys(patch).forEach(k => {
      const v = patch[k];
      if (v && typeof v === "object") {
        Object.keys(v).forEach(s => rows.push([label, `${k}.${s}`, crop0[k] && crop0[k][s] != null ? crop0[k][s] : "", v[s] == null ? "" : v[s]]));
      } else rows.push([label, k, k in crop0 ? crop0[k] : (k in rates0 ? rates0[k] : ""), v]);
    });
    rows.push([]);
    rows.push(["# years used", (run.years || []).join(" ")]);
    return rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n") + "\n";
  }

  function renderCalibrationResults(container, run, notes) {
    const { pheno, res, crop0 } = run;
    const f = (v, d) => v == null || isNaN(v) ? "–" : Number(v).toFixed(d);
    let html = "";
    if (pheno) {
      const rows = PHENO_KEYS.filter(k => pheno.calendar[k]).map(k => {
        const c = pheno.calendar[k], g = pheno.gdd && pheno.gdd[k];
        return `<tr><td>${PHENO_LABELS[k]}</td><td>${c.n}</td><td>${f(c.mean, 0)} ± ${f(c.sd, 1)}</td><td>${c.cv == null ? "–" : (c.cv * 100).toFixed(1) + "%"}</td>${pheno.gdd ? `<td>${g ? f(g.mean, 0) + " ± " + f(g.sd, 0) : "–"}</td><td>${g && g.cv != null ? (g.cv * 100).toFixed(1) + "%" : "–"}</td>` : ""}</tr>`;
      }).join("");
      html += `<h3 style="margin-top:18px;">Phenology (${pheno.nYears} year${pheno.nYears > 1 ? "s" : ""} with stage dates)</h3>
      <table class="wb"><thead><tr><th>Stage</th><th>Years</th><th>Days after planting</th><th>Spread (CV)</th>${pheno.gdd ? "<th>Accumulated GDD</th><th>Spread (CV)</th>" : ""}</tr></thead><tbody>${rows}</tbody></table>
      ${pheno.gdd ? `<div class="hint">Base temperature: ${f(pheno.TbaseBefore, 1)} → <strong>${f(pheno.Tbase, 1)} °C</strong> (chosen to minimise the timing error of the GDD model across years). A lower CV for GDD than for calendar days means heat units predict stage timing better than a fixed calendar.</div>` : ""}`;
    }
    if (res) {
      const pname = { CCx: "Max canopy cover, CCx", CGC: "Canopy growth coef., CGC (/day)", CDC: "Canopy decline coef., CDC (/day)", WP: "Water productivity, WP* (g/m²)", HI0: "Reference harvest index, HI₀ (%)", pExpUpper: "Canopy-expansion threshold, p<sub>exp</sub>", pSto: "Stomatal-closure threshold, p<sub>sto</sub>" };
      const dec = { CCx: 3, CGC: 4, CDC: 4, WP: 1, HI0: 1, pExpUpper: 3, pSto: 3 };
      const prow = res.params.map(p => `<tr><td>${pname[p.key]}</td><td>${f(p.before, dec[p.key])}</td><td><strong>${f(p.after, dec[p.key])}</strong></td><td>${p.fitted ? "fitted" : "kept (not constrained by data)"}</td></tr>`).join("");
      const sv = (o, k, d) => o && o[k] != null ? o[k].toFixed(d) : "–";
      const vars = [["cc", "Canopy cover (fraction)", 3], ["biomass", "Biomass (t/ha)", 2], ["yield", "Yield, dry (t/ha)", 2]];
      const statTable = (sb, sa) => `<table class="wb"><thead><tr><th>Variable</th><th>n</th><th>RMSE before</th><th>RMSE after</th><th>R² before</th><th>R² after</th><th>Bias (sim − obs)</th></tr></thead><tbody>${vars.filter(v => sa[v[0]]).map(v => { const b = sb[v[0]], a = sa[v[0]]; return `<tr><td>${v[1]}</td><td>${a.n}</td><td>${sv(b, "rmse", v[2])}</td><td><strong>${sv(a, "rmse", v[2])}</strong></td><td>${sv(b, "r2", 2)}</td><td><strong>${sv(a, "r2", 2)}</strong></td><td>${sv(b, "bias", v[2])} → ${sv(a, "bias", v[2])}</td></tr>`; }).join("")}</tbody></table>`;
      const multi = res.perSeason.length > 1;
      if (res.params.length) html += `<h3>Yield / biomass parameters</h3><table class="wb"><thead><tr><th>Parameter</th><th>Before</th><th>Calibrated</th><th></th></tr></thead><tbody>${prow}</tbody></table>`;
      const anyStat = vars.some(v => res.statsAfterFit[v[0]]);
      if (anyStat) html += `<h3>Goodness of fit${multi ? " — fitting years pooled" : ""}</h3>${statTable(res.statsBeforeFit, res.statsAfterFit)}`;

      const withY = res.perSeason.filter(s => s.targetDry != null);
      if (withY.length) html += `<h3>Yield by year (dry matter, t/ha)</h3><table class="wb"><thead><tr><th>Year</th><th>Role</th><th>Observed</th><th>Before</th><th>After</th><th>Error after</th></tr></thead><tbody>${withY.map(s => { const a = s.after.summary.yieldTha; return `<tr><td>${s.label}</td><td>${s.validation ? "validation" : "fit"}</td><td>${f(s.targetDry, 2)}</td><td>${f(s.before.summary.yieldTha, 2)}</td><td><strong>${f(a, 2)}</strong></td><td>${((a - s.targetDry) / s.targetDry * 100).toFixed(1)}%</td></tr>`; }).join("")}</tbody></table><div class="hint">Fresh-weight equivalent = dry ÷ ${f(crop0.dm || 1, 2)} for years entered as fresh weight.</div>`;
      if (withY.length) {
        const k = crop0.dm ? 1 / crop0.dm : 1, basisTxt = crop0.dm ? "fresh weight" : "dry matter";
        const pts = withY.map(s => ({ label: s.label, validation: !!s.validation, obs: s.targetDry * k, before: s.before.summary.yieldTha * k, after: s.after.summary.yieldTha * k }));
        const st = fitStats(pts.map(p => ({ o: p.obs, s: p.after }))), stB = fitStats(pts.map(p => ({ o: p.obs, s: p.before }))), r2f = v => v == null ? "–" : f(v, 2);
        html += `<h3>Measured vs simulated yield (${basisTxt}, t/ha)</h3><div class="chartwrap">${scatterChart({ pts, unit: "t/ha " + (crop0.dm ? "fresh" : "dry") })}</div><div class="hint"><span style="color:#2f7d46">●</span> after calibration (fit years) · <span style="color:#d98a1c">◆</span> after calibration (validation years) · <span style="color:#9a9a9a">○</span> before calibration · dashed line = 1:1. All years: RMSE ${f(stB.rmse, 2)} → <strong>${f(st.rmse, 2)}</strong> t/ha (${crop0.dm ? "fresh" : "dry"}), R² ${r2f(stB.r2)} → <strong>${r2f(st.r2)}</strong>, n = ${pts.length}.</div>`;

        let c = "";
        if (s.statsAfter.cc) c += `<h3>Canopy cover</h3><div class="chartwrap">${fitChart({ nDays: s.nDays, obs: s.obsCCpts, curves: cv(d => d.cc), yMax: 1, yFmt: v => (v * 100).toFixed(0) + "%", name: "Canopy cover" })}</div>`;

        return c;
      };

    }
    html += notes.length ? `<div class="hint" style="margin-top:8px;">${notes.map(n => "• " + n).join("<br>")}</div>` : "";
    html += `<div class="btnrow" style="margin-top:14px;"><button class="btn" id="cal2-apply">Update parameters</button>
      <label style="font-size:0.85rem;display:flex;gap:6px;align-items:center;"><input type="checkbox" id="cal2-export" checked style="width:auto;"> also export the calibrated parameters as a CSV file</label>
      <span id="cal2-apply-msg"></span></div>`;

  }

  // ---------------------------------------------------------------
  // METHODOLOGY TAB



  // ---------------------------------------------------------------
  const methodologyHTML = `
  <div class="panel methodology">
    <h2>How this model works</h2>
    <p><strong>AquaCrop-Web</strong> is an independent, browser-based re-implementation of the core conceptual model behind FAO's AquaCrop — <em>canopy cover as the driver of transpiration, water-driven biomass accumulation, and a harvest index that responds to water stress at different growth stages</em>. It follows the published equations and logic of Steduto, Raes, Hsiao &amp; Fereres (2009, <em>Agronomy Journal</em> 101:426–437, and companion Papers II–IV) and the FAO Irrigation &amp; Drainage Paper 66 reference manual, but it is <strong>not</strong> the official FAO AquaCrop software and does not read or write AquaCrop's native project files. For the authoritative, fully validated model — including salinity, CO₂ response, multi-year perennials and field-calibrated crop files — use the official release at the <a href="https://github.com/un-fao/fao-AquaCrop" target="_blank" rel="noopener">un-fao/fao-AquaCrop</a> repository.</p>

    <h3>Parameter groups and the satellite check</h3>
    <p>On the <strong>Parameters</strong> tab, cultivar- and management-dependent values (stage timing, CC₀, CCx, root depth, HI₀) are edited directly. The <em>conservative</em> parameters — WP*, canopy growth/decline rates, Kcb, harvest-index stress effects and the water-stress thresholds — sit in a collapsed Advanced section that stays locked until you confirm; change them only with values calibrated under real, controlled field conditions. Any crop can be exported to, and re-imported from, a small CSV (<code>crop, parameter, value</code>). When a simulation runs, NDVI for the simulated season is fetched automatically and added to the Results canopy-cover chart on a second (right) axis. In the canopy development review on the Parameters tab, the <strong>satellite check</strong> (choose a growing-season year) downloads Sentinel-2 L2A reflectance from the free Earth Search STAC catalogue (AWS Open Data), masks clouds/shadows with the scene classification layer, averages the reflectances over a 3×3-pixel window at the field coordinates and computes NDVI = (NIR−Red)/(NIR+Red). NDVI is plotted on the canopy preview as a plausibility check of timing and shape, and an optional button keeps CC₀ and CCx and refits CGC, CDC and the senescence timing so the season follows the NDVI pattern (NDVI rescaled onto the CC range); NDVI is a vegetation index, not canopy cover (it includes soil background and saturates at high cover), so treat the fit as a starting point.</p>
    <h3>Canopy cover (CC)</h3>
    <p>Canopy cover grows from an initial value CC₀ through an exponential phase, transitions to a logistic phase as it approaches CCx, then declines exponentially after the onset of senescence:</p>
    <div class="eq">Growth (CC ≤ CCx/2):   CC(t) = CC₀ · exp(CGC·t)
Growth (CC &gt; CCx/2):   CC(t) = CCx − 0.25·(CCx−CC₀)²/CC₀ · exp(−CGC·t)
Decline:                 CC(t) = CCx · [1 − 0.05·(exp(CDC·(t−t_sen)/CCx) − 1)]</div>
    <p>CGC and CDC are derived per crop from the days-to-max-canopy and days-to-maturity you'd expect for that crop, rather than transcribed growing-degree-day coefficients, so that canopy timing stays internally consistent in calendar-day mode across every crop in the database. Canopy expansion is throttled by the Ks<sub>exp</sub> water-stress coefficient during the growing phase, and senescence is accelerated by Ks<sub>sen</sub> under stress late in the season, matching AquaCrop's qualitative behaviour.</p>

    <h3>Growth-stage timing: calendar days or growing degree-days</h3>
    <p>By default every growth-stage threshold (emergence, max canopy, senescence, flowering, maturity) is a fixed number of calendar days after sowing — simple, but it means the same crop grows at the same pace regardless of how warm or cool the season actually is. Each scenario can instead be switched to <strong>growing degree-days (GDD)</strong>: the same thresholds are reinterpreted as accumulated heat units rather than day counts, and the crop moves through its growth stages as fast as the weather allows.</p>
    <div class="eq">GDD(day) = (min(Tmax,T_upper) + max(Tmin,T_base)) / 2 − T_base,  floored at 0
Accumulated GDD = Σ GDD(day)  since sowing</div>
    <p>In GDD mode the canopy, root-growth, senescence, flowering and harvest-index equations above all run on accumulated GDD instead of elapsed days — a cool spell simply slows the crop down, a heat wave speeds it up. Everything else (irrigation scheduling by fixed calendar dates, the Kcb ageing decline, and the water balance itself) still runs on the literal calendar-day loop, since those aren't phenological in the same sense. GDD mode needs daily Tmax/Tmin, which NASA POWER always supplies; an uploaded CSV needs optional <code>tmax,tmin</code> columns for it — without them, no heat units accrue and the crop won't develop. Stage timing is no longer entered in the scenario: it is read from the crop's Parameters tab (days, or the GDD column in GDD mode). Where no GDD thresholds are stored, the day values are converted with a rough ~24°C seasonal-average heuristic; enter real GDD requirements, or calibrate them, on the Parameters tab.</p>
    <h3>Importing schedules and calibrating from field data</h3>
    <p>A fixed irrigation calendar can be imported from an .xlsx or .csv file (first worksheet) with a <code>day</code> or <code>date</code> column and a depth column; dates are converted to days after sowing from the scenario's sowing date.</p>
    <p>The <strong>Calibration</strong> tab takes field data for one or several years (one sub-tab each, or one season file per year): coordinates or an imported climate file, planting and harvest dates, soil, irrigation dates and depths, measured yield, observed phenological stage dates and, optionally, canopy cover and biomass. Calibration has two parts. <em>Phenology:</em> the observed stage dates give mean stage lengths in calendar days; if daily Tmax/Tmin are available, the base temperature is chosen to minimise the timing error of the accumulated-GDD model across years (relative GDD spread at each stage × its mean day count) and the GDD thresholds are the mean accumulated GDD at the observed dates. <em>Yield and biomass:</em> each year is simulated with its own climate, soil, irrigation and observed stage timing, and the parameters are fitted by re-running the full daily water balance: if canopy points are given, a Nelder–Mead search over CCx, CGC and CDC minimises canopy-cover error; because simulated biomass is exactly proportional to WP*, WP* is rescaled by least squares to match any biomass data; and HI₀ is solved (golden-section search) so that simulated yields match the observed yields across the fitting years (for forage crops, WP* is rescaled instead). Years can be held out for validation. Optionally p<sub>exp</sub> and p<sub>sto</sub> are fitted jointly with HI₀ when the years differ in water stress. Without biomass data, WP* and HI₀ are confounded (yield depends on their product); a few biomass samples in one year resolve it. All the data entered (settings, years, dates, soil, irrigation, yield, stage dates, climate and observations) can be exported to, and re-imported from, one workbook or sectioned CSV file. A single button then pushes the results to the Parameters tab and can export them as a CSV file. Parameters calibrated on a few years at one site may not transfer — validate on a held-out year where possible.</p>

    <h3>Soil water balance</h3>
    <p>A single root-zone "bucket" tracks water content between wilting point and field capacity as the root front (Z<sub>r</sub>) deepens from Z<sub>min</sub> to Z<sub>max</sub>. Daily inflows are rainfall and irrigation; the SCS curve-number method partitions rainfall into runoff and infiltration; water above field capacity drains out; soil evaporation follows a two-stage FAO-56 style Kr/TEW/REW formulation reduced by canopy shading, mulch and wetted fraction; transpiration is canopy-cover- and stress-limited.</p>
    <div class="eq">TAW = 1000·(θ_FC − θ_WP)·Z_r        (total available water, mm)
Dr  = TAW · depletion fraction      (root-zone depletion, mm)
Tr  = Kcb(age) · CC · ETo · Ks_sto
Es  = Kr · Kx · ETo · (1−CC) · wetted fraction · mulch factor</div>

    <h3>Water stress coefficients (Ks)</h3>
    <p>Each stress response (canopy expansion, stomatal closure, senescence acceleration, pollination failure) is a curved function of relative root-zone depletion crossing a crop-specific threshold <em>p</em>, following the convex/concave response shapes used throughout the AquaCrop literature:</p>
    <div class="eq">Ks(D) = 1                                  for D/TAW ≤ p
Ks(D) = 1 − [exp(s·x) − 1] / [exp(s) − 1]   for D/TAW &gt; p,  x = (D/TAW − p)/(1−p)</div>

    <h3>Biomass and yield</h3>
    <p>Above-ground biomass accumulates in proportion to normalized transpiration, using each crop's normalized water productivity WP* (g/m² per unit of Σ Tr/ETo) — this is the central "water-driven" mechanism that distinguishes AquaCrop from crop models built around radiation-use efficiency:</p>
    <div class="eq">B = WP* · Σ (Tr / ETo)
Yield_dry = B · HI          Yield_fresh = Yield_dry / (dry-matter fraction)</div>
    <p>Harvest index builds up logistically over the yield-formation period, nudged upward by mild pre-flowering stress (a known AquaCrop mechanism — bounded here to a modest effect) and reduced by severe stress during flowering (pollination failure) or the grain/fruit-fill period.</p>

    <h3>Climate data</h3>
    <p>The NASA POWER option calls <code>power.larc.nasa.gov</code> directly from your browser for daily Tmax/Tmin, mean relative humidity, 2 m wind speed and incoming shortwave radiation, and computes reference evapotranspiration with the full FAO-56 Penman-Monteith equation client-side — the same method used by AquaCrop's own ETo calculator. No data is sent to any server other than NASA's.</p>

    <h3>Assumptions &amp; limitations to know before you trust a number</h3>
    <ul>
      <li>Crop parameters are literature-informed defaults for teaching and scenario screening, not calibrated cultivar files — always compare against known local yields before drawing conclusions, and treat this as a starting point for calibration, the same way AquaCrop's own manual insists on.</li>
      <li>Phenology runs in calendar-day mode, not growing-degree-days, so cycle length doesn't shift with a warmer or cooler season the way it would in temperature-driven mode.</li>
      <li>The root zone is modeled as a single bucket rather than multiple discretized soil compartments, so within-profile moisture redistribution and capillary rise from a shallow water table are not represented.</li>
      <li>CO₂ fertilization response, soil salinity effects, pest/disease/weed pressure, and multi-cutting perennial management (beyond the single-cutting-interval alfalfa case) are not modeled.</li>
      <li>Fresh-weight yield conversion uses a fixed typical dry-matter fraction per crop; real dry-matter content varies with cultivar and maturity at harvest.</li>
    </ul>

    <div class="callout warn">This tool is for exploration, teaching, and rough scenario comparison — not for regulatory, contractual, or safety-critical water allocation decisions. For rigorous work, calibrate against field data or use the official FAO AquaCrop software.</div>
  </div>`;

  // ---------------------------------------------------------------

  function el(id) { return document.getElementById(id); }

  // Chart hover tooltips: one shared element, positioned near the cursor,
  // fed by data-tip attributes embedded in the chart SVGs. Delegated on
  // document so it keeps working after any chart's innerHTML is replaced.
  function initChartTooltips() {
    const tip = document.createElement("div");
    tip.className = "chart-tooltip";
    document.body.appendChild(tip);
    let current = null;

    function place(clientX, clientY) {
      const pad = 16;
      const vw = window.innerWidth, vh = window.innerHeight;
      const rect = tip.getBoundingClientRect();
      let x = clientX + pad, y = clientY + pad;
      if (x + rect.width > vw - 8) x = clientX - rect.width - pad;
      if (y + rect.height > vh - 8) y = clientY - rect.height - pad;
      tip.style.left = Math.max(4, x) + "px";
      tip.style.top = Math.max(4, y) + "px";
    }
    function show(target, clientX, clientY) {
      if (target !== current) {
        tip.innerHTML = target.getAttribute("data-tip");
        current = target;
      }
      tip.classList.add("visible");
      place(clientX, clientY);
    }
    function hide() { tip.classList.remove("visible"); current = null; }

    document.addEventListener("mousemove", (e) => {
      const target = e.target.closest("[data-tip]");
      if (target) show(target, e.clientX, e.clientY); else hide();
    });
    document.addEventListener("mouseout", (e) => {
      if (!e.relatedTarget || !e.relatedTarget.closest("[data-tip]")) hide();
    });
    document.addEventListener("scroll", hide, true);
    // basic touch support: tap a chart to show its tooltip, tap elsewhere to dismiss
    document.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      const el2 = document.elementFromPoint(t.clientX, t.clientY);
      const target = el2 && el2.closest("[data-tip]");
      if (target) show(target, t.clientX, t.clientY); else hide();
    }, { passive: true });
  }

          <div class="legend"><span><span class="sw" style="background:var(--canopy-400)"></span>A: ${a.label}</span><span><span class="sw" style="background:var(--water-400)"></span>B: ${b.label}</span></div></div></div>`;
        html += `<div class="panel"><h2>Root-zone depletion (% of TAW)</h2><div class="chartwrap"><div id="cmp-depl-chart"></div>
