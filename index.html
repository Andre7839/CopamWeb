<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaCrop-Web · UC Davis Advanced Irrigation Lab</title>
<style>
:root{
  --soil-950:#e8e8e5;
  --soil-900:#fbfbfa;
  --soil-800:#f1f1ef;
  --soil-700:#e0e0dc;
  --soil-600:#cfcfc9;
  --paper:#25241f;
  --paper-dim:#55534a;
  --paper-faint:#5f5d52;
  --canopy-500:#4a7a34;
  --canopy-400:#5c8a3f;
  --canopy-300:#2f5620;
  --water-500:#2c6690;
  --water-400:#3f80a8;
  --water-300:#1f4d6e;
  --ochre-500:#815918;
  --ochre-400:#b17f2e;
  --clay-500:#8a3c26;
  --clay-400:#a34a2f;
  --line:#b8b6a9;
  --line-soft:#d6d4c8;
  --radius:10px;
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono","Courier New",monospace;
  /* fixed colors for the map's floating overlay controls, which sit on top
     of variable tile imagery and stay dark regardless of the app theme */
  --map-ov-text:#f1eee3;
  --map-ov-text-dim:#cfccbf;
  --map-ov-border:#5c594e;
  --map-ov-accent:#8bc0e3;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--soil-950);
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(92,138,63,0.06), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(63,128,168,0.05), transparent 55%);
  color:var(--paper);
  font-family:var(--font-body);
  line-height:1.5;
  min-height:100vh;
}
::selection{background:var(--canopy-500);color:#fff;}
a{color:var(--water-300);}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0 0 0.4em 0;letter-spacing:0.01em;}
p{margin:0 0 0.8em 0;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

/* ---------- header ---------- */
header.top{
  border-bottom:1px solid var(--line);
  padding:26px 0 18px;
  margin-bottom:22px;
}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.brand h1{font-size:2.1rem;color:var(--paper);display:flex;align-items:baseline;gap:12px;}
.brand h1 .veg{color:var(--canopy-500);}
.brand h1 .drop{color:var(--water-500);}
.brand .lab{
  font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.09em;text-transform:uppercase;
  color:var(--ochre-500); margin-bottom:6px;
}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap;}
nav.tabs button{
  background:none;border:none;color:var(--paper-dim);font-family:var(--font-body);
  font-size:0.95rem;padding:12px 18px;cursor:pointer;position:relative;top:1px;
  border-bottom:2px solid transparent;letter-spacing:0.01em;
}
nav.tabs button:hover{color:var(--paper);}
nav.tabs button.active{color:var(--canopy-300);border-bottom-color:var(--canopy-400);}
.yeartabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 12px;border-bottom:1px solid var(--line);}
.yeartabs button{background:transparent;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;padding:7px 14px;font:inherit;font-size:0.86rem;color:var(--paper-dim);cursor:pointer;}
.yeartabs button:hover{color:var(--paper);}
.yeartabs button.active{color:var(--canopy-300);border-color:var(--line);background:var(--panel, transparent);font-weight:600;margin-bottom:-1px;}
.tabpanel{display:none;}
.tabpanel.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- cards / panels ---------- */
.panel{
  background:linear-gradient(180deg, var(--soil-900), var(--soil-800));
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:20px 22px;
  margin-bottom:18px;
  box-shadow:0 1px 2px rgba(30,28,20,0.05);
}
.panel h2{font-size:1.15rem;color:var(--paper);border-bottom:1px solid var(--line-soft);padding-bottom:10px;margin-bottom:16px;}
.panel h2 small{display:block;font-family:var(--font-body);font-weight:400;font-size:0.78rem;color:var(--paper-faint);margin-top:2px;letter-spacing:0;}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:820px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

label{display:block;font-size:0.78rem;color:var(--paper-dim);margin-bottom:5px;letter-spacing:0.02em;}
.field{margin-bottom:14px;}
select,input[type=text],input[type=number],input[type=date],input[type=file],textarea{
  width:100%;background:#fff;border:1px solid var(--line);color:var(--paper);
  padding:9px 10px;border-radius:6px;font-family:var(--font-body);font-size:0.92rem;
}
select:focus,input:focus,textarea:focus,button:focus-visible{
  outline:2px solid var(--water-400);outline-offset:1px;border-color:var(--water-400);
}
textarea{font-family:var(--font-mono);font-size:0.8rem;resize:vertical;}
.hint{font-size:0.76rem;color:var(--paper-faint);margin-top:4px;}
.row-inline{display:flex;gap:10px;}
.row-inline > *{flex:1;}

fieldset{border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px 14px;margin:0 0 14px;}
fieldset legend{font-size:0.78rem;color:var(--ochre-500);padding:0 6px;letter-spacing:0.03em;text-transform:uppercase;}
.radiorow{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
.radiorow label{display:flex;align-items:center;gap:6px;color:var(--paper);font-size:0.86rem;cursor:pointer;}
.radiorow input{width:auto;}
.mode-block{display:none;}
.mode-block.active{display:block;}

button.btn{
  background:var(--canopy-500);color:#fff;border:none;border-radius:8px;
  padding:12px 22px;font-size:0.95rem;font-weight:600;cursor:pointer;letter-spacing:0.01em;
  transition:background .15s, transform .1s;
}
button.btn:hover{background:var(--canopy-400);}
button.btn:active{transform:translateY(1px);}
button.btn.secondary{background:transparent;color:var(--water-300);border:1px solid var(--water-500);}
button.btn.secondary:hover{background:rgba(44,102,144,0.08);}
button.btn.ghost{background:transparent;color:var(--paper-dim);border:1px solid var(--line);padding:8px 14px;font-size:0.82rem;font-weight:500;}
button.btn.ghost:hover{color:var(--paper);border-color:var(--paper-faint);}
button.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

/* ---------- summary cards ---------- */
.stat{
  background:var(--soil-950);border:1px solid var(--line-soft);border-radius:8px;
  padding:14px 16px;
}
.stat .k{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--paper-faint);margin-bottom:6px;}
.stat .v{font-family:var(--font-mono);font-size:1.5rem;color:var(--paper);}
.stat .v span.unit{font-size:0.8rem;color:var(--paper-dim);margin-left:4px;}
.stat .v.green{color:var(--canopy-300);}
.stat .v.blue{color:var(--water-300);}
.stat .v.ochre{color:var(--ochre-500);}
.stat .v.clay{color:var(--clay-500);}

/* ---------- charts ---------- */
.chartwrap{background:var(--soil-950);border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px 10px;}
.chartwrap h3{font-size:0.86rem;color:var(--paper-dim);font-weight:600;margin-bottom:6px;font-family:var(--font-body);}
.chartwrap .chartnote{font-size:0.74rem;color:var(--paper-faint);margin-bottom:8px;}
svg.chart{width:100%;height:auto;display:block;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:0.74rem;color:var(--paper-dim);margin-top:6px;}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

/* ---------- soil profile signature ---------- */
.profile-wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
.profile-svg-box{flex:0 0 240px;}
.profile-readout{flex:1;min-width:260px;}
.daySlider{width:100%;margin:10px 0 14px;accent-color:var(--canopy-500);}
.dayLabel{font-family:var(--font-mono);font-size:0.85rem;color:var(--ochre-500);}
.readout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.readout-item{border-bottom:1px dashed var(--line-soft);padding:6px 0;font-size:0.85rem;display:flex;justify-content:space-between;}
.readout-item .lbl{color:var(--paper-dim);}
.readout-item .val{font-family:var(--font-mono);color:var(--paper);}

/* ---------- table ---------- */
table.wb{width:100%;border-collapse:collapse;font-size:0.86rem;}
table.wb th{text-align:left;color:var(--paper-faint);font-weight:500;font-size:0.74rem;text-transform:uppercase;letter-spacing:0.04em;padding:6px 10px;border-bottom:1px solid var(--line);}
table.wb td{padding:6px 10px;border-bottom:1px solid var(--line-soft);font-family:var(--font-mono);}
table.wb tr:last-child td{border-bottom:none;font-weight:600;color:var(--paper);}

/* ---------- methodology ---------- */
.methodology p, .methodology li{color:var(--paper-dim);font-size:0.92rem;}
.methodology h3{font-size:1rem;color:var(--paper);margin-top:22px;}
.methodology code{font-family:var(--font-mono);background:var(--soil-950);padding:1px 5px;border-radius:4px;font-size:0.85em;color:var(--canopy-300);}
.eq{font-family:var(--font-mono);background:var(--soil-950);border:1px solid var(--line-soft);border-radius:6px;padding:10px 14px;margin:10px 0;font-size:0.85rem;color:var(--water-300);overflow-x:auto;white-space:pre;}
.callout{border-left:3px solid var(--ochre-500);background:rgba(156,107,33,0.08);padding:12px 14px;border-radius:0 6px 6px 0;margin:14px 0;font-size:0.88rem;color:var(--paper);}
.callout.warn{border-left-color:var(--clay-500);background:rgba(138,60,38,0.08);}

/* ---------- crop card grid (setup helper) ---------- */
.cropmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:0.78rem;color:var(--paper-dim);margin-top:-4px;margin-bottom:14px;}
.cropmeta span{background:var(--soil-950);border:1px solid var(--line-soft);border-radius:20px;padding:3px 10px;}

/* ---------- location map ---------- */
.mapshell{position:relative;width:100%;height:460px;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#c8c7c0;cursor:grab;touch-action:none;}
.mapshell:active{cursor:grabbing;}
.maptiles{position:absolute;top:0;left:0;will-change:transform;}
.maptiles img{position:absolute;user-select:none;-webkit-user-drag:none;}
.mapmarker{position:absolute;pointer-events:none;z-index:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
.mapctrl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:6;align-items:flex-end;}
.mapbtn{background:rgba(24,19,16,0.82);color:var(--map-ov-text);border:1px solid var(--map-ov-border);border-radius:4px;width:28px;height:28px;font-size:1rem;cursor:pointer;line-height:1;}
.mapbtn.wide{width:auto;font-size:0.68rem;padding:4px 8px;height:auto;white-space:nowrap;}
.mapbtn:hover{border-color:var(--map-ov-accent);color:var(--map-ov-accent);}
.mapattrib{position:absolute;bottom:2px;right:6px;font-size:0.62rem;color:rgba(241,238,227,0.8);background:rgba(24,19,16,0.55);padding:1px 5px;border-radius:3px;z-index:6;max-width:70%;text-align:right;}
.mapattrib a{color:rgba(241,238,227,0.95);}
.latlon-readout{display:flex;gap:10px;margin-top:8px;}
.latlon-readout .field{flex:1;margin-bottom:0;}
.locsummary-box{background:var(--soil-950);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;font-family:var(--font-mono);font-size:0.88rem;color:var(--paper);}
.locsummary-box a{color:var(--water-300);font-family:var(--font-body);font-size:0.8rem;}

.mapsearch{position:absolute;top:8px;left:8px;z-index:7;width:min(340px, calc(100% - 100px));}
.mapsearch .searchrow{display:flex;gap:0;}
.mapsearchbox{flex:1;min-width:0;background:rgba(24,19,16,0.85);border:1px solid var(--map-ov-border);color:var(--map-ov-text);padding:8px 10px;border-radius:6px 0 0 6px;font-size:0.85rem;}
.mapsearchbtn{border-radius:0 6px 6px 0;background:rgba(24,19,16,0.85);}
.mapsearchresults{max-height:0;overflow:hidden auto;background:rgba(20,18,14,0.95);border:1px solid var(--map-ov-border);border-top:none;border-radius:0 0 6px 6px;}
.mapsearchresults.open{max-height:220px;}
.mapsearchresult{padding:8px 10px;font-size:0.8rem;color:var(--map-ov-text-dim);cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.08);}
.mapsearchresult:last-child{border-bottom:none;}
.mapsearchresult:hover{background:rgba(139,192,227,0.18);color:var(--map-ov-text);}
.mapsearchresult.muted{cursor:default;color:var(--map-ov-text-dim);font-style:italic;}
.mapsearchresult.muted:hover{background:none;color:var(--map-ov-text-dim);}

.mapbasemaps{position:absolute;bottom:8px;left:8px;z-index:6;display:flex;gap:3px;background:rgba(24,19,16,0.68);padding:3px;border-radius:6px;}
.mapbmbtn{background:transparent;color:var(--map-ov-text-dim);border:1px solid transparent;border-radius:4px;padding:5px 9px;font-size:0.7rem;cursor:pointer;font-family:var(--font-body);}
.mapbmbtn:hover{color:var(--map-ov-text);}
.mapbmbtn.active{background:var(--canopy-500);color:#fff;font-weight:600;}

/* ---------- compare ---------- */
.comparecol{border:1px solid var(--line-soft);border-radius:8px;padding:14px 16px;background:var(--soil-950);}
.comparecol h3{color:var(--paper);font-size:0.95rem;margin-bottom:10px;}

/* ---------- chart tooltips ---------- */
.chart-tooltip{
  position:fixed;z-index:9999;pointer-events:none;
  background:var(--soil-900);border:1px solid var(--line);border-radius:6px;
  padding:8px 11px;font-family:var(--font-mono);font-size:0.78rem;color:var(--paper);
  box-shadow:0 4px 16px rgba(30,28,20,0.16);max-width:260px;line-height:1.5;
  opacity:0;transition:opacity .08s ease;
}
.chart-tooltip.visible{opacity:1;}
.chart-tooltip .tip-title{font-weight:700;color:var(--paper);margin-bottom:4px;font-family:var(--font-body);font-size:0.8rem;border-bottom:1px solid var(--line-soft);padding-bottom:4px;}
.chart-tooltip .tip-row{display:flex;justify-content:space-between;align-items:center;gap:14px;white-space:nowrap;}
.chart-tooltip .tip-row .k{color:var(--paper-dim);display:flex;align-items:center;}
.chart-tooltip .tip-row .v{color:var(--paper);font-weight:600;}
.chart-tooltip .tip-sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;flex:none;}
svg.chart rect[pointer-events="all"]{cursor:crosshair;}

/* ---------- misc ---------- */
.status{font-size:0.85rem;color:var(--paper-faint);font-family:var(--font-mono);}
.status.ok{color:var(--canopy-300);}
.status.err{color:var(--clay-500);}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--canopy-400);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line-soft);color:var(--paper-faint);font-size:0.78rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.disabled-note{opacity:0.55;}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brandrow">
    <div class="brand">
      <div class="lab">UC Davis Advanced Irrigation Lab</div>
      <h1><span class="veg">Aqua</span><span class="drop">Crop</span>-Web</h1>
    </div>
  </div>
</header>

<nav class="tabs" id="tabnav">
  <button data-tab="location" class="active">Location</button>
  <button data-tab="parameters">Parameters</button>
  <button data-tab="calibration">Calibration</button>
  <button data-tab="setup">Setup</button>
  <button data-tab="results">Results</button>
  <button data-tab="compare">Compare scenarios</button>
  <button data-tab="historical">Historical (multi-year)</button>
  <button data-tab="method">Methodology</button>
</nav>

<div id="tab-location" class="tabpanel active"></div>
<div id="tab-parameters" class="tabpanel"></div>
<div id="tab-calibration" class="tabpanel"></div>
<div id="tab-setup" class="tabpanel"></div>
<div id="tab-results" class="tabpanel"></div>
<div id="tab-compare" class="tabpanel"></div>
<div id="tab-historical" class="tabpanel"></div>
<div id="tab-method" class="tabpanel"></div>

<footer>
  <div>AquaCrop-Web — UC Davis Advanced Irrigation Lab. Independent teaching/screening tool, not FAO software.</div>
  <div id="buildtag">v1.0</div>
</footer>
</div>

<script>
// AquaCrop-Web crop parameter database.
// Values are literature-informed approximations of the FAO AquaCrop default
// crop set (Raes, Steduto, Hsiao & Fereres, 2009, Papers I-IV; FAO Ref. Manual
// Ch.3 Annex) intended for teaching/screening use in calendar-day mode.
// Real work should calibrate against local phenology and AquaCrop's own
// crop files - see the Methodology panel in the app.

    label: "Rice (paddy)", group: "Cereal (C3, ponded)",
    Tbase: 8, Tupper: 35,
    cycle: { emergence: 8, maxCanopy: 55, flowering: 75, floweringDur: 14, senescStart: 100, maturity: 130 },
    CCo: 0.03, CCx: 0.90, CGC: 0.0140, CDC: 0.0060,
    Zmin: 0.20, Zmax: 0.50, Kcb: 1.15, fage: 0.15,
    WP: 19.0, WPyield: 100, HI0: 43,    dm: 0.88,

    pExpUpper: 0.10, pExpLower: 0.50, shapeExp: 2.5,
    pSto: 0.20, shapeSto: 2.5, pSen: 0.40, shapeSen: 2.5, pPol: 0.85,
    dHIpre: 3, aHI: 8, bHI: 4, ponded: true
  },
  barley: {
    label: "Barley", group: "Cereal (C3)",
    Tbase: 0, Tupper: 28,
    cycle: { emergence: 7, maxCanopy: 95, flowering: 100, floweringDur: 12, senescStart: 115, maturity: 145 },
    CCo: 0.015, CCx: 0.93, CGC: 0.0110, CDC: 0.0065,

    pExpUpper: 0.20, pExpLower: 0.65, shapeExp: 2.5,
    pSto: 0.55, shapeSto: 2.5, pSen: 0.70, shapeSen: 2.5, pPol: 0.85,
    dHIpre: 4, aHI: 7, bHI: 3
  },
  sorghum: {
    label: "Sorghum", group: "Cereal (C4)",
    Tbase: 10, Tupper: 34,
    cycle: { emergence: 7, maxCanopy: 58, flowering: 68, floweringDur: 13, senescStart: 95, maturity: 120 },
    CCo: 0.018, CCx: 0.88, CGC: 0.0165, CDC: 0.0055,
    Zmin: 0.30, Zmax: 1.60, Kcb: 1.05, fage: 0.12,
    WP: 30.0, WPyield: 100, HI0: 40,    dm: 0.88,

    pExpUpper: 0.15, pExpLower: 0.70, shapeExp: 3.0,
    pSto: 0.55, shapeSto: 3.0, pSen: 0.70, shapeSen: 3.0, pPol: 0.90,
    dHIpre: 5, aHI: 6, bHI: 3
  },
  quinoa: {
    label: "Quinoa", group: "Pseudo-cereal (C3)",
    Tbase: 3, Tupper: 30,
    cycle: { emergence: 6, maxCanopy: 65, flowering: 75, floweringDur: 20, senescStart: 105, maturity: 140 },
    CCo: 0.02, CCx: 0.75, CGC: 0.0130, CDC: 0.0050,

// FAO-56 Penman-Monteith reference ET (grass reference), daily time step.
// Inputs: tmax, tmin (°C), rhMean (%), wind2m (m/s), Rs (MJ/m2/day incoming
// shortwave), elevation (m), latitude (deg), dayOfYear.
function eto_PM(tmax, tmin, rhMean, wind2m, Rs, elevation, latitude, doy) {
  const Tmean = (tmax + tmin) / 2;
  const P = 101.3 * Math.pow((293 - 0.0065 * elevation) / 293, 5.26); // kPa
  const gamma = 0.000665 * P; // psychrometric constant kPa/degC

  const es_tmax = 0.6108 * Math.exp(17.27 * tmax / (tmax + 237.3));
  const es_tmin = 0.6108 * Math.exp(17.27 * tmin / (tmin + 237.3));
  const es = (es_tmax + es_tmin) / 2;
  const ea = es * (rhMean / 100);
  const delta = 4098 * (0.6108 * Math.exp(17.27 * Tmean / (Tmean + 237.3))) / Math.pow(Tmean + 237.3, 2);

  const lat_rad = latitude * Math.PI / 180;
  const dr = 1 + 0.033 * Math.cos(2 * Math.PI / 365 * doy);
  const decl = 0.409 * Math.sin(2 * Math.PI / 365 * doy - 1.39);
  const ws = Math.acos(clampAcos(-Math.tan(lat_rad) * Math.tan(decl)));
  const Ra = (24 * 60 / Math.PI) * 0.0820 * dr *
    (ws * Math.sin(lat_rad) * Math.sin(decl) + Math.cos(lat_rad) * Math.cos(decl) * Math.sin(ws)); // MJ/m2/day

  const Rso = (0.75 + 2e-5 * elevation) * Ra;
  const RsCapped = Math.min(Rs, Rso > 0 ? Rso : Rs);
  const Rns = (1 - 0.23) * RsCapped;
  const sigma = 4.903e-9;
  const TmaxK4 = Math.pow(tmax + 273.16, 4), TminK4 = Math.pow(tmin + 273.16, 4);
  const RsRso = Rso > 0 ? clamp01(RsCapped / Rso) : 1;
  const Rnl = sigma * ((TmaxK4 + TminK4) / 2) * (0.34 - 0.14 * Math.sqrt(Math.max(ea, 0))) * (1.35 * RsRso - 0.35);
  const Rn = Rns - Rnl;
  const G = 0; // daily soil heat flux ~0

// AquaCrop-Web simulation engine.
// Independent re-implementation of the published AquaCrop conceptual model
// (Steduto et al. 2009; Raes et al. 2009, Papers I-IV; FAO Irrigation &
// Drainage Paper 66) for teaching / scenario-screening use. Calendar-day
// phenology, single root-zone bucket water balance, FAO-56 two-stage
// evaporation, piecewise-linear Ks stress functions.

function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

// Growing-degree-day accrual for one day (modified/capped method, the same
// approach commonly used for maize GDD calculations): Tmax is capped at
// Tupper and Tmin is floored at Tbase before averaging, so a very hot or
// very cold day doesn't contribute more (or negative) heat units.
function dailyGDD(tmax, tmin, Tbase, Tupper) {
  if (tmax == null || tmin == null) return 0;
  const tx = Math.min(tmax, Tupper);
  const tn = Math.max(Math.min(tmin, tx), Tbase);
  return Math.max((tx + tn) / 2 - Tbase, 0);
}

// Water stress coefficient: linear (or curved) decline of Ks from 1 to 0
// as relative depletion Dr/TAW crosses threshold p up to full closure at 1.0
function ksFactor(depletionFrac, p, shape) {
  if (depletionFrac <= p) return 1.0;
  if (depletionFrac >= 1.0) return 0.0;
  const rel = (depletionFrac - p) / (1.0 - p);
  // AquaCrop-style convex/concave response curve, shape>0 typical 1-6 (Raes et al. 2009 Table 3)
  const s = shape || 1;
  return clamp(1 - (Math.exp(rel * s) - 1) / (Math.exp(s) - 1), 0, 1);
}

// Canopy cover on calendar day t (days after sowing), 0-1 fraction.
// Growth: logistic-exponential per Raes et al 2009 eq 1-3.
// Decline: exponential per eq 4 once senescence begins.
// Derive calendar-day CGC/CDC from cycle timing + CCo/CCx so canopy closes
// by 'maxCanopy' and senesces by 'maturity' regardless of crop, instead of
// depending on hand-transcribed literature coefficients (which are usually
// published in GDD terms and don't transfer directly to calendar-day mode).
function deriveCanopyRates(crop) {
  const { CCo, CCx } = crop;
  const tHalf = Math.max(crop.cycle.maxCanopy * 0.42, 3);
  const CGC = Math.log((CCx / 2) / CCo) / tHalf;
  const dtDecline = Math.max(crop.cycle.maturity - crop.cycle.senescStart, 3);
  // ccAtSen approximated as CCx (typical: senescence begins at/near full canopy)
  const CDC = Math.log(21) * CCx / dtDecline;
  return { CGC, CDC };
}

function canopyGrowthPhase(t, crop) {
  const { CCo, CCx, CGC } = crop;
  if (t <= 0) return 0;
  const half = 0.5 * CCx;
  // exponential growth phase
  let cc = CCo * Math.exp(CGC * t);
  if (cc > half) {
    // logistic phase (eq. CC = CCx - 0.25*(CCx-CCo)^2/CCo * exp(-CGC t))
    cc = CCx - 0.25 * ((CCx - CCo) * (CCx - CCo) / CCo) * Math.exp(-CGC * t);
  }
  return clamp(cc, 0, CCx);
}

function canopyCoverBase(t, crop) {
  const { CCx, CDC } = crop;
  const tSen = crop.cycle.senescStart;
  if (t <= 0) return 0;
  if (t < tSen) {
    return canopyGrowthPhase(t, crop);
  } else {
    const dt = t - tSen;
    const ccAtSen = canopyGrowthPhase(tSen, crop);
    const cc = ccAtSen * (1 - 0.05 * (Math.exp((CDC / Math.max(ccAtSen, 0.001)) * dt) - 1));
    return clamp(cc, 0, CCx);
  }
}

function rootDepth(t, crop) {
  const { Zmin, Zmax } = crop;
  const tMax = crop.cycle.maxCanopy;
  if (t <= 0) return Zmin;
  if (t >= tMax) return Zmax;
  // sigmoidal deepening, normalized 0-1 over emergence->maxCanopy
  const frac = t / tMax;
  const shaped = 1 / (1 + Math.exp(-8 * (frac - 0.5))); // logistic 0->1
  return Zmin + (Zmax - Zmin) * shaped;
}

// Reference-ET based soil evaporation, FAO-56 two-stage (simplified single-compartment)
function soilEvap(state, cc, eto, soil, mulchFactor, wetFrac) {
  const REW = soil.rew; // readily evaporable water, mm
  const TEW = REW * 2.8; // total evaporable water approx (Ritchie/Allen ratio)
  const exposed = clamp(1 - cc, 0.05, 1) * wetFrac;
  let Kr = 1.0;
  if (state.De > REW) {
    Kr = clamp((TEW - state.De) / (TEW - REW), 0, 1);
  }
  const Kx = 1.1; // max evap coefficient at wet exposed soil
  let Es = Kr * Kx * eto * exposed * mulchFactor;
  Es = Math.min(Es, Math.max(TEW - state.De, 0));
  return { Es, TEW };
}

function runSimulation(opts) {
  const { soil, weather, irrigationEvents, mgmt } = opts;
  // Canopy growth/decline rate: by default derived geometrically from the
  // crop's stage lengths (see deriveCanopyRates), which keeps canopy timing
  // consistent in calendar-day mode. If the crop carries useManualRates
  // (set from the Calibration tab), its own CGC/CDC are used as-is instead —

  let crop;

    crop = opts.crop;
  } else {

  }
  // Phenological clock: 'calendar' (default) drives every growth-stage
  // comparison off the day-loop index t, in calendar days after sowing.
  // 'gdd' drives them off accumulated growing-degree-days instead — in that
  // mode crop.cycle.* are interpreted as GDD thresholds rather than day
  // counts (the UI populates them accordingly), and pt below tracks
  // cumulative heat units rather than elapsed days. Everything else
  // (irrigation scheduling, evaporation, water balance) still runs on the
  // literal calendar-day loop regardless of mode.
  const phenologyMode = opts.phenologyMode === "gdd" ? "gdd" : "calendar";

  const days = weather.length;
  const TAWmm_per_m = (soil.fc - soil.wp) * 1000; // mm per m depth
  const SATmm_per_m = (soil.sat - soil.fc) * 1000;

  let De = 0; // cumulative surface evaporation depletion (mm), 0 = wet
  let SWCroot; // mm stored in root zone above WP
  let biomass = 0; // g/m2 = t/ha *100... we'll keep g/m2 then convert
  let HI = 0;
  let cumT = 0, cumTpot = 0; // for HI water-stress bookkeeping
  let seasonIrrig = 0, seasonRain = 0, seasonRunoff = 0, seasonDrain = 0, seasonETc = 0, seasonEs = 0, seasonTr = 0;
  const mulchFactor = 1 - clamp(mgmt.mulchPct || 0, 0, 100) / 100 * 0.5; // mulch cuts evap up to 50%
  const wetFrac = mgmt.wetFrac != null ? mgmt.wetFrac : 1.0;

  const out = [];
  let floweringStress = []; // Ks_pol samples during flowering window for HI penalty
  let preFloweringStressAccum = 0, preFloweringDaysCount = 0;
  let prevCC = 0;          // actual (stress-affected) cc from the previous day, for continuity
  let ccAtSenActual = null; // captured once, on the day senescence begins
  let cumGDD = 0;           // cumulative growing-degree-days, only used in 'gdd' mode

  const tMat = crop.cycle.maturity;
  const tFlowerStart = crop.cycle.flowering;
  const tFlowerEnd = crop.cycle.flowering != null ? crop.cycle.flowering + crop.cycle.floweringDur : null;
  const tYieldFormStart = crop.cycle.flowering != null ? crop.cycle.flowering : crop.cycle.maxCanopy;
  const yieldFormDur = Math.max(tMat - tYieldFormStart, 1);

  for (let t = 1; t <= days; t++) {
    const w = weather[t - 1];
    const eto = Math.max(w.eto, 0);
    const rain = Math.max(w.rain, 0);

    // phenological clock: accumulated GDD in 'gdd' mode, else the calendar
    // day index itself — everything below that gates growth stages uses pt,
    // not t, so the same crop.cycle thresholds work in either mode.
    if (phenologyMode === "gdd") cumGDD += dailyGDD(w.tmax, w.tmin, crop.Tbase, crop.Tupper);
    const pt = phenologyMode === "gdd" ? cumGDD : t;

    const Zr = rootDepth(pt, crop);
    const TAW = TAWmm_per_m * Zr;
    if (SWCroot === undefined) {
      const initDeplFrac = mgmt.initialDepletionFrac != null ? mgmt.initialDepletionFrac : 0.3;
      SWCroot = TAW * (1 - initDeplFrac);
    } else {
      // root zone deepened: add newly explored soil at field capacity minus running average depletion fraction
      // (approximate; keeps depletion fraction continuous as TAW grows)
    }
    let Dr = TAW - SWCroot; // depletion, mm
    const deplFrac = TAW > 0 ? clamp(Dr / TAW, 0, 1) : 0;

    // --- irrigation decision ---
    let irrig = 0;
    if (mgmt.mode === "fixed") {
      const ev = irrigationEvents.find(e => e.day === t);
      if (ev) irrig = ev.depth;
    } else if (mgmt.mode === "netIrrigation") {
      const trigger = mgmt.triggerFrac != null ? mgmt.triggerFrac : 0.5;
      const target = mgmt.targetFrac != null ? mgmt.targetFrac : 0.05;
      if (deplFrac >= trigger && pt < crop.cycle.senescStart) {

    const CN = soil.cn2;

    const cc0 = canopyCoverBase(pt, crop);

      const excess = SWCavail - TAW;

    const deplFrac2 = TAW > 0 ? clamp((TAW - SWCroot) / TAW, 0, 1) : 0;
    const ksExp = ksFactor(deplFrac2, crop.pExpUpper, crop.shapeExp);
    const ksSto = ksFactor(deplFrac2, crop.pSto, crop.shapeSto);
    const ksSen = 1 - ksFactor(deplFrac2, crop.pSen, crop.shapeSen); // inverted: triggers senescence acceleration
    const ksPol = crop.pPol != null ? ksFactor(deplFrac2, crop.pPol, 2.5) : 1.0;
    const ksAer = mgmt.mode !== "rainfed" && SWCroot > TAW * 0.98 && !crop.ponded ? 0.9 : 1.0; // mild waterlogging penalty if saturated & not a paddy crop

    let cc = cc0;

    } else {
      // Anchor the decline curve to the crop's actual (stress-affected) canopy
      // cover on the last day of the growth phase, not the theoretical
      // unstressed CCx — otherwise a season with any expansion stress shows
      // a spurious jump back up to full canopy right when senescence begins.
      if (ccAtSenActual === null) ccAtSenActual = Math.max(prevCC, 0.001);
      const senAccel = 1 + 2 * ksSen; // stress accelerates decline
      const dt = pt - crop.cycle.senescStart;
      cc = ccAtSenActual * (1 - 0.05 * (Math.exp((crop.CDC * senAccel / ccAtSenActual) * dt) - 1));

    }

    // --- evaporation & transpiration ---
    const { Es, TEW } = soilEvap({ De }, cc, eto, soil, mulchFactor, wetFrac);
    De = clamp(De + Es - (infil > 0 ? Math.min(infil, TEW) : 0), 0, TEW);

    const ageFactor = t > crop.cycle.maxCanopy
      ? clamp(1 - crop.fage / 100 * (t - crop.cycle.maxCanopy), 0.5, 1)
      : 1.0;
    const KcbAdj = crop.Kcb * ageFactor;
    const TrPot = KcbAdj * cc * eto * ksAer;
    const Tr = TrPot * ksSto;

    cumT += Tr;
    cumTpot += TrPot;
    seasonEs += Es; seasonTr += Tr; seasonETc += (Es + Tr);
    seasonIrrig += irrig; seasonRain += rain; seasonRunoff += runoff; seasonDrain += drain;

    // remove transpiration from root zone store (after evap already deducted conceptually via De tracking separately)
    SWCroot = clamp(SWCroot - Tr, 0, TAW);

    // --- biomass ---
    const wpAdj = (pt >= tYieldFormStart) ? crop.WP * (crop.WPyield / 100) : crop.WP;
    const dB = eto > 0 ? wpAdj * (Tr / eto) : 0;

    // --- HI build-up ---
    if (crop.HI0 > 0 && !crop.forage) {

        preFloweringDaysCount++;

      }
      if (pt >= tYieldFormStart) {
        const prog = clamp((pt - tYieldFormStart) / yieldFormDur, 0, 1);
        // logistic build-up of HI toward HI0
        let HItarget = crop.HI0 / (1 + Math.exp(-10 * (prog - 0.5)));

        const preBoost = 1 + (crop.dHIpre / 100) * clamp(preFloweringStressAccum / Math.max(preFloweringDaysCount, 1), 0, 1);

    }

    out.push({
      day: t,
      cc: cc, cc0,
      Zr, TAW, Dr: TAW - SWCroot, deplFrac: deplFrac2,
      ksExp, ksSto, ksSen, ksPol, ksAer,
      eto, rain, irrig, runoff, drain,

  const biomassTha = finalBiomass / 100;

  const WPet = seasonETc > 0 ? yieldTha / (seasonETc / 100) : 0; // t/ha per (mm/100 = 10 m3/ha)... convert properly below

  return {
    daily: out,
    summary: {
      biomassTha, yieldTha, yieldFreshTha, finalHI,
      seasonIrrig, seasonRain, seasonRunoff, seasonDrain, seasonETc, seasonEs, seasonTr,
      totalWaterMm,
      // WP (kg yield per m3 water) = (yield_t/ha * 1000 kg/t) / (depth_mm * 10 m3/ha per mm)
      wpEtc: seasonETc > 0 ? (yieldTha * 100) / seasonETc : 0,
      wpIrrig: seasonIrrig > 0 ? (yieldTha * 100) / seasonIrrig : null,
      cumT: seasonTr, cumTpot
    }
  };
}

// Minimal dependency-free SVG chart builders for AquaCrop-Web.
// All functions return an SVG string sized by viewBox; caller sets CSS width:100%.
// Every chart embeds invisible pointer-events="all" hover targets carrying a
// data-tip attribute (pre-rendered tooltip HTML); a single delegated
// listener (wired once in app.js) shows/positions a shared tooltip element
// on hover, so tooltips survive charts being replaced via innerHTML.

function escTip(s) { return String(s).replace(/'/g, "&#39;"); }
function tipHTML(title, rows) {
  let h = `<div class="tip-title">${title}</div>`;
  rows.forEach(r => {
    h += `<div class="tip-row"><span class="k">${r.color ? `<span class="tip-sw" style="background:${r.color}"></span>` : ""}${r.label}</span><span class="v">${r.value}</span></div>`;
  });
  return escTip(h);
}

function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  let f;
  if (n <= 1) f = 1; else if (n <= 2) f = 2; else if (n <= 5) f = 5; else f = 10;
  return f * mag;
}

const CHART_W = 720, CHART_H = 260, PAD_L = 42, PAD_R = 14, PAD_T = 14, PAD_B = 28;

function scaleX(day, nDays) { return PAD_L + (CHART_W - PAD_L - PAD_R) * (day / Math.max(nDays, 1)); }
function scaleY(v, vMax, invert) {

}
function clamp01(x) { return Math.max(0, Math.min(1, x)); }

function axesSVG(nDays, yMax, yFmt, yTicks, xLabel, xFmt, invertY) {
  yTicks = yTicks || 4;
  let s = "";
  // y gridlines
  for (let i = 0; i <= yTicks; i++) {
    const v = yMax * i / yTicks;
    const y = scaleY(v, yMax, invertY);
    s += `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${CHART_W - PAD_R}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    s += `<text x="${PAD_L - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--paper-faint)" font-family="var(--font-mono)">${yFmt ? yFmt(v) : v.toFixed(1)}</text>`;
  }
  // x ticks (roughly 6)
  const nTicks = 6;
  for (let i = 0; i <= nTicks; i++) {
    const d = Math.round(nDays * i / nTicks);
    const x = scaleX(d, nDays);
    s += `<text x="${x.toFixed(1)}" y="${CHART_H - PAD_B + 16}" text-anchor="middle" font-size="9" fill="var(--paper-faint)" font-family="var(--font-mono)">${xFmt ? xFmt(d) : d}</text>`;
  }
  s += `<text x="${(PAD_L + (CHART_W - PAD_R)) / 2}" y="${CHART_H - 4}" text-anchor="middle" font-size="9" fill="var(--paper-faint)">${xLabel || "days after sowing"}</text>`;
  s += `<line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${CHART_H - PAD_B}" stroke="var(--line)" stroke-width="1"/>`;
  s += `<line x1="${PAD_L}" y1="${CHART_H - PAD_B}" x2="${CHART_W - PAD_R}" y2="${CHART_H - PAD_B}" stroke="var(--line)" stroke-width="1"/>`;
  return s;
}

function linePath(data, key, nDays, yMax, invertY) {
  let d = "";
  data.forEach((row, i) => {
    const x = scaleX(row.day, nDays), y = scaleY(row[key], yMax, invertY);
    d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
  });
  return d;
}

function areaPath(data, key, nDays, yMax, invertY) {
  let d = linePath(data, key, nDays, yMax, invertY);
  const lastX = scaleX(data[data.length - 1].day, nDays);
  const firstX = scaleX(data[0].day, nDays);
  const baseY = scaleY(invertY ? yMax : 0, yMax, invertY);
  d += `L${lastX.toFixed(2)},${baseY.toFixed(2)} L${firstX.toFixed(2)},${baseY.toFixed(2)} Z`;
  return d;
}

function stackedAreaSVG(data, keys, colors, nDays, yMax) {
  // simple additive stack for 2 series (Es, Tr)
  let s = "";
  let running = data.map(() => 0);
  keys.forEach((key, ki) => {
    const top = data.map((row, i) => running[i] + row[key]);
    let d = "";
    data.forEach((row, i) => { const x = scaleX(row.day, nDays), y = scaleY(top[i], yMax); d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " "; });
    for (let i = data.length - 1; i >= 0; i--) { const x = scaleX(data[i].day, nDays), y = scaleY(running[i], yMax); d += "L" + x.toFixed(2) + "," + y.toFixed(2) + " "; }
    d += "Z";

function lineChart({ data, series, nDays, yMax, yFmt, thresholds, xLabel, xFmt, invertY }) {
  yMax = yMax || niceMax(Math.max(...series.flatMap(s => data.map(r => r[s.key]))));
  let svg = `<svg class="chart" viewBox="0 0 ${CHART_W} ${CHART_H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += axesSVG(nDays, yMax, yFmt, null, xLabel, xFmt, invertY);
  if (thresholds) {
    thresholds.forEach(th => {
      const y = scaleY(th.v, yMax, invertY);

    if (s.area) svg += `<path d="${areaPath(data, s.key, nDays, yMax, invertY)}" fill="${s.color}" fill-opacity="0.18" stroke="none"/>`;
    svg += `<path d="${linePath(data, s.key, nDays, yMax, invertY)}" fill="none" stroke="${s.color}" stroke-width="2"/>`;

  // hover columns: one per data point, spanning to the midpoint with its
  // neighbours, so the whole chart width is hoverable at full height
  data.forEach((row, i) => {
    const xCurr = scaleX(row.day, nDays);
    const xPrev = i > 0 ? scaleX(data[i - 1].day, nDays) : xCurr - (data.length > 1 ? scaleX(data[1].day, nDays) - xCurr : 10);
    const xNext = i < data.length - 1 ? scaleX(data[i + 1].day, nDays) : xCurr + (xCurr - xPrev);
    const left = (xPrev + xCurr) / 2, right = (xCurr + xNext) / 2;
    const title = xFmt ? xFmt(row.day) : `Day ${row.day}`;
    const rows = series.map(s => ({ label: s.label || s.key, value: (s.fmt || yFmt) ? (s.fmt || yFmt)(row[s.key]) : row[s.key], color: s.color }));
    svg += `<rect x="${left.toFixed(1)}" y="${PAD_T}" width="${Math.max(right - left, 1).toFixed(1)}" height="${(CHART_H - PAD_T - PAD_B).toFixed(1)}" fill="transparent" pointer-events="all" data-tip='${tipHTML(title, rows)}'/>`;
  });

  svg += "</svg>";
  return svg;
}

function stackedAreaChart({ data, keys, colors, nDays, yMax, yFmt, labels, xFmt, tipFmts }) {
  yMax = yMax || niceMax(Math.max(...data.map(r => keys.reduce((a, k) => a + r[k], 0))));
  let svg = `<svg class="chart" viewBox="0 0 ${CHART_W} ${CHART_H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += stackedAreaSVG(data, keys, colors, nDays, yMax);
  svg += axesSVG(nDays, yMax, yFmt, null, null, xFmt);

  data.forEach((row, i) => {
    const xCurr = scaleX(row.day, nDays);
    const xPrev = i > 0 ? scaleX(data[i - 1].day, nDays) : xCurr - (data.length > 1 ? scaleX(data[1].day, nDays) - xCurr : 10);
    const xNext = i < data.length - 1 ? scaleX(data[i + 1].day, nDays) : xCurr + (xCurr - xPrev);
    const left = (xPrev + xCurr) / 2, right = (xCurr + xNext) / 2;
    const title = xFmt ? xFmt(row.day) : `Day ${row.day}`;
    const rows = keys.map((k, ki) => {
      const fmt = (tipFmts && tipFmts[ki]) || yFmt;
      return { label: (labels && labels[ki]) || k, value: fmt ? fmt(row[k]) : row[k], color: colors[ki] };
    });
    svg += `<rect x="${left.toFixed(1)}" y="${PAD_T}" width="${Math.max(right - left, 1).toFixed(1)}" height="${(CHART_H - PAD_T - PAD_B).toFixed(1)}" fill="transparent" pointer-events="all" data-tip='${tipHTML(title, rows)}'/>`;
  });

  svg += "</svg>";
  return svg;
}

function barChart({ data, key, labelKey, color, yMax, yFmt, refLine, line, label }) {
  const n = data.length;
  yMax = yMax || niceMax(Math.max(...data.map(r => r[key])));
  const padR = line ? 40 : PAD_R;
  const innerW = CHART_W - PAD_L - padR, innerH = CHART_H - PAD_T - PAD_B;
  const gap = innerW / n * 0.22;
  const barW = innerW / n - gap;
  let svg = `<svg class="chart" viewBox="0 0 ${CHART_W} ${CHART_H}" xmlns="http://www.w3.org/2000/svg">`;
  // y gridlines (left axis, bars)
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4;
    const y = scaleY(v, yMax);
    svg += `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${CHART_W - padR}" y2="${y.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    svg += `<text x="${PAD_L - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--paper-faint)" font-family="var(--font-mono)">${yFmt ? yFmt(v) : v.toFixed(1)}</text>`;
  }
  data.forEach((row, i) => {
    const x = PAD_L + i * (innerW / n) + gap / 2;
    const y = scaleY(row[key], yMax);
    const h = (CHART_H - PAD_B) - y;
    const tipRows = [{ label: label || key, value: yFmt ? yFmt(row[key]) : row[key], color }];
    if (line) tipRows.push({ label: line.label || line.key, value: (line.yFmt ? line.yFmt(row[line.key]) : row[line.key]), color: line.color });
    svg += `<rect x="${x.toFixed(1)}" y="${PAD_T}" width="${barW.toFixed(1)}" height="${(CHART_H - PAD_T - PAD_B).toFixed(1)}" fill="transparent" pointer-events="all" data-tip='${tipHTML(String(row[labelKey]), tipRows)}'/>`;
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" fill="${color}" fill-opacity="${row.fallback ? 0.35 : 0.85}" pointer-events="none"/>`;
    if (n <= 26) {
      svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${CHART_H - PAD_B + 12}" text-anchor="middle" font-size="8" fill="var(--paper-faint)" font-family="var(--font-mono)" transform="rotate(45 ${(x + barW / 2).toFixed(1)} ${CHART_H - PAD_B + 12})">${row[labelKey]}</text>`;
    }
  });
  if (refLine != null) {
    const y = scaleY(refLine, yMax);
    svg += `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${CHART_W - padR}" y2="${y.toFixed(1)}" stroke="var(--ochre-400)" stroke-width="1.5" stroke-dasharray="5,3"/>`;
  }
  // optional second series (e.g. irrigation) as a line against its own right-hand axis
  if (line) {
    const lineMax = line.yMax || niceMax(Math.max(...data.map(r => r[line.key])));
    for (let i = 0; i <= 4; i++) {
      const v = lineMax * i / 4;
      const y = scaleY(v, lineMax);
      svg += `<text x="${CHART_W - padR + 6}" y="${(y + 3).toFixed(1)}" text-anchor="start" font-size="9" fill="${line.color}" font-family="var(--font-mono)">${line.yFmt ? line.yFmt(v) : v.toFixed(1)}</text>`;
    }
    let d = "";
    data.forEach((row, i) => {
      const x = PAD_L + i * (innerW / n) + gap / 2 + barW / 2;
      const y = scaleY(row[line.key], lineMax);
      d += (i === 0 ? "M" : "L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
    });
    svg += `<path d="${d}" fill="none" stroke="${line.color}" stroke-width="2"/>`;
    data.forEach((row, i) => {
      const x = PAD_L + i * (innerW / n) + gap / 2 + barW / 2;
      const y = scaleY(row[line.key], lineMax);
      svg += `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="2.5" fill="${line.color}" pointer-events="none"/>`;
    });
    svg += `<line x1="${CHART_W - padR}" y1="${PAD_T}" x2="${CHART_W - padR}" y2="${CHART_H - PAD_B}" stroke="${line.color}" stroke-width="1" opacity="0.5"/>`;
  }
  svg += `<line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${CHART_H - PAD_B}" stroke="var(--line)" stroke-width="1"/>`;
  svg += `<line x1="${PAD_L}" y1="${CHART_H - PAD_B}" x2="${CHART_W - padR}" y2="${CHART_H - PAD_B}" stroke="var(--line)" stroke-width="1"/>`;
  svg += "</svg>";
  return svg;
}

function niceStep(rawStep) {
  if (rawStep <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const n = rawStep / mag;
  let f;
  if (n <= 1) f = 1; else if (n <= 2) f = 2; else if (n <= 5) f = 5; else f = 10;
  return f * mag;
}
// Nice round [lo,hi] bounds with headroom, snapped to a tidy step size —
// used by the box-and-whisker chart so the axis frames the actual spread of
// the data instead of always anchoring at zero.
function niceBounds(lo, hi, targetTicks) {
  targetTicks = targetTicks || 4;
  if (hi <= lo) hi = lo + Math.max(Math.abs(lo) * 0.1, 1);
  const step = niceStep((hi - lo) / targetTicks);
  return { min: Math.floor(lo / step) * step, max: Math.ceil(hi / step) * step, step };
}

function boxWhiskerChart({ values, color, yFmt, unit, title }) {
  const s = [...values].sort((a, b) => a - b);
  const n = s.length;
  function pct(p) {
    const idx = (p / 100) * (n - 1);
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (idx - lo);
  }
  const min = s[0], max = s[n - 1], q1 = pct(25), median = pct(50), q3 = pct(75);

  // Auto-fit the axis to the data's own spread, with headroom, rather than
  // forcing it to start at zero — a tight cluster of values reads far
  // better zoomed in than squashed at the top of a 0-to-max axis.
  const range = max - min;
  const pad = range > 0 ? range * 0.18 : Math.max(Math.abs(max) * 0.1, 1);
  let rawLo = min - pad, rawHi = max + pad;
  if (rawLo < 0 && min >= 0) rawLo = 0; // keep non-negative metrics (yield, irrigation) from dipping below 0
  const bounds = niceBounds(rawLo, rawHi, 4);
  const yAxisMin = bounds.min, yAxisMax = bounds.max, yStep = bounds.step;

  function y(v) {
    const frac = clamp01((v - yAxisMin) / ((yAxisMax - yAxisMin) || 1));
    return PAD_T + (CHART_H - PAD_T - PAD_B) * (1 - frac);
  }

  const boxCenterX = (PAD_L + (CHART_W - PAD_R)) / 2;
  const boxWidth = 130;

  let svg = `<svg class="chart" viewBox="0 0 ${CHART_W} ${CHART_H}" xmlns="http://www.w3.org/2000/svg">`;
  // y gridlines at the nice step, spanning the fitted axis range
  for (let v = yAxisMin; v <= yAxisMax + yStep * 0.001; v += yStep) {
    const yy = y(v);
    svg += `<line x1="${PAD_L}" y1="${yy.toFixed(1)}" x2="${CHART_W - PAD_R}" y2="${yy.toFixed(1)}" stroke="var(--line-soft)" stroke-width="1"/>`;
    svg += `<text x="${PAD_L - 6}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--paper-faint)" font-family="var(--font-mono)">${yFmt ? yFmt(v) : v.toFixed(1)}</text>`;
  }
  svg += `<line x1="${PAD_L}" y1="${PAD_T}" x2="${PAD_L}" y2="${CHART_H - PAD_B}" stroke="var(--line)" stroke-width="1"/>`;
  svg += `<line x1="${PAD_L}" y1="${CHART_H - PAD_B}" x2="${CHART_W - PAD_R}" y2="${CHART_H - PAD_B}" stroke="var(--line)" stroke-width="1"/>`;

  const yMin_ = y(min), yMax_ = y(max);
  const yQ1 = y(q1), yQ3 = y(q3), yMed = y(median);
  const capHalf = boxWidth * 0.28;

  // whiskers
  svg += `<line x1="${boxCenterX}" y1="${yMax_.toFixed(1)}" x2="${boxCenterX}" y2="${yQ3.toFixed(1)}" stroke="${color}" stroke-width="1.5"/>`;
  svg += `<line x1="${boxCenterX}" y1="${yQ1.toFixed(1)}" x2="${boxCenterX}" y2="${yMin_.toFixed(1)}" stroke="${color}" stroke-width="1.5"/>`;
  // caps
  svg += `<line x1="${(boxCenterX - capHalf).toFixed(1)}" y1="${yMax_.toFixed(1)}" x2="${(boxCenterX + capHalf).toFixed(1)}" y2="${yMax_.toFixed(1)}" stroke="${color}" stroke-width="1.5"/>`;
  svg += `<line x1="${(boxCenterX - capHalf).toFixed(1)}" y1="${yMin_.toFixed(1)}" x2="${(boxCenterX + capHalf).toFixed(1)}" y2="${yMin_.toFixed(1)}" stroke="${color}" stroke-width="1.5"/>`;
  // box (Q1-Q3)
  svg += `<rect x="${(boxCenterX - boxWidth / 2).toFixed(1)}" y="${yQ3.toFixed(1)}" width="${boxWidth}" height="${Math.max(yQ1 - yQ3, 1).toFixed(1)}" fill="${color}" fill-opacity="0.28" stroke="${color}" stroke-width="1.5"/>`;
  // median line
  svg += `<line x1="${(boxCenterX - boxWidth / 2).toFixed(1)}" y1="${yMed.toFixed(1)}" x2="${(boxCenterX + boxWidth / 2).toFixed(1)}" y2="${yMed.toFixed(1)}" stroke="${color}" stroke-width="2.5"/>`;

  // value labels to the right of the box
  const lx = boxCenterX + boxWidth / 2 + 10;
  const fmtV = v => (yFmt ? yFmt(v) : v.toFixed(1));
  svg += `<text x="${lx}" y="${(yMax_ + 3).toFixed(1)}" font-size="9" fill="var(--paper-dim)" font-family="var(--font-mono)">max ${fmtV(max)}</text>`;
  svg += `<text x="${lx}" y="${(yQ3 + 3).toFixed(1)}" font-size="9" fill="var(--paper-dim)" font-family="var(--font-mono)">q3 ${fmtV(q3)}</text>`;
  svg += `<text x="${lx}" y="${(yMed + 3).toFixed(1)}" font-size="9" fill="var(--paper)" font-family="var(--font-mono)" font-weight="600">median ${fmtV(median)}</text>`;
  svg += `<text x="${lx}" y="${(yQ1 + 3).toFixed(1)}" font-size="9" fill="var(--paper-dim)" font-family="var(--font-mono)">q1 ${fmtV(q1)}</text>`;
  svg += `<text x="${lx}" y="${(yMin_ + 3).toFixed(1)}" font-size="9" fill="var(--paper-dim)" font-family="var(--font-mono)">min ${fmtV(min)}</text>`;

  // single hover target over the whole box+whisker column, showing the full 5-number summary
  const hoverTop = Math.min(yMax_, PAD_T), hoverBottom = Math.max(yMin_, CHART_H - PAD_B);
  const tipRows = [
    { label: "Max", value: fmtV(max), color },
    { label: "Q3", value: fmtV(q3) },
    { label: "Median", value: fmtV(median) },
    { label: "Q1", value: fmtV(q1) },
    { label: "Min", value: fmtV(min) },
    { label: "n", value: String(n) }
  ];
  svg += `<rect x="${(boxCenterX - boxWidth / 2 - 6).toFixed(1)}" y="${hoverTop.toFixed(1)}" width="${boxWidth + 12}" height="${Math.max(hoverBottom - hoverTop, 1).toFixed(1)}" fill="transparent" pointer-events="all" data-tip='${tipHTML(title || "Distribution", tipRows)}'/>`;

  svg += "</svg>";
  return svg;
}

if (typeof module !== "undefined") module.exports = { lineChart, stackedAreaChart, barChart, boxWhiskerChart, niceMax, CHART_W, CHART_H, PAD_L, PAD_R, PAD_T, PAD_B, scaleX, scaleY };


// ===================== Slippy-map location picker =====================
// No external mapping library — plain raster tiles positioned via slippy-map
// (Web Mercator) math, with drag-to-pan, +/- zoom, double-click-to-zoom,
// click-to-drop-pin, a basemap switcher (satellite/topo/dark), and a
// place-name search via OpenStreetMap's Nominatim geocoder.

const TILE_SIZE = 256;

const BASEMAPS = {
  satellite: {
    label: "Satellite",
    maxZoom: 19,
    // Esri World Imagery uses z/y/x tile ordering, not the usual z/x/y
    url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
    attribHTML: `Imagery © <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics`
  },
  topo: {
    label: "Topographic",
    maxZoom: 17,
    url: (z, x, y) => `https://a.tile.opentopomap.org/${z}/${x}/${y}.png`,
    attribHTML: `© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, <a href="https://opentopomap.org" target="_blank" rel="noopener">OpenTopoMap</a> (CC-BY-SA)`
  },
  dark: {
    label: "Dark",
    maxZoom: 20,
    url: (z, x, y) => `https://a.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png`,
    attribHTML: `© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>`
  }
};

function lonLatToWorldPx(lon, lat, zoom) {
  const n = Math.pow(2, zoom) * TILE_SIZE;
  const x = (lon + 180) / 360 * n;
  const latRad = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  return { x, y };
}
function worldPxToLonLat(x, y, zoom) {
  const n = Math.pow(2, zoom) * TILE_SIZE;
  const lon = x / n * 360 - 180;
  const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n)));
  return { lon, lat: latRad * 180 / Math.PI };
}
function wrapTileIndex(i, zoom) {
  const n = Math.pow(2, zoom);
  return ((i % n) + n) % n;
}

function createLocationPicker(opts) {
  // opts: { container (el), onPick(lat,lon), initialLat, initialLon, initialZoom }
  const container = opts.container;
  let zoom = opts.initialZoom || 6;
  let centerLon = opts.initialLon, centerLat = opts.initialLat;
  let markerLon = opts.initialLon, markerLat = opts.initialLat;
  let basemapKey = "satellite";

  const basemapBtns = Object.keys(BASEMAPS).map(k =>
    `<button type="button" class="mapbmbtn${k === basemapKey ? " active" : ""}" data-bm="${k}">${BASEMAPS[k].label}</button>`
  ).join("");

  container.innerHTML = `
    <div class="mapshell">
      <div class="maptiles"></div>
      <div class="mapmarker" style="display:none;"><svg width="22" height="30" viewBox="0 0 22 30"><path d="M11 0C4.9 0 0 4.9 0 11c0 8.3 11 19 11 19s11-10.7 11-19C22 4.9 17.1 0 11 0z" fill="#cf7255" stroke="#181310" stroke-width="1"/><circle cx="11" cy="11" r="4" fill="#181310"/></svg></div>
      <div class="mapsearch">
        <div class="searchrow">
          <input type="text" class="mapsearchbox" placeholder="Search a place or address…">
          <button type="button" class="mapbtn wide mapsearchbtn">Search</button>
        </div>
        <div class="mapsearchresults"></div>
      </div>
      <div class="mapbasemaps">${basemapBtns}</div>
      <div class="mapctrl">
        <button type="button" class="mapbtn" data-act="zoomin">+</button>
        <button type="button" class="mapbtn" data-act="zoomout">–</button>
        <button type="button" class="mapbtn wide" data-act="california">California</button>
        <button type="button" class="mapbtn wide" data-act="world">World</button>
      </div>
      <div class="mapattrib"></div>
    </div>`;

  const shell = container.querySelector(".mapshell");
  const tilesLayer = container.querySelector(".maptiles");
  const markerEl = container.querySelector(".mapmarker");
  const attribEl = container.querySelector(".mapattrib");
  const searchBox = container.querySelector(".mapsearchbox");
  const searchBtn = container.querySelector(".mapsearchbtn");
  const searchResultsEl = container.querySelector(".mapsearchresults");

  function size() { return { w: shell.clientWidth, h: shell.clientHeight }; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

  function renderTiles() {
    const bm = BASEMAPS[basemapKey];
    const z = clamp(zoom, 2, bm.maxZoom);
    const { w, h } = size();
    const center = lonLatToWorldPx(centerLon, centerLat, z);
    const originX = center.x - w / 2, originY = center.y - h / 2;
    const firstTx = Math.floor(originX / TILE_SIZE), lastTx = Math.floor((originX + w) / TILE_SIZE);
    const firstTy = Math.floor(originY / TILE_SIZE), lastTy = Math.floor((originY + h) / TILE_SIZE);
    const n = Math.pow(2, z);
    let html = "";
    for (let tx = firstTx; tx <= lastTx; tx++) {
      for (let ty = firstTy; ty <= lastTy; ty++) {
        if (ty < 0 || ty >= n) continue;
        const wtx = wrapTileIndex(tx, z);
        const left = tx * TILE_SIZE - originX, top = ty * TILE_SIZE - originY;
        html += `<img src="${bm.url(z, wtx, ty)}" style="left:${left}px;top:${top}px;" width="${TILE_SIZE}" height="${TILE_SIZE}" loading="lazy" draggable="false" alt="">`;
      }
    }
    tilesLayer.innerHTML = html;
    tilesLayer.style.transform = "translate(0px,0px)";
    attribEl.innerHTML = bm.attribHTML;
    positionMarker();
  }

  function effectiveZoom() { return clamp(zoom, 2, BASEMAPS[basemapKey].maxZoom); }

  function positionMarker() {
    if (markerLon == null) { markerEl.style.display = "none"; return; }
    const { w, h } = size();
    const z = effectiveZoom();
    const center = lonLatToWorldPx(centerLon, centerLat, z);
    const originX = center.x - w / 2, originY = center.y - h / 2;
    const p = lonLatToWorldPx(markerLon, markerLat, z);
    markerEl.style.display = "block";
    markerEl.style.left = (p.x - originX - 11) + "px";
    markerEl.style.top = (p.y - originY - 30) + "px";
  }

  function setCenter(lon, lat, z) {
    centerLon = lon; centerLat = lat;
    if (z != null) zoom = clamp(z, 2, 19);
    renderTiles();
  }

  function setMarker(lon, lat, recenter) {
    markerLon = lon; markerLat = lat;
    if (recenter) setCenter(lon, lat);
    else positionMarker();
  }

  function setBasemap(key) {
    if (!BASEMAPS[key]) return;
    basemapKey = key;
    container.querySelectorAll(".mapbmbtn").forEach(b => b.classList.toggle("active", b.dataset.bm === key));
    renderTiles();
  }

  // ---- drag to pan (visual translate during drag, real re-render on release) ----
  let dragging = false, dragStart = null, dragged = false, dragCenterStart = null;
  function pointerPos(e) {
    const rect = shell.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }
  function onDown(e) {
    if (e.target.closest(".mapsearch") || e.target.closest(".mapctrl") || e.target.closest(".mapbasemaps")) return;
    dragging = true; dragged = false;
    dragStart = pointerPos(e);
    dragCenterStart = { lon: centerLon, lat: centerLat };
  }
  function onMove(e) {
    if (!dragging) return;
    const p = pointerPos(e);
    const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragged = true;
    tilesLayer.style.transform = `translate(${dx}px,${dy}px)`;
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    const p = pointerPos(e);
    const dx = p.x - dragStart.x, dy = p.y - dragStart.y;
    const z = effectiveZoom();
    if (dragged) {
      const startCenterPx = lonLatToWorldPx(dragCenterStart.lon, dragCenterStart.lat, z);
      const newCenterPx = { x: startCenterPx.x - dx, y: startCenterPx.y - dy };
      const ll = worldPxToLonLat(newCenterPx.x, newCenterPx.y, z);
      setCenter(ll.lon, clamp(ll.lat, -85, 85));
    } else {
      // treat as a click: drop pin at pointer position
      const { w, h } = size();
      const center = lonLatToWorldPx(centerLon, centerLat, z);
      const originX = center.x - w / 2, originY = center.y - h / 2;
      const ll = worldPxToLonLat(originX + p.x, originY + p.y, z);
      setMarker(ll.lon, ll.lat, false);
      if (opts.onPick) opts.onPick(ll.lat, ll.lon);
      renderTiles();
    }
  }
  shell.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  shell.addEventListener("touchstart", onDown, { passive: true });
  shell.addEventListener("touchmove", onMove, { passive: true });
  shell.addEventListener("touchend", onUp);

  shell.addEventListener("dblclick", (e) => {
    if (e.target.closest(".mapsearch") || e.target.closest(".mapctrl") || e.target.closest(".mapbasemaps")) return;
    e.preventDefault();

// Small stats helpers for multi-year / multi-realization summaries.
function mean(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }

}

function percentile(arr, p) {
  const s = [...arr].sort((a, b) => a - b);
  if (s.length === 0) return NaN;
  const idx = (p / 100) * (s.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return s[lo];
  return s[lo] + (s[hi] - s[lo]) * (idx - lo);
}
// Weibull plotting-position exceedance curve: sorted descending, P = m/(n+1)
function exceedanceCurve(arr) {
  const s = [...arr].sort((a, b) => b - a);
  const n = s.length;
  return s.map((v, i) => ({ prob: (i + 1) / (n + 1) * 100, value: v }));
}
function summaryStats(arr) {
  return {
    n: arr.length,
    mean: mean(arr),
    median: median(arr),
    stdev: stdev(arr),
    min: Math.min(...arr),
    max: Math.max(...arr),
    p10: percentile(arr, 10),
    p90: percentile(arr, 90),
    cv: mean(arr) !== 0 ? (stdev(arr) / mean(arr)) * 100 : 0

// readXLSX: unzips the .xlsx container itself (central directory + the browser's

function parseDelimited(text) {

  for (let i = 0; i < text.length; i++) {

    if (inQ) {

    } else if (ch === '"') inQ = true;

// ===================== Automatic calibration from field observations =====================
// Observations (single season): canopy cover vs day, biomass vs day, final yield.
//  1. Canopy: Nelder–Mead on (CCx, CGC, CDC) minimising canopy-cover SSE (full water balance
//     is re-run on every evaluation so stress feedbacks are respected). CGC/CDC are only
//     freed when the data actually constrain them.
//  2. Biomass: simulated biomass is exactly proportional to WP*, so WP* is rescaled in closed form
//     (least squares through the origin).
//  3. Yield: HI0 is found by bisection so simulated yield equals observed yield (yield is monotone in HI0).
//     For forage crops (yield = biomass) WP* is rescaled instead.

function nelderMead(f, x0, steps, maxIter) {
  const n = x0.length;
  let pts = [x0.slice()];
  for (let i = 0; i < n; i++) { const p = x0.slice(); p[i] += steps[i]; pts.push(p); }
  let vals = pts.map(f);
  for (let it = 0; it < (maxIter || 200 * n); it++) {
    const order = vals.map((v, i) => i).sort((a, b) => vals[a] - vals[b]);
    pts = order.map(i => pts[i]); vals = order.map(i => vals[i]);
    if (Math.abs(vals[n] - vals[0]) < 1e-10 * (1 + Math.abs(vals[0]))) break;
    const cen = new Array(n).fill(0);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) cen[j] += pts[i][j] / n;
    const along = (t) => cen.map((c, j) => c + t * (pts[n][j] - c));
    const xr = along(-1), fr = f(xr);
    if (fr < vals[0]) {
      const xe = along(-2), fe = f(xe);
      if (fe < fr) { pts[n] = xe; vals[n] = fe; } else { pts[n] = xr; vals[n] = fr; }
    } else if (fr < vals[n - 1]) { pts[n] = xr; vals[n] = fr; }
    else {
      const xc = fr < vals[n] ? along(-0.5) : along(0.5), fc = f(xc);
      if (fc < Math.min(fr, vals[n])) { pts[n] = xc; vals[n] = fc; }
      else for (let i = 1; i <= n; i++) { pts[i] = pts[i].map((v, j) => pts[0][j] + 0.5 * (v - pts[0][j])); vals[i] = f(pts[i]); }
    }
  }
  const best = vals.indexOf(Math.min(...vals));
  return { x: pts[best], f: vals[best] };
}

function fitStats(pairs) { // pairs: [{o, s}]
  const n = pairs.length;
  if (!n) return null;
  const mo = pairs.reduce((a, p) => a + p.o, 0) / n;
  const sse = pairs.reduce((a, p) => a + (p.s - p.o) ** 2, 0);
  const sst = pairs.reduce((a, p) => a + (p.o - mo) ** 2, 0);
  return { n, rmse: Math.sqrt(sse / n), bias: pairs.reduce((a, p) => a + (p.s - p.o), 0) / n, r2: sst > 0 ? 1 - sse / sst : null };
}

// ---- Observation file: one or more seasons (optional `season` column) ----
// Columns (header required, any subset): season|year|trial · day|date · sowing_date · cc_percent · biomass_t_ha ·
// yield_t_ha · irrigation_mm (applied that day, optional). Days/dates are resolved per season later because
// each season has its own sowing date.
function parseObservationFile(rows) {
  const { headers, data } = splitHeader(rows);
  if (!headers) throw new Error("the file needs a header row such as day, cc_percent, biomass_t_ha, yield_t_ha");
  const f = re => headers.findIndex(h => re.test(h));
  const sI = f(/season|year|trial/), dI = f(/^date|^day|das|dap/), sowI = f(/sow|plant/), ccI = f(/^cc|canopy/),
        bI = f(/biomass|agb|dry.?matter/), yI = f(/yield/), iI = f(/irrig/);
  if (ccI < 0 && bI < 0 && yI < 0) throw new Error("no cc / biomass / yield column found in the header");
  const isDateCol = dI >= 0 && /date/.test(headers[dI]);
  const seasons = []; let cur = null;
  data.forEach(r => {
    const lab = sI >= 0 && String(r[sI]).trim() !== "" ? String(r[sI]).trim() : (cur ? cur.label : "Season 1");
    if (!cur || cur.label !== lab) {
      cur = seasons.find(s => s.label === lab);
      if (!cur) { cur = { label: lab, sow: null, rows: [] }; seasons.push(cur); }
    }
    if (sowI >= 0 && !cur.sow && String(r[sowI]).trim() !== "") {
      const v = toNum(r[sowI]);
      const d = !isNaN(v) && v > 20000 && v < 80000 ? excelSerialToISO(v) : (parseDateLoose(r[sowI]) || null) && parseDateLoose(r[sowI]).toISOString().slice(0, 10);
      if (d) cur.sow = d;
    }
    cur.rows.push({ dayCell: dI >= 0 ? r[dI] : "", cc: ccI >= 0 ? toNum(r[ccI]) : NaN, b: bI >= 0 ? toNum(r[bI]) : NaN, y: yI >= 0 ? toNum(r[yI]) : NaN, irr: iI >= 0 ? toNum(r[iI]) : NaN });
  });
  let div = 1; const notes = [];
  if (ccI >= 0) {
    const all = seasons.flatMap(s => s.rows.map(r => r.cc)).filter(v => !isNaN(v));
    if (all.length) {
      const pct = /percent|%|pct/.test(headers[ccI]), frac = /frac/.test(headers[ccI]);
      div = pct ? 100 : frac ? 1 : (Math.max(...all) > 1.5 ? 100 : 1);
      notes.push(`canopy cover read as ${div === 100 ? "percent" : "fraction"}`);
    }
  }
  return { seasons, ccDiv: div, isDateCol, hasIrrigation: iI >= 0, notes };
}

// Turn one parsed season into day-indexed observations for a given sowing date.
function resolveSeasonObs(parsed, season, sowDateStr) {
  const obs = { cc: [], biomass: [], yield: null, events: [], notes: [] };
  season.rows.forEach(r => {
    if (!isNaN(r.y)) obs.yield = r.y;
    const day = dayFromCell(r.dayCell, sowDateStr, parsed.isDateCol);
    if (isNaN(day) || day < 1) return;
    const d = Math.round(day);
    if (!isNaN(r.cc)) obs.cc.push({ day: d, v: Math.min(r.cc / parsed.ccDiv, 1) });
    if (!isNaN(r.b)) obs.biomass.push({ day: d, v: r.b });
    if (!isNaN(r.irr) && r.irr > 0) obs.events.push({ day: d, depth: r.irr });
  });
  obs.cc.sort((a, b) => a.day - b.day); obs.biomass.sort((a, b) => a.day - b.day); obs.events.sort((a, b) => a.day - b.day);
  return obs;
}

// Single-season convenience wrapper (kept for simple use and tests)
function parseObservationsTable(rows, sowDateStr) {
  const p = parseObservationFile(rows);
  const o = resolveSeasonObs(p, p.seasons[0], sowDateStr);
  o.notes = p.notes.slice();
  return o;
}

function goldenMin(f, a, b, iters) {
  const g = 0.6180339887;
  let c = b - g * (b - a), d = a + g * (b - a), fc = f(c), fd = f(d);
  for (let i = 0; i < iters; i++) {
    if (fc < fd) { b = d; d = c; fd = fc; c = b - g * (b - a); fc = f(c); }
    else { a = c; c = d; fc = fd; d = a + g * (b - a); fd = f(d); }
  }
  return (a + b) / 2;
}

// seasons: [{ label, simulate(cropObj) -> result, obs, validation? }]
function autoCalibrateMulti({ crop, seasons, yieldBasis, fitStress }) {
  const notes = [];
  const dm = crop.dm || 1;
  const rowAt = (res, day) => res.daily.find(r => r.day === day);
  const ccP = (s, res) => s.obs.cc.map(p => { const r = rowAt(res, p.day); return r ? { o: p.v, s: r.cc, day: p.day } : null; }).filter(Boolean);
  const bioP = (s, res) => s.obs.biomass.map(p => { const r = rowAt(res, p.day); return r ? { o: p.v, s: r.biomass / 100, day: p.day } : null; }).filter(Boolean);
  seasons.forEach(s => {
    s.before = s.simulate(crop);
    s.targetDry = s.obs.yield == null ? null : ((s.yieldBasis || yieldBasis) === "fresh" ? s.obs.yield * dm : s.obs.yield);
  });
  const fitS = seasons.filter(s => !s.validation);
  if (!fitS.length) throw new Error("at least one year must be used for fitting (not all can be held out)");
  const rates0 = crop.useManualRates && crop.CGC != null && crop.CDC != null ? { CGC: crop.CGC, CDC: crop.CDC } : deriveCanopyRates(crop);
  let cur = Object.assign({}, crop);
  const patch = {}, fitted = [];
  const orig = Object.assign({}, crop, rates0);
  const sumSq = (fn) => fitS.reduce((a, s) => a + fn(s), 0);

  // ---- 1. canopy (pooled over fitting seasons) ----
  const ccAll = fitS.flatMap(s => ccP(s, s.before));
  if (ccAll.length >= 3) {
    const tSen = crop.cycle.senescStart;
    const freeCGC = ccAll.some(p => p.day < crop.cycle.maxCanopy * 1.3);
    const freeCDC = ccAll.filter(p => p.day > tSen).length >= 2;
    if (!freeCGC) notes.push("No canopy observations during the growth phase — CGC kept at its current value.");
    if (!freeCDC) notes.push("Fewer than 2 canopy observations after senescence starts — CDC kept at its current value.");
    const lo = { CCx: Math.max(0.15, crop.CCo * 2), CGC: 0.01, CDC: 0.005 }, hi = { CCx: 1, CGC: 0.5, CDC: 0.5 };
    cur = Object.assign({}, cur, rates0, { useManualRates: true });
    const keys = ["CCx"].concat(freeCGC ? ["CGC"] : [], freeCDC ? ["CDC"] : []);
    const mk = x => { const c = Object.assign({}, cur); keys.forEach((k, i) => { c[k] = Math.min(hi[k], Math.max(lo[k], x[i])); }); return c; };
    const obj = x => {
      const c = mk(x);
      let sse = sumSq(s => ccP(s, s.simulate(c)).reduce((a, p) => a + (p.s - p.o) ** 2, 0));
      keys.forEach((k, i) => { const out = x[i] < lo[k] ? lo[k] - x[i] : x[i] > hi[k] ? x[i] - hi[k] : 0; sse += 10 * out * out; });
      return sse;
    };
    const mxObs = Math.max(...ccAll.map(p => p.o));
    const starts = [keys.map(k => cur[k]), keys.map(k => k === "CCx" ? Math.min(1, mxObs * 1.05) : k === "CGC" ? 0.12 : 0.05)];
    let best = null;
    starts.forEach(s0 => { const r = nelderMead(obj, s0, s0.map(v => Math.max(Math.abs(v) * 0.25, 0.02)), 400); if (!best || r.f < best.f) best = r; });
    cur = mk(best.x);
    keys.forEach(k => fitted.push(k));
    ["CCx", "CGC", "CDC"].forEach(k => { patch[k] = +cur[k].toFixed(4); cur[k] = patch[k]; });
    patch.useManualRates = true;
  } else if (seasons.some(s => s.obs.cc.length)) notes.push("Need at least 3 canopy-cover observations (pooled over fitting seasons) to calibrate canopy parameters.");

  // ---- 2. biomass -> WP* (pooled least squares through the origin) ----
  const forage = !!crop.forage;
  const bp = fitS.flatMap(s => bioP(s, s.simulate(cur)));
  if (bp.length) {
    const num = bp.reduce((a, p) => a + p.o * p.s, 0), den = bp.reduce((a, p) => a + p.s * p.s, 0);
    if (den > 0) {
      const k = Math.min(3, Math.max(0.3, num / den));
      cur = Object.assign({}, cur, { WP: crop.WP * k });
      patch.WP = +cur.WP.toFixed(2); fitted.push("WP");
      if (k === 3 || k === 0.3) notes.push("WP* hit its allowed range (×0.3 – ×3) — check the biomass units (t/ha dry matter).");
    }
  } else if (seasons.some(s => s.obs.biomass.length)) notes.push("Biomass observations fall outside the simulated seasons.");

  // ---- 3. yield -> HI0 (or WP* for forage) ----
  const yS = fitS.filter(s => s.targetDry != null && s.targetDry > 0);
  if (yS.length) {
    if (forage) {
      if (!patch.WP) {
        const sims = yS.map(s => s.simulate(cur).summary.yieldTha);
        const num = yS.reduce((a, s, i) => a + s.targetDry * sims[i], 0), den = sims.reduce((a, v) => a + v * v, 0);
        if (den > 0) { const k = Math.min(3, Math.max(0.3, num / den)); cur = Object.assign({}, cur, { WP: crop.WP * k }); patch.WP = +cur.WP.toFixed(2); fitted.push("WP"); }
      } else notes.push("Forage crop: yield equals biomass, so WP* was calibrated from the biomass data.");
    } else if (crop.HI0 > 0) {
      const f = m => yS.reduce((a, s) => a + (s.simulate(Object.assign({}, cur, { HI0: Math.min(100, crop.HI0 * m) })).summary.yieldTha - s.targetDry) ** 2, 0);
      const m = goldenMin(f, 0.2, 3, 45);
      if (m < 0.22) notes.push("Fitted HI₀ hit its lower limit — observed yields are far below what the simulated biomass implies; check units/basis.");
      if (m > 2.95) notes.push("Fitted HI₀ hit its upper limit — simulated biomass is probably too low; add biomass observations.");
      cur = Object.assign({}, cur, { HI0: Math.min(100, crop.HI0 * m) });
      patch.HI0 = +cur.HI0.toFixed(1); fitted.push("HI0");
    }
  } else if (seasons.some(s => s.obs.yield != null)) notes.push("Observed yield must be positive.");

  if (fitted.includes("HI0") && !fitted.includes("WP") && !forage && !seasons.some(s => s.obs.biomass.length)) notes.push("No biomass observations: WP* and HI₀ can't be separated, so HI₀ absorbed the whole yield correction (WP* kept at its current value). Predictions are fine for similar conditions, but don't read HI₀ as a measured harvest index.");

  // ---- 4. optional: water-stress sensitivity (needs contrast between seasons) ----
  if (fitStress) {
    const ySeasons = fitS.filter(s => s.targetDry != null && s.targetDry > 0);
    const stressOf = s => { const d = s.simulate(cur).daily; return d.reduce((a, r) => a + (1 - r.ksSto), 0) / d.length; };
    const st = ySeasons.map(stressOf);
    const contrast = st.length ? Math.max(...st) - Math.min(...st) : 0;
    if (ySeasons.length < 3) notes.push("Stress-sensitivity fit skipped: it needs at least 3 fitting seasons with an observed yield.");
    else if (forage || !(crop.HI0 > 0)) notes.push("Stress-sensitivity fit skipped for forage crops.");
    else if (contrast < 0.03) notes.push("Stress-sensitivity fit skipped: the seasons show almost no difference in simulated water stress, so p<sub>exp</sub>/p<sub>sto</sub> can't be identified from them.");
    else {
      const keys0 = { pExpUpper: cur.pExpUpper, pSto: cur.pSto }, hi0 = cur.HI0;
      const obj = x => {
        const pe = Math.min(0.95, Math.max(0.05, x[0])), ps = Math.min(0.95, Math.max(0.05, x[1])), m = Math.min(3, Math.max(0.3, x[2]));
        const c = Object.assign({}, cur, { pExpUpper: pe, pSto: ps, HI0: Math.min(100, hi0 * m) });
        let e = ySeasons.reduce((a, s) => a + ((s.simulate(c).summary.yieldTha - s.targetDry) / s.targetDry) ** 2, 0) / ySeasons.length;
        const cc = fitS.flatMap(s => ccP(s, s.simulate(c)));
        if (cc.length) e += cc.reduce((a, p) => a + (p.s - p.o) ** 2, 0) / cc.length;
        [x[0], x[1]].forEach(v => { if (v < 0.05 || v > 0.95) e += 10 * (v < 0.05 ? 0.05 - v : v - 0.95) ** 2; });
        return e;
      };
      const r = nelderMead(obj, [keys0.pExpUpper, keys0.pSto, 1], [0.1, 0.1, 0.1], 300);
      const pe = Math.min(0.95, Math.max(0.05, r.x[0])), ps = Math.min(0.95, Math.max(0.05, r.x[1])), m = Math.min(3, Math.max(0.3, r.x[2]));
      cur = Object.assign({}, cur, { pExpUpper: pe, pSto: ps, HI0: Math.min(100, hi0 * m) });
      patch.pExpUpper = +pe.toFixed(3); patch.pSto = +ps.toFixed(3); patch.HI0 = +cur.HI0.toFixed(1);
      cur.pExpUpper = patch.pExpUpper; cur.pSto = patch.pSto; cur.HI0 = patch.HI0;
      ["pExpUpper", "pSto"].forEach(k => fitted.push(k));
      if (!fitted.includes("HI0")) fitted.push("HI0");
    }
  }

  // ---- results ----
  seasons.forEach(s => { s.after = s.simulate(cur); });
  const yP = (s, res) => s.targetDry == null ? [] : [{ o: s.targetDry, s: res.summary.yieldTha }];
  const statsFor = (list, which) => ({
    cc: fitStats(list.flatMap(s => ccP(s, s[which]))),
    biomass: fitStats(list.flatMap(s => bioP(s, s[which]))),
    yield: fitStats(list.flatMap(s => yP(s, s[which])))
  });
  const valS = seasons.filter(s => s.validation);
  const perSeason = seasons.map(s => ({
    label: s.label, validation: !!s.validation, targetDry: s.targetDry, before: s.before, after: s.after,
    obsCCpts: ccP(s, s.before).map(p => ({ day: p.day, v: p.o })), obsBpts: bioP(s, s.before).map(p => ({ day: p.day, v: p.o })),
    statsBefore: statsFor([s], "before"), statsAfter: statsFor([s], "after"), nDays: s.before.daily.length
  }));
  const params = [];
  ["CCx", "CGC", "CDC", "WP", "HI0", "pExpUpper", "pSto"].forEach(k => {
    if (patch[k] != null) params.push({ key: k, before: orig[k], after: patch[k], fitted: fitted.includes(k) });
  });
  return {
    patch, params, fitted, notes, perSeason,
    statsBeforeFit: statsFor(fitS, "before"), statsAfterFit: statsFor(fitS, "after"),
    statsBeforeVal: valS.length ? statsFor(valS, "before") : null, statsAfterVal: valS.length ? statsFor(valS, "after") : null
  };
}

// Single-season wrapper (same result shape the first version returned)
function autoCalibrate({ crop, simulate, obs, yieldBasis }) {
  const r = autoCalibrateMulti({ crop, seasons: [{ label: "Season", simulate, obs }], yieldBasis });
  const s = r.perSeason[0];
  return Object.assign({}, r, { before: s.before, after: s.after, statsBefore: s.statsBefore, statsAfter: s.statsAfter, obsCCpts: s.obsCCpts, obsBpts: s.obsBpts, targetDry: s.targetDry });
}


// Observed points (hover for values) against before/after simulated curves.
function fitChart({ nDays, obs, curves, yMax, yFmt, name }) {
  yMax = yMax || niceMax(Math.max(...obs.map(p => p.v), ...curves.flatMap(c => c.data.map(r => r.v))) * 1.05);
  let svg = `<svg class="chart" viewBox="0 0 ${CHART_W} ${CHART_H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += axesSVG(nDays, yMax, yFmt, null, "days after sowing");
  curves.forEach(c => {
    svg += `<path d="${linePath(c.data, "v", nDays, yMax)}" fill="none" stroke="${c.color}" stroke-width="2"${c.dash ? ` stroke-dasharray="${c.dash}"` : ""}/>`;
  });
  obs.forEach(p => {
    const x = scaleX(p.day, nDays), y = scaleY(p.v, yMax);
    const rows = [{ label: "Observed", value: yFmt(p.v), color: "#222" }].concat(curves.map(c => { const r = c.data.find(d => d.day === p.day); return { label: c.label, value: r ? yFmt(r.v) : "–", color: c.color }; }));
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#222" stroke="#fff" stroke-width="1.5"/>`;
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="transparent" pointer-events="all" data-tip='${tipHTML(name + " · day " + p.day, rows)}'/>`;
  });
  return svg + "</svg>";
}

// Measured (x) vs simulated (y) scatter with a 1:1 line; points hover for values.
function scatterChart({ pts, unit }) {
  const W = 460, H = 460, m = { l: 56, r: 16, t: 14, b: 48 };
  const all = pts.flatMap(p => [p.obs, p.before, p.after]).filter(v => isFinite(v));
  const raw = Math.max(...all) * 1.05 / 5, pw = Math.pow(10, Math.floor(Math.log10(raw))), stp = [1, 1.2, 1.5, 2, 2.5, 5, 10].map(k => k * pw).find(v => v >= raw);
  const max = stp * 5;
  const sx = v => m.l + v / max * (W - m.l - m.r), sy = v => H - m.b - v / max * (H - m.t - m.b);
  const step = stp;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:480px" xmlns="http://www.w3.org/2000/svg">`;
  for (let i = 0; i <= 5; i++) {
    const v = i * step, lab = (v >= 10 ? v.toFixed(0) : v.toFixed(1));
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(v).toFixed(1)}" y2="${sy(v).toFixed(1)}" stroke="#e4e4e4"/><line y1="${m.t}" y2="${H - m.b}" x1="${sx(v).toFixed(1)}" x2="${sx(v).toFixed(1)}" stroke="#e4e4e4"/>`;
    svg += `<text x="${m.l - 8}" y="${(sy(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#555">${lab}</text><text x="${sx(v).toFixed(1)}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="#555">${lab}</text>`;
  }
  svg += `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="none" stroke="#999"/>`;
  svg += `<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(max)}" y2="${sy(max)}" stroke="#222" stroke-width="1.5" stroke-dasharray="6,4"/><text x="${sx(max) - 6}" y="${sy(max) + 14}" text-anchor="end" font-size="11" fill="#222">1:1</text>`;
  svg += `<text x="${(m.l + W - m.r) / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#333">Measured yield (${unit})</text><text transform="translate(14 ${(m.t + H - m.b) / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#333">Simulated yield (${unit})</text>`;
  const dot = (p, v, kind) => {
    const x = sx(p.obs), y = sy(v), val = t => t.toFixed(2);
    const rows = [{ label: "Measured", value: val(p.obs), color: "#222" }, { label: "Before", value: val(p.before), color: "#9a9a9a" }, { label: "After", value: val(p.after), color: "#2f7d46" }];
    const tip = `data-tip='${tipHTML(p.label + (p.validation ? " (validation)" : ""), rows)}'`;
    if (kind === "before") return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="none" stroke="#9a9a9a" stroke-width="1.5"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="transparent" pointer-events="all" ${tip}/>`;
    return p.validation
      ? `<rect x="${(x - 5.5).toFixed(1)}" y="${(y - 5.5).toFixed(1)}" width="11" height="11" fill="#d98a1c" stroke="#fff" stroke-width="1.5" transform="rotate(45 ${x.toFixed(1)} ${y.toFixed(1)})"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="transparent" pointer-events="all" ${tip}/>`
      : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="#2f7d46" stroke="#fff" stroke-width="1.5"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="transparent" pointer-events="all" ${tip}/>`;
  };
  pts.forEach(p => { svg += dot(p, p.before, "before"); });
  pts.forEach(p => { svg += dot(p, p.after, "after"); });
  return svg + "</svg>";
}
