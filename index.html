<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>COPAM-Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>:root {
  --bg: #eaf0f2; --panel: #ffffff; --panel2: #f4f8f9; --ink: #10262d; --ink2: #38525a; --muted: #67808a; --line: #d2dee2; --line2: #e4ecef;
  --accent: #0a6c80; --accent-ink: #ffffff; --accent-soft: #d9eef2; --accent-line: #8cc7d2;
  --good: #1f8a5b; --warn: #b7791f; --bad: #c0392b; --good-soft: #dff3e9; --warn-soft: #faf0d9; --bad-soft: #f9e1dd;
  --hyd: #1d5fd1; --map-bg: #f6f9fa; --map-ink: #2a3f47; --sel: #f5b400; --path: #d63a2f;
  --s1: #0a6c80; --s1-soft: #cfe8ed; --s2: #d97706; --s3: #6d4fc2; --s4: #1f8a5b; --s5: #c0392b;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(16,38,45,.06), 0 6px 20px rgba(16,38,45,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b161a; --panel: #111f25; --panel2: #16272e; --ink: #e3eef1; --ink2: #b1c5cb; --muted: #7e969e; --line: #25393f; --line2: #1c2e34;
    --accent: #4cc3d9; --accent-ink: #062229; --accent-soft: #143840; --accent-line: #2b7a88;
    --good: #45c48a; --warn: #e0a83c; --bad: #ef6b5c; --good-soft: #143528; --warn-soft: #3a2f14; --bad-soft: #3e1f1b;
    --hyd: #6ea2ff; --map-bg: #0e1a1f; --map-ink: #b8ccd2; --sel: #ffd23f; --path: #ff6b5e;
    --s1: #4cc3d9; --s1-soft: #1a4650; --s2: #f0a03c; --s3: #a58bff; --s4: #45c48a; --s5: #ef6b5c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #0b161a; --panel: #111f25; --panel2: #16272e; --ink: #e3eef1; --ink2: #b1c5cb; --muted: #7e969e; --line: #25393f; --line2: #1c2e34;
  --accent: #4cc3d9; --accent-ink: #062229; --accent-soft: #143840; --accent-line: #2b7a88;
  --good: #45c48a; --warn: #e0a83c; --bad: #ef6b5c; --good-soft: #143528; --warn-soft: #3a2f14; --bad-soft: #3e1f1b;
  --hyd: #6ea2ff; --map-bg: #0e1a1f; --map-ink: #b8ccd2; --sel: #ffd23f; --path: #ff6b5e;
  --s1: #4cc3d9; --s1-soft: #1a4650; --s2: #f0a03c; --s3: #a58bff; --s4: #45c48a; --s5: #ef6b5c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.005em; text-wrap: balance; }
.num, td.n, th.n, input.n { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: .93em; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }

.shell { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.top { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-size: 17px; letter-spacing: .02em; font-weight: 700; }
.brand b i { font-style: normal; color: var(--accent); }
.brand span { color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink2); background: var(--panel2); white-space: nowrap; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 11px; cursor: pointer; color: var(--ink); transition: background .12s, border-color .12s; }
.btn:hover { background: var(--panel2); border-color: var(--accent-line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.progress { height: 3px; background: transparent; position: relative; }
.progress i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); transition: width .15s; }
.progress.on { background: var(--line2); }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0; }
.mapPane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--map-bg); }
.mapBar { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.mapBar label { display: inline-flex; align-items: center; gap: 5px; color: var(--ink2); font-size: 12.5px; }
.mapWrap { position: relative; flex: 1; min-height: 200px; }
canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; outline: none; }
canvas#map.t-pan { cursor: grab; } canvas#map.t-zin { cursor: zoom-in; } canvas#map.t-zout { cursor: zoom-out; } canvas#map.t-info { cursor: crosshair; }
canvas#map.t-info.hit { cursor: pointer; }
canvas#map.drag { cursor: grabbing !important; }
.tools { position: absolute; left: 10px; top: 10px; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
.tools button { display: inline-flex; align-items: center; gap: 5px; border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--ink2); padding: 5px 9px; cursor: pointer; font-size: 12px; }
.tools button:last-child { border-right: 0; }
.tools button:hover { background: var(--panel2); }
.tools button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tools svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.maptip { position: absolute; z-index: 5; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; box-shadow: var(--shadow); white-space: nowrap; max-width: 90%; font-family: var(--mono); }
.maptip b { font-weight: 600; }
@media (max-width: 700px) { .tools button span { display: none; } }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-size: 16px; line-height: 1; box-shadow: var(--shadow); }
.legend-map { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 11.5px; box-shadow: var(--shadow); max-width: 62%; }
.legend-map .ramp { height: 8px; border-radius: 4px; width: 190px; margin: 3px 0; }
.legend-map .lab { display: flex; justify-content: space-between; font-family: var(--mono); color: var(--ink2); }
.legend-map .sw { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
.legend-map .sw i { width: 10px; height: 10px; display: inline-block; border-radius: 50%; }
.info { padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12.5px; min-height: 32px; color: var(--ink2); font-family: var(--mono); }
.info b { color: var(--ink); font-weight: 600; }

.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; }
.tab { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.panels { flex: 1; overflow: auto; padding: 12px; min-height: 0; }
.panel { display: none; flex-direction: column; gap: 12px; }
.panel.on { display: flex; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card > h3 { font-size: 13.5px; margin-bottom: 8px; }
.card > h3 small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 1px; }
.grid { display: grid; gap: 8px 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field input, .field select { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.field input:focus, .field select:focus { border-color: var(--accent); background: var(--panel); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.note { font-size: 12.3px; color: var(--ink2); background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; }
.note.warn { background: var(--warn-soft); border-color: transparent; }
.note.bad { background: var(--bad-soft); border-color: transparent; }
.note.good { background: var(--good-soft); border-color: transparent; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 4px 11px; cursor: pointer; color: var(--ink2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kpi { border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; background: var(--panel2); }
.kpi small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.kpi b { font-size: 18px; font-family: var(--mono); font-weight: 600; letter-spacing: -.02em; }
.kpi span { color: var(--muted); font-size: 11.5px; margin-left: 3px; }
.kpi.good b { color: var(--good); } .kpi.bad b { color: var(--bad); } .kpi.warn b { color: var(--warn); }

.tw { overflow: auto; max-height: 340px; border: 1px solid var(--line2); border-radius: 8px; }
.tw.tall { max-height: 460px; }
table { border-collapse: collapse; width: 100%; font-size: 12.3px; }
thead th { position: sticky; top: 0; background: var(--panel2); text-align: right; padding: 5px 8px; font-weight: 600; color: var(--ink2); border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
thead th:first-child, td:first-child { text-align: left; }
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--accent); }
td { padding: 3px 8px; border-bottom: 1px solid var(--line2); text-align: right; white-space: nowrap; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr.sel { background: var(--warn-soft); }
td input, td select { width: 100%; min-width: 54px; border: 1px solid transparent; background: transparent; padding: 1px 4px; border-radius: 4px; text-align: right; }
td input:hover, td select:hover { border-color: var(--line); }
td input:focus, td select:focus { border-color: var(--accent); background: var(--panel); }
td.ok { color: var(--good); } td.bad { color: var(--bad); } td.warn { color: var(--warn); }
tr.tot td { font-weight: 600; border-top: 1px solid var(--line); background: var(--panel2); }
.tag { display: inline-block; padding: 0 7px; border-radius: 99px; font-size: 11px; background: var(--panel2); border: 1px solid var(--line); }
.tag.hyd { color: var(--hyd); border-color: var(--hyd); } .tag.res { color: var(--bad); border-color: var(--bad); }

svg.chart { width: 100%; height: auto; display: block; }
svg .cg { stroke: var(--line2); stroke-width: 1; } svg .ca { stroke: var(--muted); stroke-width: 1; }
svg .ct { fill: var(--muted); font: 10.5px var(--mono); } svg .cl { fill: var(--ink2); font: 11.5px var(--font); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); padding: 4px 0 0 4px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; box-shadow: var(--shadow); max-width: min(90vw, 560px); }
.toast.err { background: var(--bad); color: #fff; }
.toast a, .toast button { color: inherit; background: transparent; border: 0; text-decoration: underline; cursor: pointer; margin-left: 8px; }
.drop { border: 1.5px dashed var(--accent-line); border-radius: 10px; padding: 14px; text-align: center; color: var(--ink2); background: var(--panel2); }
.drop.over { background: var(--accent-soft); border-color: var(--accent); }
.layers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
pre.txt { margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; max-height: 260px; overflow: auto; background: var(--panel2); padding: 8px; border-radius: 6px; }
.report h4 { margin: 14px 0 6px; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.report p { margin: 6px 0; max-width: 72ch; }
.cols2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); }
@media (max-width: 520px) { .cols2 { grid-template-columns: 1fr; } }
details > summary { cursor: pointer; color: var(--ink2); }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 42vh) minmax(0, 1fr); }
  .mapPane { border-right: 0; border-bottom: 1px solid var(--line); }
  .legend-map { max-width: 85%; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- GIS import wizard ---- */
[hidden] { display: none !important; }
.attrib { position: absolute; left: 8px; bottom: 6px; font-size: 10.5px; color: var(--ink2); background: color-mix(in srgb, var(--panel) 82%, transparent); padding: 0 6px; border-radius: 4px; max-width: 70%; pointer-events: none; }
.attrib:empty { display: none; }
.step { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.step .no { flex: none; width: 21px; height: 21px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 12px; display: inline-grid; place-items: center; }
.step h3 { font-size: 14px; }
.step small { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 4px; }
.slot { border: 1.5px dashed var(--accent-line); border-radius: 9px; padding: 9px 11px; background: var(--panel2); }
.slot.over { background: var(--accent-soft); border-color: var(--accent); }
.slot.filled { border-style: solid; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 0; }
.pill { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); }
.pill.ok { color: var(--good); border-color: var(--good); }
.pill.miss { color: var(--warn); border-color: var(--warn); }
.pill.bad { color: var(--bad); border-color: var(--bad); }
details.card > summary, details.sub > summary { cursor: pointer; font-weight: 600; font-size: 12.5px; }
details.sub { margin-top: 10px; border-top: 1px solid var(--line2); padding-top: 8px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; }
pre.prev { margin: 6px 0 0; max-height: 170px; overflow: auto; font: 11px/1.4 var(--mono); background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px; white-space: pre; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
</style>
</head><body>
<div class="shell">
  <header class="top">
    <div class="brand"><b>COPAM<i>·</i>Web</b><span>design &amp; performance of pressurised water networks</span></div>
    <div class="chips" id="chips"></div>
    <div class="actions"><button class="btn" id="btnExample">Load D9S6 example</button><button class="btn" id="btnOpen">Open files…</button><button class="btn" id="btnSave">Save .in</button><button class="btn" id="btnInp" title="EPANET input file (all hydrants open)">Export .inp</button></div>
    <input type="file" id="filePick" multiple hidden accept=".in,.pipe,.shp,.dbf,.prj,.cpg,.zip,.tif,.tiff,.tfw">
  </header>
  <div class="progress"><i></i></div>
  <main class="main">
    <section class="mapPane" aria-label="Network map">
      <div class="mapBar">
        <label>Colour by <select id="mapMode"></select></label>
        <label>Background <select id="mapBase"><option value="none">None</option><option value="osm">Street map</option><option value="sat">Satellite</option><option value="topo">Topographic</option></select></label>
        <label id="opWrap" title="background opacity" hidden><input type="range" id="mapOp" min="20" max="100" value="90" style="width:70px"></label>
        <label><input type="checkbox" id="optCrops"> Land use</label>
        <label><input type="checkbox" id="optDem"> Elevation</label>
        <label><input type="checkbox" id="optLab"> Labels</label>
        <span id="status" class="small muted" style="margin-left:auto"></span>
      </div>
      <div class="mapWrap">
        <canvas id="map" aria-label="Network map canvas"></canvas>
        <div class="tools" id="tools" role="toolbar" aria-label="Map tools">
          <button data-tool="pan" title="Pan: drag the map (arrow keys also pan)" aria-label="Pan"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span>Pan</span></button>
          <button data-tool="zin" title="Zoom in: click, or drag a box" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6M7.5 10h5M10 7.5v5"/></svg><span>Zoom in</span></button>
          <button data-tool="zout" title="Zoom out: click the map" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6M7.5 10h5"/></svg><span>Zoom out</span></button>
          <button data-tool="info" title="Identify: hover or click a hydrant, node or pipe" aria-label="Identify"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.1"/></svg><span>Identify</span></button>
        </div>
        <div class="maptip" id="maptip" hidden></div>
        <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit to network" style="font-size:12px">⤢</button></div>
        <div class="legend-map" id="maplegend" hidden></div>
        <div class="attrib" id="attrib"></div>
      </div>
      <div class="info" id="info"></div>
    </section>
    <section class="side">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="panels" id="panels"></div>
    </section>
  </main>
</div>
<script>(function(){
"use strict";
/* =====================================================================
   COPAM-Web projection module — reads .prj (WKT), builds forward/inverse
   transforms (Transverse Mercator / UTM, Web Mercator, Mercator, Lambert
   Conformal Conic, geographic) and ellipsoidal lengths.  No DOM access.
   Datum shifts are NOT applied (all datums are treated as WGS84/ETRS89);
   this is accurate to ~1 m for WGS84, ETRS89, NAD83 and RDN2008 data.
   ===================================================================== */
(function (root) {
'use strict';
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const WGS84 = { a: 6378137, f: 1 / 298.257223563 };
const GRS80 = { a: 6378137, f: 1 / 298.257222101 };
const INTL = { a: 6378388, f: 1 / 297 };

/* ------------------------------------------------------------------ */
/*  WKT parsing                                                         */
/* ------------------------------------------------------------------ */
function wktTree(s) {
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  function value() {
    ws();
    if (s[i] === '"') { const j = s.indexOf('"', i + 1); const v = s.slice(i + 1, j < 0 ? s.length : j); i = (j < 0 ? s.length : j) + 1; return v; }

 *   [Pipe]\n<n>\n id;from;to;length(m);Qdesign;diam(mm);rough(mm)
 */
function parseIn(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  let i = 0;
  while (i < lines.length && lines[i].trim().toLowerCase() !== '[node]') i++;
  if (i >= lines.length) throw new Error('No [Node] section found - is this a COPAM .in file?');
  const nn = parseInt(lines[i + 1], 10); i += 2;
  const nodes = [];
  for (let k = 0; k < nn; k++, i++) {
    const a = lines[i].split(';');
    if (a.length < 7) throw new Error('Bad node line ' + (i + 1) + ': ' + lines[i]);
    let type = a[3].trim();
    type = /^res/i.test(type) ? 'Reservoir' : /^hyd/i.test(type) ? 'Hydrant' : 'Node';
    nodes.push({ id: parseInt(a[0], 10), x: num(a[1]), y: num(a[2]), type, q: num(a[4]) || 0, z: num(a[5]) || 0, area: num(a[6]) || 0, shp: a.length > 7 ? (parseInt(a[7], 10) || 0) : 0 });
  }
  while (i < lines.length && lines[i].trim().toLowerCase() !== '[pipe]') i++;
  if (i >= lines.length) throw new Error('No [Pipe] section found');
  const np = parseInt(lines[i + 1], 10); i += 2;
  const links = [];
  for (let k = 0; k < np; k++, i++) {
    const a = lines[i].split(';');
    if (a.length < 7) throw new Error('Bad pipe line ' + (i + 1) + ': ' + lines[i]);
    const qd = num(a[4]);
    links.push({ id: parseInt(a[0], 10), f: parseInt(a[1], 10), t: parseInt(a[2], 10), L: num(a[3]), Qd: isNaN(qd) ? null : qd, d: num(a[5]), r: num(a[6]) });
  }
  return { nodes, links };
}

function fmtNum(v) { return (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) ? '' : String(v); }

function writeIn(model) {
  const o = ['[Node]', String(model.nodes.length)];
  for (const n of model.nodes) o.push([n.id, n.x, n.y, n.type, n.q, n.z, n.area, n.shp].map(fmtNum).join(';'));
  o.push('[Pipe]', String(model.links.length));
  for (const l of model.links) o.push([l.id, l.f, l.t, (+l.L).toFixed(3), l.Qd === null ? '' : l.Qd, l.d, l.r].map(fmtNum).join(';'));
  return o.join('\r\n') + '\r\n';
}

/** ".pipe" file: n \n diam;price;rough */
function parsePipeList(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(s => s.trim() !== '');
  const n = parseInt(lines[0], 10);
  const out = [];
  for (let k = 1; k <= n && k < lines.length; k++) {
    const a = lines[k].split(';');
    out.push({ d: num(a[0]), price: num(a[1]), rough: num(a[2]) });
  }
  out.sort((a, b) => a.d - b.d);
  return out;
}
function writePipeList(list) {
  return [String(list.length)].concat(list.map(p => [p.d, p.price, p.rough].join(';'))).join('\r\n') + '\r\n';
}

/* ------------------------------------------------------------------ */
/*  Network model                                                      */
/* ------------------------------------------------------------------ */

class Model {
  /** nodes: [{id,x,y,type,q,z,area,shp}]  links: [{id,f,t,L,Qd,d,r}] (f,t = node ids) */
  constructor(nodes, links) {
    this.nodes = nodes; this.links = links;
    this.build();
  }
  build() {
    const nodes = this.nodes, links = this.links;
    this.N = nodes.length; this.M = links.length;
    this.nodeIdx = new Map();
    nodes.forEach((n, i) => this.nodeIdx.set(n.id, i));
    this.issues = [];
    this.adj = nodes.map(() => []);
    this.linkOf = new Map();               // "i-j" -> first link index joining i and j (as HashLinkID)
    links.forEach((l, k) => {
      const a = this.nodeIdx.get(l.f), b = this.nodeIdx.get(l.t);
      if (a === undefined || b === undefined) { this.issues.push({ level: 'error', msg: 'Pipe ' + l.id + ' refers to a missing node (' + l.f + ' / ' + l.t + ')' }); l.fi = -1; l.ti = -1; return; }
      l.fi = a; l.ti = b;
      this.adj[a].push([b, k]); this.adj[b].push([a, k]);
      const k1 = a + '-' + b, k2 = b + '-' + a;
      if (!this.linkOf.has(k1)) this.linkOf.set(k1, k);
      if (!this.linkOf.has(k2)) this.linkOf.set(k2, k);
    });
    this.reservoirs = []; this.hydrants = [];
    nodes.forEach((n, i) => { if (n.type === 'Reservoir') this.reservoirs.push(i); else if (n.type === 'Hydrant') this.hydrants.push(i); });
    // connected components
    this.comp = new Int32Array(this.N).fill(-1);
    let nc = 0;
    for (let s = 0; s < this.N; s++) {
      if (this.comp[s] >= 0) continue;
      const st = [s]; this.comp[s] = nc;
      while (st.length) { const u = st.pop(); for (const [v] of this.adj[u]) if (this.comp[v] < 0) { this.comp[v] = nc; st.push(v); } }
      nc++;
    }
    this.nComp = nc;
    // reachable from a reservoir
    this.reach = new Uint8Array(this.N);
    for (const r of this.reservoirs) { const c = this.comp[r]; for (let i = 0; i < this.N; i++) if (this.comp[i] === c) this.reach[i] = 1; }
    this.isTree = (this.M === this.N - this.nComp);
    this._sp = new Map();
    this._hyd = null;
  }
  linkBetween(i, j) { const k = this.linkOf.get(i + '-' + j); return k === undefined ? -1 : k; }
  totalLength() { let s = 0; for (const l of this.links) s += l.L; return s; }
  totalHydQ() { let s = 0; for (const i of this.hydrants) s += this.nodes[i].q; return s; }
  totalArea() { let s = 0; for (const i of this.hydrants) s += this.nodes[i].area; return s; }

  /** Dijkstra with link length as cost (clsFlowPath). Returns {dist, predNode, predLink} */
  shortestPaths(src) {
    const key = src;
    if (this._sp.has(key)) return this._sp.get(key);
    const N = this.N, dist = new Float64Array(N).fill(Infinity), pn = new Int32Array(N).fill(-1), pl = new Int32Array(N).fill(-1);
    dist[src] = 0;
    // binary heap of [dist,node]
    const hd = [], hn = [];
    const push = (d, n) => { let i = hd.length; hd.push(d); hn.push(n); while (i > 0) { const p = (i - 1) >> 1; if (hd[p] <= hd[i]) break; [hd[p], hd[i]] = [hd[i], hd[p]]; [hn[p], hn[i]] = [hn[i], hn[p]]; i = p; } };
    const pop = () => { const d = hd[0], n = hn[0]; const ld = hd.pop(), ln = hn.pop(); if (hd.length) { hd[0] = ld; hn[0] = ln; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < hd.length && hd[l] < hd[m]) m = l; if (r < hd.length && hd[r] < hd[m]) m = r; if (m === i) break; [hd[m], hd[i]] = [hd[i], hd[m]]; [hn[m], hn[i]] = [hn[i], hn[m]]; i = m; } } return [d, n]; };
    push(0, src);
    while (hd.length) {
      const [d, u] = pop();
      if (d > dist[u]) continue;
      for (const [v, k] of this.adj[u]) {
        const nd = d + this.links[k].L;
        if (nd < dist[v]) { dist[v] = nd; pn[v] = u; pl[v] = k; push(nd, v); }
      }
    }
    const res = { dist, predNode: pn, predLink: pl };
    this._sp.set(key, res);
    return res;
  }
  /** links on the path from node D back to src (D-end first), as createSPaths order in solve_net */
  pathLinks(sp, D) {
    const out = []; let x = D;
    while (sp.predNode[x] >= 0) { out.push(sp.predLink[x]); x = sp.predNode[x]; }
    return out;
  }
  /** node index path src .. D */
  pathNodes(sp, D) {
    const out = [D]; let x = D;
    while (sp.predNode[x] >= 0) { x = sp.predNode[x]; out.push(x); }
    return out.reverse();
  }
  invalidatePaths() { this._sp = new Map(); }

  /** consistency checks; returns list of {level,msg} */
  check(plist) {
    const out = this.issues.slice();
    if (this.reservoirs.length === 0) out.push({ level: 'error', msg: 'No reservoir defined - set one node type to "Reservoir".' });
    const ids = new Set(); for (const n of this.nodes) { if (ids.has(n.id)) out.push({ level: 'error', msg: 'Duplicate node id ' + n.id }); ids.add(n.id); }
    const unreach = []; for (let i = 0; i < this.N; i++) if (!this.reach[i]) unreach.push(this.nodes[i].id);
    if (unreach.length && this.reservoirs.length) out.push({ level: 'error', msg: unreach.length + ' node(s) are not connected to any reservoir (first: ' + unreach.slice(0, 8).join(', ') + ').' });
    if (this.nComp > 1) out.push({ level: 'warn', msg: 'Network has ' + this.nComp + ' disconnected parts.' });
    const seen = new Set(); for (const l of this.links) { const k = Math.min(l.f, l.t) + '-' + Math.max(l.f, l.t); if (seen.has(k)) out.push({ level: 'warn', msg: 'Parallel pipes between nodes ' + l.f + ' and ' + l.t + ' (pipe ' + l.id + ')' }); seen.add(k); }
    for (const l of this.links) { if (!(l.L > 0)) out.push({ level: 'warn', msg: 'Pipe ' + l.id + ' has zero/invalid length' }); if (!(l.d > 0)) out.push({ level: 'error', msg: 'Pipe ' + l.id + ' has no valid diameter' }); }
    if (plist && plist.length) {
      const ds = new Set(plist.map(p => p.d)); const miss = this.links.filter(l => !ds.has(l.d));
      if (miss.length) out.push({ level: 'warn', msg: miss.length + ' pipe(s) have a diameter that is not in the pipe list (cost cannot be evaluated), e.g. pipe ' + miss[0].id + ' (' + miss[0].d + ' mm).' });
    }
    const zeroz = this.nodes.filter(n => n.z === 0).length;
    if (zeroz > 0) out.push({ level: 'warn', msg: zeroz + ' node(s) have elevation 0 (DEM value missing?).' });
    return out;
  }
  clone() {
    const m = new Model(this.nodes.map(n => Object.assign({}, n)), this.links.map(l => { const c = Object.assign({}, l); delete c.fi; delete c.ti; return c; }));
    return m;
  }
}

/* ------------------------------------------------------------------ */
/*  Hydraulic solver (EPANET-equivalent, Darcy-Weisbach)               */
/* ------------------------------------------------------------------ */

const K_DW = 0.0252 * 3.280839895 / 1.001084;   // EPANET 0.0252*L/d^5 (US units) in SI, h = K f L q^2 / d^5; /1.001084 calibrated against EPANET 2.2 (WNTR) single-pipe runs
const NU = 1.1e-5 * 0.09290304;          // EPANET default kinematic viscosity (1.1e-5 ft2/s) in m2/s
const ONE_OVER_LN10 = 1 / Math.LN10;

/** Darcy friction factor and d f / d Re, EPANET-style (laminar / cubic transition / Swamee-Jain) */
function frictionFactor(Re, epsD) {
  if (Re < 2000) return [64 / Math.max(Re, 1e-12), -64 / (Re * Re)];
  const sj = (re) => {
    const y1 = 5.74 / Math.pow(re, 0.9), y2 = epsD / 3.7 + y1, Lg = Math.log(y2) * ONE_OVER_LN10;
    const f = 0.25 / (Lg * Lg);
    const df = 0.45 * y1 / (Lg * Lg * Lg * Math.LN10 * y2 * re);
    return [f, df];
  };
  if (Re >= 4000) return sj(Re);
  // cubic Hermite between laminar (Re=2000) and Swamee-Jain (Re=4000)
  const f0 = 0.032, s0 = -64 / (2000 * 2000), [f1, s1] = sj(4000);
  const t = (Re - 2000) / 2000, t2 = t * t, t3 = t2 * t;
  const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
  const f = h00 * f0 + h10 * 2000 * s0 + h01 * f1 + h11 * 2000 * s1;
  const dh00 = 6 * t2 - 6 * t, dh10 = 3 * t2 - 4 * t + 1, dh01 = -6 * t2 + 6 * t, dh11 = 3 * t2 - 2 * t;
  const df = (dh00 * f0 + dh10 * 2000 * s0 + dh01 * f1 + dh11 * 2000 * s1) / 2000;
  return [f, df];
}

/**
 * Sparse SPD solver with fixed elimination order (reverse BFS from the reservoirs:
 * zero fill-in for branched networks, small fill-in for a few loops).
 */
class Hydraulics {
  constructor(model) {
    this.m = model;
    this.setup();
  }
  setup() {
    const m = this.m, N = m.N, M = m.M;
    // unknown nodes = reachable, not reservoir
    const isRes = new Uint8Array(N); for (const r of m.reservoirs) isRes[r] = 1;
    this.isRes = isRes;
    // multi-source BFS from reservoirs
    const order = [], seen = new Uint8Array(N);
    const q = []; for (const r of m.reservoirs) { q.push(r); seen[r] = 1; }
    for (let h = 0; h < q.length; h++) { const u = q[h]; for (const [v] of m.adj[u]) if (!seen[v]) { seen[v] = 1; q.push(v); } }
    // unknowns in reverse BFS order (leaves eliminated first)
    const pos = new Int32Array(N).fill(-1); let n = 0;
    const unk = []; for (let h = q.length - 1; h >= 0; h--) { const u = q[h]; if (!isRes[u]) { pos[u] = n++; unk.push(u); } }
    this.pos = pos; this.n = n; this.unk = Int32Array.from(unk);
    // symbolic factorisation
    const cols = []; for (let k = 0; k < n; k++) cols.push(new Set());
    this.linkActive = new Uint8Array(M);
    for (let l = 0; l < M; l++) {
      const L = m.links[l]; if (L.fi < 0) continue;
      if (!seen[L.fi] || !seen[L.ti]) continue;
      this.linkActive[l] = 1;
      const pa = pos[L.fi], pb = pos[L.ti];
      if (pa >= 0 && pb >= 0 && pa !== pb) cols[Math.min(pa, pb)].add(Math.max(pa, pb));
    }
    for (let k = 0; k < n; k++) {
      const nb = Array.from(cols[k]).sort((a, b) => a - b);
      for (let i = 0; i < nb.length; i++) for (let j = i + 1; j < nb.length; j++) cols[nb[i]].add(nb[j]);
    }
    const colStart = new Int32Array(n + 1); const idxs = [];
    for (let k = 0; k < n; k++) { const nb = Array.from(cols[k]).sort((a, b) => a - b); colStart[k] = idxs.length; for (const x of nb) idxs.push(x); }
    colStart[n] = idxs.length;
    this.colStart = colStart; this.colIdx = Int32Array.from(idxs); this.nnz = idxs.length;
    const find = (col, row) => { let lo = colStart[col], hi = colStart[col + 1] - 1; while (lo <= hi) { const mid = (lo + hi) >> 1; const v = this.colIdx[mid]; if (v === row) return mid; if (v < row) lo = mid + 1; else hi = mid - 1; } return -1; };
    this.slot = new Int32Array(M).fill(-1);
    for (let l = 0; l < M; l++) {
      if (!this.linkActive[l]) continue;
      const L = m.links[l]; const pa = pos[L.fi], pb = pos[L.ti];
      if (pa >= 0 && pb >= 0 && pa !== pb) this.slot[l] = find(Math.min(pa, pb), Math.max(pa, pb));
    }
    const upd = [];
    for (let k = 0; k < n; k++) {
      const s = colStart[k], e = colStart[k + 1];
      for (let a = s; a < e; a++) for (let b = a + 1; b < e; b++) upd.push(find(this.colIdx[a], this.colIdx[b]));
    }
    this.upd = Int32Array.from(upd);
    this.diag = new Float64Array(n); this.val = new Float64Array(this.nnz); this.rhs = new Float64Array(n);
    this.refreshLinks();
  }
  /** recompute per-pipe constants from current diameters/roughness (call after any change) */
  refreshLinks() {
    const m = this.m, M = m.M;
    this.R = new Float64Array(M); this.cRe = new Float64Array(M); this.epsD = new Float64Array(M); this.area = new Float64Array(M);
    for (let l = 0; l < M; l++) {
      const L = m.links[l]; const d = L.d / 1000;
      if (!(d > 0)) { this.R[l] = 1e12; this.cRe[l] = 1; this.epsD[l] = 0; this.area[l] = 1e-12; continue; }
      this.R[l] = K_DW * L.L / Math.pow(d, 5);
      this.cRe[l] = 4 / (PI * d * NU);
      this.epsD[l] = (L.r / 1000) / d;
      this.area[l] = PI * d * d / 4;
    }
  }
  /**
   * cfg: { Hup, open:Uint8Array|null, mode:'fixed'|'emitter'|'regulator', hdes, h0, acc, maxTrials, fixedAll:boolean }
   *  - mode 'fixed'    : open hydrants withdraw their nominal discharge q
   *  - mode 'emitter'  : open hydrants withdraw C*p^0.5, C = q/sqrt(hdes-h0)     (EPANET emitter)
   *  - mode 'regulator': as emitter but limited to the nominal discharge q       (CV pipe + FCV + emitter)
   * returns { P, H, Q (l/s, signed, along f->t), V (m/s, abs), D (node withdrawal l/s), iters, converged }
   */
  solve(cfg) {
    const m = this.m, N = m.N, M = m.M, n = this.n, pos = this.pos;
    const Hup = cfg.Hup, open = cfg.open, mode = cfg.mode || 'fixed';
    const acc = cfg.acc || 1e-9, maxT = cfg.maxTrials || 200;
    const H = new Float64Array(N), Q = new Float64Array(M), D = new Float64Array(N);
    const nodes = m.nodes, links = m.links;
    const Hres = new Float64Array(N);
    for (const r of m.reservoirs) { H[r] = nodes[r].z + Hup; Hres[r] = H[r]; }
    // initial guess: all unknown heads at reservoir head; flows at 0.3048 m/s
    let hr0 = m.reservoirs.length ? H[m.reservoirs[0]] : 0;
    for (let i = 0; i < N; i++) if (!this.isRes[i]) H[i] = hr0;
    for (let l = 0; l < M; l++) Q[l] = 0.3048 * this.area[l];
    // nominal demand / emitter coefficient (in m3/s)
    const qn = new Float64Array(N), Ce = new Float64Array(N);   // qn: nominal m3/s ; Ce: emitter coeff m3/s per sqrt(m)
    const sq = (mode === 'fixed') ? 1 : Math.sqrt(Math.max((cfg.hdes || 1) - (cfg.h0 || 0), 1e-6));
    for (let i = 0; i < N; i++) {
      if (nodes[i].type === 'Reservoir') continue;
      const isOpen = open ? open[i] === 1 : (nodes[i].type === 'Hydrant');
      if (isOpen) { qn[i] = nodes[i].q / 1000; if (mode !== 'fixed') Ce[i] = qn[i] / sq; }
    }
    const P_ = new Float64Array(M), Y_ = new Float64Array(M);
    const diag = this.diag, val = this.val, rhs = this.rhs;
    const d0 = new Float64Array(N), dd = new Float64Array(N);
    const nodeDemand = (i, Hi) => {         // returns demand (m3/s) and derivative wrt head
      if (mode === 'fixed') return [qn[i], 0];
      const c = Ce[i]; if (c === 0) return [0, 0];
      const p = Hi - nodes[i].z, a = Math.abs(p);
      let dem = c * Math.sqrt(a) * (p < 0 ? -1 : 1), der = 0.5 * c / Math.sqrt(Math.max(a, 1e-3));
      if (mode === 'regulator' && dem >= qn[i]) { dem = qn[i]; der = 0; }
      return [dem, der];
    };
    let converged = false, trial = 0;
    const R = this.R, cRe = this.cRe, epsD = this.epsD;
    for (trial = 1; trial <= maxT; trial++) {
      diag.fill(0); val.fill(0); rhs.fill(0);
      for (let l = 0; l < M; l++) {
        if (!this.linkActive[l]) continue;
        const q = Q[l], a = Math.abs(q), Re = a * cRe[l];
        let h, g;
        if (Re < 2000) { const k = R[l] * 64 / cRe[l]; h = k * q; g = k; }
        else { const [f, df] = frictionFactor(Re, epsD[l]); h = R[l] * f * q * a; g = R[l] * (2 * f * a + a * a * df * cRe[l]); }
        if (g < 1e-9) g = 1e-9;
        const P = 1 / g, Y = q - P * h;
        P_[l] = P; Y_[l] = Y;
        const L = links[l], pa = pos[L.fi], pb = pos[L.ti];
        if (pa >= 0) { diag[pa] += P; rhs[pa] -= Y; if (pb < 0) rhs[pa] += P * Hres[L.ti]; }
        if (pb >= 0) { diag[pb] += P; rhs[pb] += Y; if (pa < 0) rhs[pb] += P * Hres[L.fi]; }
        if (pa >= 0 && pb >= 0) val[this.slot[l]] -= P;
      }
      // node demand terms
      const damp = trial > 40 ? 0.5 : 1;
      for (let u = 0; u < n; u++) {
        const i = this.unk[u];
        const [dm, der] = nodeDemand(i, H[i]);
        d0[i] = dm; dd[i] = der;
        diag[u] += der; rhs[u] += -dm + der * H[i];
      }
      // solve (LDL^T)
      this._factor(diag, val);
      this._solve(diag, val, rhs);
      // update heads / flows
      let sdq = 0, sq_ = 0, sdd = 0, sd = 0;
      for (let u = 0; u < n; u++) {
        const i = this.unk[u]; const hn = rhs[u];
        H[i] = damp * hn + (1 - damp) * H[i];
      }
      for (let l = 0; l < M; l++) {
        if (!this.linkActive[l]) continue;
        const L = links[l];
        const qn_ = Y_[l] + P_[l] * (H[L.fi] - H[L.ti]);
        sdq += Math.abs(qn_ - Q[l]); sq_ += Math.abs(qn_);
        Q[l] = qn_;
      }
      if (mode !== 'fixed') {
        for (let u = 0; u < n; u++) {
          const i = this.unk[u]; const [dm] = nodeDemand(i, H[i]);
          sdd += Math.abs(dm - d0[i]); sd += Math.abs(dm);
        }
      }
      const err = (sdq + sdd) / Math.max(sq_ + sd, 1e-12);
      if (err <= acc && trial >= 2) { converged = true; break; }
    }
    // final demands and pressures
    const P = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      if (nodes[i].type === 'Reservoir' || !m.reach[i]) { P[i] = 0; continue; }
      P[i] = H[i] - nodes[i].z;
      D[i] = nodeDemand(i, H[i])[0] * 1000;
    }
    const V = new Float64Array(M), Ql = new Float64Array(M);
    for (let l = 0; l < M; l++) { Ql[l] = Q[l] * 1000; V[l] = Math.abs(Q[l]) / this.area[l]; }
    return { P, H, Q: Ql, V, D, iters: trial > maxT ? maxT : trial, converged };
  }
  _factor(diag, val) {
    const n = this.n, cs = this.colStart, ci = this.colIdx, upd = this.upd;
    let u = 0;
    for (let k = 0; k < n; k++) {
      const d = diag[k], s = cs[k], e = cs[k + 1];
      for (let a = s; a < e; a++) {
        const v = val[a], l = v / d;
        diag[ci[a]] -= v * l;
        for (let b = a + 1; b < e; b++) val[upd[u++]] -= l * val[b];
        val[a] = l;
      }
    }
  }
  _solve(diag, val, b) {
    const n = this.n, cs = this.colStart, ci = this.colIdx;
    for (let k = 0; k < n; k++) { const bk = b[k]; for (let a = cs[k]; a < cs[k + 1]; a++) b[ci[a]] -= val[a] * bk; }
    for (let k = 0; k < n; k++) b[k] /= diag[k];
    for (let k = n - 1; k >= 0; k--) { let s = b[k]; for (let a = cs[k]; a < cs[k + 1]; a++) s -= val[a] * b[ci[a]]; b[k] = s; }
  }
}

/* ------------------------------------------------------------------ */
/*  Design discharge (Clement) and LIDM pipe sizing                    */
/* ------------------------------------------------------------------ */

const CLEMENT_U = { 0.90: 1.285, 0.91: 1.345, 0.92: 1.405, 0.93: 1.475, 0.94: 1.555, 0.95: 1.645, 0.96: 1.755, 0.97: 1.885, 0.98: 2.055, 0.99: 2.324 };
function clementU(pq) {
  const keys = Object.keys(CLEMENT_U).map(Number).sort((a, b) => a - b);
  if (pq <= keys[0]) return CLEMENT_U[keys[0]];
  if (pq >= keys[keys.length - 1]) return CLEMENT_U[keys[keys.length - 1]];
  for (let i = 0; i < keys.length - 1; i++) if (pq >= keys[i] - 1e-9 && pq <= keys[i + 1] + 1e-9) {
    const t = (pq - keys[i]) / (keys[i + 1] - keys[i]); return CLEMENT_U[keys[i]] * (1 - t) + CLEMENT_U[keys[i + 1]] * t;
  }
  return 1.645;
}
/** Clement's formula. nj hydrants, A total area (ha), d mean nominal discharge (l/s), r utilisation (T/24), qs (l/s/ha), pq probability */
function clementQ(nj, A, d, r, qs, pq) {
  const u = clementU(pq);
  let p = (((qs * A) / nj) / d) / r;
  if (p > 1) p = 1;       // guard: the VB code would produce NaN here
  return nj * p * d + u * Math.sqrt(nj * p * (1 - p) * d * d);
}

/**
 * Design discharge of every pipe (BtnClement_Click).
 * opts: { qs, T, pq, minHyd, reservoirs:[nodeIdx] (each is evaluated, maximum kept), legacyRound }
 * Writes link.Qd, returns {Q:[], N:[], A:[], disconnected:[nodeIdx]}
 */
function computeClement(model, opts) {
  const M = model.M, r = opts.T / 24;
  const Qd = new Float64Array(M);
  let disconnected = [];
  const ress = (opts.reservoirs && opts.reservoirs.length) ? opts.reservoirs : model.reservoirs;
  const outQ = new Float64Array(M), outN = new Int32Array(M), outA = new Float64Array(M);
  ress.forEach((res, ri) => {
    const sp = model.shortestPaths(res);
    const Q = new Float64Array(M), Nh = new Int32Array(M), A = new Float64Array(M);
    disconnected = [];
    for (let i = 0; i < model.N; i++) {
      if (i === res) continue;
      const nd = model.nodes[i];
      if (nd.q === 0) continue;
      if (!isFinite(sp.dist[i])) { disconnected.push(i); continue; }
      let x = i;
      while (sp.predNode[x] >= 0) { const l = sp.predLink[x]; Q[l] += nd.q; Nh[l]++; A[l] += nd.area; x = sp.predNode[x]; }
    }
    for (let l = 0; l < M; l++) {
      let qmin = 0, qcl = 0;
      if (Nh[l] > 0) {
        const ds = Q[l] / Nh[l];
        qmin = Nh[l] <= opts.minHyd ? Nh[l] * ds : opts.minHyd * ds;
        qcl = clementQ(Nh[l], A[l], ds, r, opts.qs, opts.pq);
      }
      const v = Math.max(qmin, qcl);
      if (ri === 0 || v > Qd[l]) { Qd[l] = v; outQ[l] = Q[l]; outN[l] = Nh[l]; outA[l] = A[l]; }
    }
  });
  for (let l = 0; l < M; l++) model.links[l].Qd = opts.legacyRound ? Math.round(Qd[l] * 100) / 100 : Qd[l];
  return { Q: outQ, N: outN, A: outA, disconnected };
}

/** LIDM.DW_headloss: Darcy-Weisbach head loss (m) used inside the optimiser. rough, diam in mm; Q in l/s; L in m. */
function dwHeadloss(rough, diam, discharge, length) {
  const q = discharge * 3.6;                                   // m3/h
  const v = (q / 3600) / (3.14 * ((diam / 1000) ** 2) / 4);    // VB code uses pi = 3.14
  const Re = cint(v * diam * 1000000 / 891);                   // mu = 0.000891 Pa s (25 C)
  let lam;
  if (Re < 2000) {
    lam = Re === 0 ? 0 : 64 / Re;
  } else {
    const A = 2.51 / Re, B = rough / (3.7 * diam);
    let x0 = 0.001; lam = NaN;
    for (let n = 1; n <= 50; n++) {
      const fx = Math.pow(x0, -0.5) + 2 * Math.log10(A * Math.pow(x0, -0.5) + B);
      const df = -0.5 * Math.pow(x0, -1.5) - (A * Math.pow(x0, -1.5)) / (2.3 * (A * Math.pow(x0, -0.5) + B));
      const xn = x0 - fx / df;
      if (Math.abs(xn - x0) <= 1e-7) { lam = xn; break; }
      x0 = xn;
    }
    if (!(lam > 0)) { // Newton diverged: fall back to Swamee-Jain (VB code would return 0 head loss)
      lam = 0.25 / Math.pow(Math.log10(B + 5.74 / Math.pow(Re, 0.9)), 2);
    }
  }
  return ((lam * 1000 * v * v * length) / (2 * (diam / 1000))) / 10000;
}

/**
 * Labye Iterative Discontinuous Method (solve_net + BtnDesign_Click).
 * p: { plist:[{d,price,rough}], hpiez, hmin, res (node idx), Qd: Float64Array(M) design discharge (l/s), maxIter, onIter(i,hreq) }
 * returns { ok, iterations, hist[], diam[], rough[], hreq, worst }
 */
function designLIDM(model, p) {
  const plist = p.plist, nd = plist.length, M = model.M;
  const diams = plist.map(x => x.d);
  const nearRow = (d) => { let id = 0; for (let i = 0; i < nd; i++) if (d >= diams[i]) id = i + 1; return id; };
  const diam = new Float64Array(M), rough = new Float64Array(M), cost = new Float64Array(M), idxOf = new Int32Array(M);
  for (let j = 0; j < M; j++) {
    let id = nearRow(Math.sqrt((4 * p.Qd[j]) * 1000 / (PI * 2.5)));
    if (id === nd) id = nd - 1;
    idxOf[j] = id;                       // 0-based index of Pipe_C(id+1)
    diam[j] = plist[id].d; rough[j] = plist[id].rough; cost[j] = plist[id].price;
  }
  const res = p.res, sp = model.shortestPaths(res), zo = model.nodes[res].z;
  const hyd = []; for (let i = 0; i < model.N; i++) if (model.nodes[i].q !== 0 && i !== res && isFinite(sp.dist[i])) hyd.push(i);
  if (!hyd.length) return { ok: false, iterations: 0, hist: [], diam, rough, hreq: 0, worst: -1, msg: 'No hydrants connected to the selected reservoir.' };
  const paths = new Map(); for (const h of hyd) paths.set(h, model.pathLinks(sp, h));
  const L = model.links.map(l => l.L);
  const hf = new Float64Array(M);
  for (let j = 0; j < M; j++) hf[j] = dwHeadloss(rough[j], diam[j], p.Qd[j], L[j]);
  const hist = [], maxIter = p.maxIter || 10000;
  let hreq = 0, worst = -1;
  for (let it = 1; it <= maxIter; it++) {
    // worst placed hydrant
    let hfmax = 0; worst = -1;
    for (const h of hyd) {
      let t = 0; const pl = paths.get(h);
      for (let k = 0; k < pl.length; k++) t += hf[pl[k]];
      t += model.nodes[h].z - zo;
      if (hfmax < t) { hfmax = t; worst = h; }
    }
    if (worst < 0) return { ok: false, iterations: it, hist, diam, rough, hreq, worst, msg: 'No hydrant with positive head requirement.' };
    const path = paths.get(worst);
    let htot = 0, betaMin = 0, betaId = -1, betaNext = -1;
    for (let k = 0; k < path.length; k++) {
      const l = path[k];
      const hft = Math.abs(hf[l]); htot += hft;
      const cur = idxOf[l];
      let beta;
      let nxt = -1;
      if (cur < nd - 1 && diam[l] !== diams[nd - 1]) nxt = cur + 1;
      if (nxt < 0) beta = 1e6;
      else {
        const hf1 = Math.abs(dwHeadloss(plist[nxt].rough, plist[nxt].d, p.Qd[l], L[l]));
        const den = hft - hf1;
        beta = (L[l] * (plist[nxt].price - cost[l])) / den;
        if (Number.isNaN(beta)) beta = Infinity;
      }
      if (k === 0) { betaMin = beta; betaId = l; betaNext = nxt; }
      else if (betaMin >= beta || betaMin >= beta - 1e-9 * Math.abs(beta)) { betaMin = beta;   // tolerance: exact ties (beta is independent of pipe length) are resolved deterministically in favour of the pipe nearest the source, as in the VB code
         betaId = l; betaNext = nxt; }
    }
    hreq = htot + (model.nodes[worst].z - zo) + p.hmin;
    hist.push(hreq);
    if (p.onIter) p.onIter(it, hreq);
    if (hreq < p.hpiez) return { ok: true, iterations: it, hist, diam, rough, hreq, worst };
    if (betaNext < 0) return { ok: false, iterations: it, hist, diam, rough, hreq, worst, msg: 'All pipes on the critical path already have the largest diameter: increase the upstream pressure head, or add larger diameters to the pipe list.' };
    if (p.onPick) p.onPick(it, model.links[betaId].id, betaMin, worst);
    idxOf[betaId] = betaNext; diam[betaId] = plist[betaNext].d; rough[betaId] = plist[betaNext].rough; cost[betaId] = plist[betaNext].price;
    hf[betaId] = dwHeadloss(rough[betaId], diam[betaId], p.Qd[betaId], L[betaId]);
  }
  return { ok: false, iterations: maxIter, hist, diam, rough, hreq, worst, msg: 'Maximum number of iterations reached.' };
}

/**
 * check_pipes: no pipe may be smaller than any pipe downstream of it (rooted at the reservoir `res`).
 * diam: Float64Array(M) modified in place. Returns list of changed link indices.
 */
function checkPipeDiameters(model, res, diam) {
  const sp = model.shortestPaths(res), changed = new Set();
  // process nodes far -> near so that we can do a post-order maximum
  const order = []; for (let i = 0; i < model.N; i++) if (isFinite(sp.dist[i]) && i !== res) order.push(i);
  order.sort((a, b) => sp.dist[b] - sp.dist[a]);
  // max downstream diameter for each node's incoming (upstream) link, iterated until stable
  const maxDown = new Float64Array(model.N);       // max diameter over the subtree below a node
  for (const i of order) {
    const l = sp.predLink[i], par = sp.predNode[i];
    let d = Math.max(diam[l], maxDown[i]);
    if (d > diam[l]) { diam[l] = d; changed.add(l); }
    if (d > maxDown[par]) maxDown[par] = d;
  }
  return Array.from(changed);
}

function pipeCost(model, diam, plist) {
  const price = new Map(plist.map(p => [p.d, p.price]));
  const byD = new Map(plist.map(p => [p.d, { d: p.d, length: 0, cost: 0, n: 0 }]));
  let total = 0, len = 0; const missing = [];
  for (let l = 0; l < model.M; l++) {
    const d = diam[l], L = model.links[l].L; len += L;
    if (!price.has(d)) { missing.push(l); continue; }
    const c = L * price.get(d); total += c; const e = byD.get(d); e.length += L; e.cost += c; e.n++;
  }
  return { total, length: len, byDiam: Array.from(byD.values()), missing };
}

/* ------------------------------------------------------------------ */
/*  Random configurations and analyses                                 */
/* ------------------------------------------------------------------ */

/** open hydrants at random (without replacement) until the discharge Qup is reached */
function randomConfig(model, Qup, rng, buf) {
  const open = buf || new Uint8Array(model.N); open.fill(0);
  const h = model.hydrants.slice(); let f = h.length, tot = 0;
  while (tot < Qup && f > 0) {
    const k = Math.floor(rng() * f);
    const i = h[k]; h[k] = h[f - 1]; f--;
    open[i] = 1; tot += model.nodes[i].q;
  }
  return open;
}

function hydCfg(opts, open) {
  return { Hup: opts.Hup, open, mode: opts.mode || 'fixed', hdes: opts.hdes, h0: opts.h0, acc: opts.acc || 1e-9 };
}

const yieldUI = () => new Promise(r => setTimeout(r, 0));

/**
 * System level analysis (Btn_CC): required upstream pressure head for a set of upstream discharges.
 * opts: { Hup, Hmin, discharges:[], iters, seed, criterion:'all'|'hydrants'|'open', mode, hdes, h0, legacyRound }
 */
async function systemAnalysis(model, hyd, opts, onProgress) {
  const rng = makeRng(opts.seed), out = [], iters = opts.iters;
  const crit = opts.criterion || 'all';
  let done = 0; const total = iters * opts.discharges.length;
  for (const Qup of opts.discharges) {
    const req = new Float64Array(iters);
    for (let j = 0; j < iters; j++) {
      const open = randomConfig(model, Qup, rng);
      const r = hyd.solve(hydCfg(opts, open));
      let mn = Infinity;
      for (let i = 0; i < model.N; i++) {
        if (model.nodes[i].type === 'Reservoir' || !model.reach[i]) continue;
        if (crit === 'hydrants' && model.nodes[i].type !== 'Hydrant') continue;
        if (crit === 'open' && !open[i]) continue;
        let p = r.P[i]; if (opts.legacyRound) p = Math.round(p);
        if (opts.legacyRound && p === 0) continue;
        if (p < mn) mn = p;
      }
      req[j] = isFinite(mn) ? opts.Hup + (opts.Hmin - mn) : NaN;
      if (++done % 25 === 0) { if (onProgress) onProgress(done / total); await yieldUI(); }
    }
    const s = sortedCopy(req);
    const pct = []; for (let k = 0; k <= 10; k++) pct.push(s[pIdx(iters, k / 10)]);
    out.push({ Q: Qup, sorted: s, pct, min: s[0], max: s[iters - 1], p5: s[pIdx(iters, 0.05)], p25: s[pIdx(iters, 0.25)], p50: s[pIdx(iters, 0.5)], p75: s[pIdx(iters, 0.75)], p95: s[pIdx(iters, 0.95)] });
  }
  if (onProgress) onProgress(1);
  return out;
}

/**
 * Hydrant level analysis (BtnAKLA): hydrant pressure deficit (HPD), reliability and pipe velocities.
 * opts: { Qup, Hup, Hmin, iters, seed, mode, hdes, h0, reliabilityBasis:'all'|'open' }
 */
async function hydrantAnalysis(model, hyd, opts, onProgress) {
  const rng = makeRng(opts.seed), iters = opts.iters;
  const hi = model.hydrants, nh = hi.length, M = model.M;
  const H = new Float32Array(nh * iters);           // pressure head per hydrant and iteration
  const O = new Uint8Array(nh * iters);             // was the hydrant open?
  const Vv = new Float32Array(M * iters);           // velocity per pipe and iteration
  const Qq = new Float32Array(M * iters);           // discharge per pipe and iteration (abs)
  const nOpen = new Int32Array(iters);
  let notConv = 0;
  for (let j = 0; j < iters; j++) {
    const open = randomConfig(model, opts.Qup, rng);
    const r = hyd.solve(hydCfg(opts, open));
    if (!r.converged) notConv++;
    for (let k = 0; k < nh; k++) { H[k * iters + j] = r.P[hi[k]]; O[k * iters + j] = open[hi[k]]; if (open[hi[k]]) nOpen[j]++; }
    for (let l = 0; l < M; l++) { Vv[l * iters + j] = r.V[l]; Qq[l * iters + j] = Math.abs(r.Q[l]); }
    if ((j + 1) % 20 === 0) { if (onProgress) onProgress((j + 1) / iters); await yieldUI(); }
  }
  const hmin = opts.Hmin;
  const hpd = [], rel = new Float64Array(nh), relOpen = new Float64Array(nh), pmin = new Float64Array(nh), pmean = new Float64Array(nh);
  for (let k = 0; k < nh; k++) {
    const arr = new Float64Array(iters); let ok = 0, oo = 0, no = 0, sm = 0, mn = Infinity;
    for (let j = 0; j < iters; j++) {
      const p = H[k * iters + j]; arr[j] = (p - hmin) / hmin; sm += p; if (p < mn) mn = p;
      if (p >= hmin) ok++;
      if (O[k * iters + j]) { no++; if (p >= hmin) oo++; }
    }
    arr.sort();
    const row = new Float64Array(9);
    for (let c = 1; c <= 9; c++) row[c - 1] = arr[pIdx(iters, 1 - 0.1 * c)];   // c*10% probability of being exceeded
    hpd.push(row);
    rel[k] = ok / iters * 100; relOpen[k] = no ? oo / no * 100 : NaN; pmin[k] = mn; pmean[k] = sm / iters;
  }
  // velocities: percentiles of non-zero values
  const vel = [];
  for (let l = 0; l < M; l++) {
    const vals = []; for (let j = 0; j < iters; j++) { const v = Vv[l * iters + j]; if (Math.round(v * 1000) / 1000 !== 0) vals.push(v); }
    if (!vals.length) { vel.push(null); continue; }
    const a = Float64Array.from(vals).sort(); const ff = a.length - 1;
    const row = new Float64Array(11);
    for (let c = 1; c <= 9; c++) row[c - 1] = a[cint((1 - 0.1 * c) * ff)];
    row[9] = stdev(a); row[10] = a[ff];
    vel.push(row);
  }
  if (onProgress) onProgress(1);
  return { iters, opts: Object.assign({}, opts), hydIdx: hi, H, O, hpd, rel, relOpen, pmin, pmean, vel, Vv, Qq, notConverged: notConv, nOpen };
}

/** Localized loops (Button1_Click_1). pct = 1..9 (10%..90% probability of exceedance) */
function findLoops(model, ha, pct) {
  const hmin = ha.opts.Hmin, nh = ha.hydIdx.length, out = [];
  const hpdv = (k) => ha.hpd[k][pct - 1] * hmin + hmin;    // pressure head at that probability
  for (let a = 0; a < nh; a++) {
    const H1 = hpdv(a);
    if (!(H1 < hmin)) continue;
    const ia = ha.hydIdx[a], na = model.nodes[ia];
    let best = null, beta = 1e7;
    for (let b = 0; b < nh; b++) {
      if (a === b) continue;
      const H2 = hpdv(b); if (!(H2 > hmin)) continue;
      const ib = ha.hydIdx[b], nb = model.nodes[ib];
      const L = Math.hypot(na.x - nb.x, na.y - nb.y), dH = Math.abs(H1 - H2);
      if (beta > L / dH) { beta = L / dH; best = { nin: na.id, nfi: nb.id, L: Math.round(L), dH: Math.round(dH * 100) / 100, beta: Math.round(beta * 100) / 100, ia, ib }; }
    }
    if (best) out.push(best);
  }
  return out;
}

/* ------------------------------------------------------------------ */
/*  Design methods on top of the hydraulic model                       */
/* ------------------------------------------------------------------ */

function linkArrays(model) {
  const M = model.M, d = new Float64Array(M), r = new Float64Array(M);
  model.links.forEach((l, i) => { d[i] = l.d; r[i] = l.r; });
  return { d, r };
}
function applyDesign(model, diam, rough) {
  for (let l = 0; l < model.M; l++) { model.links[l].d = diam[l]; if (rough) model.links[l].r = rough[l]; }
}

/** Design option 1: Q Clement. Uses link.Qd (computed with computeClement). */
function designClement(model, p) {
  const Qd = new Float64Array(model.M); model.links.forEach((l, i) => Qd[i] = l.Qd || 0);
  const r = designLIDM(model, { plist: p.plist, hpiez: p.hpiez, hmin: p.hmin, res: p.res, Qd, maxIter: p.maxIter, onIter: p.onIter });
  return finishDesign(model, r, p);
}
function finishDesign(model, r, p) {
  if (!r.ok) return r;
  const d = Float64Array.from(r.diam);
  const changed = checkPipeDiameters(model, p.res, d);
  r.diamChecked = d; r.checkedLinks = changed;
  r.cost = pipeCost(model, d, p.plist);
  return r;
}

/** Design option 2: Several Flow Regime. Envelope of pipe discharges over random configurations, then LIDM. */
async function designSFR(model, hyd, p, onProgress) {
  const rng = makeRng(p.seed), M = model.M, env = new Float64Array(M);
  for (let i = 0; i < p.nConf; i++) {
    const open = randomConfig(model, p.Qup, rng);
    const r = hyd.solve(hydCfg({ Hup: p.hpiez, mode: p.mode, hdes: p.hdes, h0: p.h0 }, open));
    for (let l = 0; l < M; l++) { const q = Math.abs(r.Q[l]); if (i === 0 || q > env[l]) env[l] = q; }
    if (onProgress && i % 10 === 0) { onProgress(i / p.nConf); await yieldUI(); }
  }
  if (p.legacyRound) for (let l = 0; l < M; l++) env[l] = Math.round(env[l]);
  for (let l = 0; l < M; l++) model.links[l].Qd = env[l];
  const r = designLIDM(model, { plist: p.plist, hpiez: p.hpiez, hmin: p.hmin, res: p.res, Qd: env, maxIter: p.maxIter });
  r.envelope = env;
  return finishDesign(model, r, p);
}

/**
 * Design option 3: Pareto front. n designs (each from nConf random configurations), each evaluated on nAna
 * random configurations; the design maximising reliability/cost is selected.
 */
async function designPareto(model, hyd, p, onProgress) {
  const rng = makeRng(p.seed), M = model.M;
  const designs = [];
  const total = p.nDes;
  const savedD = model.links.map(l => l.d), savedR = model.links.map(l => l.r);
  for (let dI = 0; dI < p.nDes; dI++) {
    // envelope flows with the *current* diameters (as the VB tool does on the working network)
    const env = new Float64Array(M);
    for (let i = 0; i < p.nConf; i++) {
      const open = randomConfig(model, p.Qup, rng);
      const r = hyd.solve(hydCfg({ Hup: p.hpiez, mode: p.mode, hdes: p.hdes, h0: p.h0 }, open));
      for (let l = 0; l < M; l++) { const q = Math.abs(r.Q[l]); if (i === 0 || q > env[l]) env[l] = q; }
    }
    if (p.legacyRound) for (let l = 0; l < M; l++) env[l] = Math.round(env[l]);
    const r = designLIDM(model, { plist: p.plist, hpiez: p.hpiez, hmin: p.hmin, res: p.res, Qd: env, maxIter: p.maxIter });
    if (!r.ok) { applyDesign(model, savedD, savedR); return Object.assign(r, { designs }); }
    const d = Float64Array.from(r.diam); checkPipeDiameters(model, p.res, d);
    const c = pipeCost(model, d, p.plist);
    // evaluate reliability of this design
    applyDesign(model, d, r.rough); hyd.refreshLinks();
    let relTot = 0;

async function runDesign() {
  if (!needRes()) return;
  const m = S.model, D = S.design, c = S.clem;
  if (!S.plist.length) { toast('The pipe list is empty.', { err: true }); return; }
  await task('Optimising pipe sizes…', async (prog) => {
    const base = { plist: S.plist, hpiez: D.hpiez, hmin: D.hmin, res: S.res, maxIter: 20000, legacyRound: c.legacy };
    const savedD = currentDiam(), savedR = Float64Array.from(m.links, l => l.r);
    let r;
    if (D.method === 'clement') {
      C.computeClement(m, { qs: c.qs, T: c.T, pq: c.pq, minHyd: c.minHyd, reservoirs: [S.res], legacyRound: c.legacy }); S.qdSource = 'clement';
      r = C.designClement(m, base);
    } else if (D.method === 'sfr') {
      r = await C.designSFR(m, S.hyd, Object.assign({}, base, hydOpt({ Qup: D.Qup, nConf: D.nConf, seed: D.seed })), prog);
      S.qdSource = 'sfr';
    } else {
      r = await C.designPareto(m, S.hyd, Object.assign({}, base, hydOpt({ Qup: D.Qup, nConf: D.nConf, nDes: D.nDes, nAna: D.nAna, seed: D.seed })), prog);
      C.applyDesign(m, savedD, savedR);                       // designPareto leaves the best design applied: put things back, staged as "pending"
      S.qdSource = 'sfr';
    }
    S.hyd.refreshLinks();
    D.pending = r.ok ? { method: D.method, diam: Float64Array.from(r.diamChecked || r.diam), rough: r.rough ? Float64Array.from(r.rough) : null, cost: r.cost, iterations: r.iterations, hist: r.hist || [], designs: r.designs || null, best: r.best, hreq: r.hreq, hpiez: D.hpiez, hmin: D.hmin } : null;
    if (r.ok && D.pending.rough) { for (let k = 0; k < m.M; k++) { const pl = S.plist.find(x => x.d === D.pending.diam[k]); if (pl) D.pending.rough[k] = pl.rough; } }
    D.lastError = r.ok ? null : (r.msg || 'No feasible design found.');
    updateMapModes(); if (r.ok) setMapMode('newdiam'); else MapView.draw();
    renderDesignResult(); invalidate('network');
    toast(r.ok ? 'Design found in ' + r.iterations + ' iterations' : (D.lastError), { err: !r.ok });
  });
}

/* ===== COPAM-Web UI: GIS import wizard, ground elevation (file / online), network generation, EPANET export ===== */
const txtOf = buf => new TextDecoder().decode(buf);
const splitName = n => { const m = String(n).match(/^(.*)\.([^.]+)$/); return m ? { base: m[1], ext: m[2].toLowerCase() } : null; };

/** File objects -> [{name, base, ext, buf}] (ZIP archives are unpacked) */
async function expandFiles(files) {
  const out = [];
  for (const f of Array.from(files)) {
    const sn = splitName(f.name); if (!sn) continue;
    if (sn.ext === 'zip') {
      const z = await G.readZip(await readFileBuf(f));
      for (const n in z) { const s2 = splitName(n); if (s2) out.push({ name: n, base: s2.base, ext: s2.ext, buf: z[n] }); }
    } else out.push({ name: f.name, base: sn.base, ext: sn.ext, buf: await readFileBuf(f) });
  }
  return out;
}
function groupByBase(ent) {
  const m = new Map();
  for (const e of ent) { const k = e.base.toLowerCase(); if (!m.has(k)) m.set(k, { name: e.base, raw: {} }); m.get(k).raw[e.ext] = e.buf; }
  return m;
}

/* ---------- shapefile slots ---------- */
const SLOT_KIND = { pipes: 'line', hyd: 'point', res: 'point' };
const SLOT_TITLE = { pipes: 'pipe', hyd: 'hydrant', res: 'reservoir' };
const looksGeographic = bb => bb && Math.abs(bb[0]) <= 180 && Math.abs(bb[2]) <= 180 && Math.abs(bb[1]) <= 90 && Math.abs(bb[3]) <= 90;
const KIND_WORD = { point: 'points', line: 'lines', polygon: 'polygons', other: 'unsupported geometry' };

function buildSlot(role, name, raw) {
  const slot = { name, raw, layer: null, crs: null, note: '', err: '' };
  try {
    if (!raw.shp) throw new Error('the .shp file is missing');
    const shp = G.parseShp(raw.shp), kind = G.geometryKind(shp.type);
    if (kind !== SLOT_KIND[role]) throw new Error('this file contains ' + KIND_WORD[kind] + ', a ' + SLOT_TITLE[role] + ' layer needs ' + KIND_WORD[SLOT_KIND[role]]);
    const dbf = raw.dbf ? G.parseDbf(raw.dbf) : null;
    slot.layer = G.makeLayer(name, shp, dbf); slot.layer.kind = kind;
    if (raw.prj) { try { slot.crs = PJ.parsePrj(txtOf(raw.prj)); } catch (e) { slot.note = e.message; } }
    if (!slot.crs && looksGeographic(shp.bbox)) { slot.crs = PJ.fromEpsg(4326); slot.note = 'no .prj: the coordinates look like longitude/latitude, WGS 84 assumed'; }
    else if (!slot.crs && !slot.note) slot.note = 'no .prj: set the coordinate system below';
  } catch (e) { slot.err = e.message; }
  S.gis.slots[role] = slot; guessFields(); updateCrs();
  return slot;
}
async function fillSlot(role, files) {
  const ent = await expandFiles(files), by = groupByBase(ent), cur = S.gis.slots[role];
  const key = Array.from(by.keys()).find(k => by.get(k).raw.shp);
  let raw, name;
  if (key) { const grp = by.get(key); name = grp.name; raw = (cur && cur.name.toLowerCase() === key) ? Object.assign({}, cur.raw) : {}; Object.assign(raw, grp.raw); }
  else if (cur) { raw = Object.assign({}, cur.raw); name = cur.name; for (const grp of by.values()) Object.assign(raw, grp.raw); }
  else { toast('Select the .shp file together with its .dbf and .prj (or a .zip).', { err: true }); return; }
  const s = buildSlot(role, name, raw);
  if (s.err) toast('Could not use ' + name + ': ' + s.err, { err: true }); else toast(SLOT_TITLE[role] + ' layer "' + name + '": ' + fmt0(s.layer.shapes.length) + ' features' + (s.raw.dbf ? '' : ' – add the .dbf to read the attributes') + (s.raw.prj ? '' : ' – add the .prj for the coordinate system'), { err: !s.raw.dbf });
  invalidate('gis');
}
function guessFields() {
  const ch = S.gis.choice, P = S.gis.slots.pipes, H = S.gis.slots.hyd;
  const pick = (slot, cur, re, numericOnly) => { if (!slot || !slot.layer) return ''; const fs = slot.layer.fields; if (cur && fs.find(f => f.name === cur)) return cur; const f = fs.find(f => re.test(f.name) && (!numericOnly || f.type !== 'C')); return f ? f.name : ''; };
  ch.diam = pick(P, ch.diam, /^(diam|dn$|dia|diametro)/i, true);
  ch.mat = pick(P, ch.mat, /^(mat|material|materiale|tipo_?tub)/i, false);
  ch.rough = pick(P, ch.rough, /rough|scab|eps|ks$|^k$/i, true);
  ch.q = pick(H, ch.q, /disch|portata|^q(_?ls)?$|flow|^q/i, true);
  ch.area = pick(H, ch.area, /^(area|superf|ha)/i, true);
}

/* ---------- global file handling (drop anywhere / Open files) ---------- */
async function handleFiles(files) {
  const ent = await expandFiles(files), msgs = [];
  const by = groupByBase(ent);
  let net = null, plist = null;
  for (const e of ent) {
    if (e.ext === 'in') { net = C.parseIn(txtOf(e.buf)); net.name = e.base; }
    else if (e.ext === 'pipe') { plist = C.parsePipeList(txtOf(e.buf)); S.pipeFile = e.name; }
  }
  if (plist) { S.plist = plist; msgs.push('pipe list (' + plist.length + ' diameters)'); invalidate('design', 'network'); }
  if (net) { setNetwork(net.nodes, net.links, net.name); msgs.push('network "' + net.name + '"'); }
  for (const grp of by.values()) {
    const r = grp.raw;
    try {
      if (r.tif || r.tiff) { await loadDemGroup(grp); msgs.push('DEM ' + grp.name); }
      else if (r.shp) {
        const shp = G.parseShp(r.shp), kind = G.geometryKind(shp.type);
        if (kind === 'line') { const s = buildSlot('pipes', grp.name, r); if (s.err) throw new Error(s.err); msgs.push('pipes ' + grp.name); }
        else if (kind === 'point') { const role = shp.shapes.length <= 3 ? 'res' : 'hyd'; const s = buildSlot(role, grp.name, r); if (s.err) throw new Error(s.err); msgs.push((role === 'res' ? 'reservoir ' : 'hydrants ') + grp.name); }
        else msgs.push('(polygon layer ' + grp.name + ' ignored)');
      } else if ((r.dbf || r.prj) && !net) {         // companions of an already loaded layer
        const role = ['pipes', 'hyd', 'res'].find(k => S.gis.slots[k] && S.gis.slots[k].name.toLowerCase() === grp.name.toLowerCase());
        if (role) { buildSlot(role, S.gis.slots[role].name, Object.assign({}, S.gis.slots[role].raw, r)); msgs.push('attributes of ' + grp.name); }
      }
    } catch (e) { toast('Could not read ' + grp.name + ': ' + e.message, { err: true }); }
  }
  if (msgs.length) { toast('Loaded ' + msgs.join(', ')); invalidate('gis'); if (!net && ent.some(e => ['shp', 'tif', 'tiff', 'dbf', 'prj'].includes(e.ext))) showTab('gis'); }
  else toast('No supported files found (use .shp + .dbf + .prj, .tif, a COPAM .in file or a .pipe list).', { err: true });
}

/* ---------- ground elevation ---------- */
async function loadDemGroup(grp) {
  const r = grp.raw, buf = r.tif || r.tiff;
  const dem = await G.parseGeoTiff(buf, r.tfw ? txtOf(r.tfw) : null);
  dem.name = grp.name; let crs = null, how = '';
  if (r.prj) { try { crs = PJ.parsePrj(txtOf(r.prj)); how = '.prj'; } catch (e) { how = ''; } }
  if (!crs && dem.epsg) { try { crs = PJ.fromEpsg(dem.epsg); how = 'GeoTIFF tag EPSG:' + dem.epsg; } catch (e) { /* unknown code */ } }
  const g = S.gis; g.dem = dem; g.demCrs = crs; g.demSrc = 'file';
  g.demInfo = grp.name + ' · ' + dem.W + '×' + dem.H + ' cells · ' + fmt0(dem.min) + '–' + fmt0(dem.max) + ' m · ' + (crs ? 'CRS ' + crs.name + ' (' + how + ')' : 'no CRS found: assumed equal to the network CRS');
  MapView.buildDem(); MapView.draw();
}
async function pickDemFiles(files) {
  const ent = await expandFiles(files), by = groupByBase(ent);
  const grp = Array.from(by.values()).find(x => x.raw.tif || x.raw.tiff);
  if (!grp) { toast('Select the GeoTIFF (.tif / .tiff), optionally with its .tfw or .prj.', { err: true }); return; }
  try { await loadDemGroup(grp); toast('DEM loaded: ' + S.gis.demInfo); } catch (e) { toast('Could not read the DEM: ' + e.message, { err: true }); }
  invalidate('gis');
}
function loadTerrariumTile(z, x, y) {
  return new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => { try { const c = document.createElement('canvas'); c.width = c.height = 256; const cx = c.getContext('2d'); cx.drawImage(im, 0, 0); res(cx.getImageData(0, 0, 256, 256).data); } catch (e) { res(null); } };
    im.onerror = () => res(null);
    im.src = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/' + z + '/' + x + '/' + y + '.png';
  });
}
function networkLonLatBox(marginM) {
  const p = S.gis.slots.pipes; if (!p || !p.layer) throw new Error('Load the pipe shapefile first: the DEM is downloaded for its extent.');

  const c = [[b[0] - m, b[1] - m], [b[2] + m, b[1] - m], [b[0] - m, b[3] + m], [b[2] + m, b[3] + m]].map(q => tr.toLL(q[0], q[1]));
  return [Math.min(...c.map(q => q[0])), Math.min(...c.map(q => q[1])), Math.max(...c.map(q => q[0])), Math.max(...c.map(q => q[1]))];

  let done = 0, next = 0;

  const g = S.gis; g.dem = dem; g.demCrs = PJ.fromEpsg(3857); g.demSrc = 'terrarium';

const nativeOf = slot => S.gis.crsText ? S.nativeCrs : ((slot && slot.crs) || S.nativeCrs);

function loadExampleGis() {
  const E = window.EXAMPLE; if (!E) { toast('Example data not available in this build.', { err: true }); return; }
  const g = S.gis, crs = PJ.parsePrj('PROJCS["WGS_1984_UTM_Zone_33N",GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]],PROJECTION["Transverse_Mercator"],PARAMETER["false_easting",500000.0],PARAMETER["false_northing",0.0],PARAMETER["central_meridian",15.0],PARAMETER["scale_factor",0.9996],PARAMETER["latitude_of_origin",0.0],UNIT["Meter",1.0]]');
  const mk = (role, key, name) => { const lay = Object.assign({}, E.layers[key], { name, kind: SLOT_KIND[role] }); g.slots[role] = { name, raw: { shp: 1, dbf: 1, prj: 1 }, layer: lay, crs, note: '', err: '' }; };
  mk('pipes', 'pipes', 'pipes'); mk('hyd', 'hydrants', 'hydrants'); mk('res', 'reservoir', 'Reservoir_D6');
  g.choice = { diam: 'Diam', mat: '', rough: 'Rough', q: 'Discharge', area: 'Area' };
  g.dem = decodeDem(E.dem); g.demCrs = null; g.demSrc = 'file'; g.crops = E.crops; g.crsText = '';

  g.opts.reservoirMode = 'layer';
  S.crsBase = crs; updateCrs(); MapView.buildDem();
  invalidate('gis');
}

  $('#eHtml', box).onclick = () => { const css = 'body{font:14px/1.5 system-ui,sans-serif;max-width:980px;margin:24px auto;padding:0 16px;color:#10262d}table{border-collapse:collapse;font-size:12.5px;margin:6px 0}td,th{border-bottom:1px solid #d2dee2;padding:3px 8px;text-align:right}th:first-child,td:first-child{text-align:left}.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{border:1px solid #d2dee2;border-radius:8px;padding:6px 10px}.kpi small{display:block;color:#67808a;font-size:11px}h3{margin:0 0 8px}h4{color:#0a6c80;margin:16px 0 4px}svg{max-width:100%;height:auto}.ct{fill:#67808a;font:10px monospace}.cl{fill:#38525a;font:11px sans-serif}.cg{stroke:#e4ecef}.ca{stroke:#67808a}:root{--s1:#0a6c80;--s2:#d97706;--good:#1f8a5b;--warn:#b7791f;--bad:#c0392b;--muted:#67808a;--ink:#10262d;--s1-soft:#cfe8ed}.ok{color:#1f8a5b}.warn{color:#b7791f}.bad{color:#c0392b}.tw{overflow:auto}button,.legend{display:none}'; const clone = box.cloneNode(true); $$('button,.row.end', clone).forEach(x => x.remove()); download('copam_evaluation_report.html', '<!doctype html><meta charset="utf-8"><title>COPAM-Web evaluation</title><style>' + css + '</style><h2>COPAM-Web evaluation · ' + esc(S.projectName) + '</h2>' + clone.innerHTML, 'text/html'); };
}

/* ---------- Loops helper: none ---------- */

/* ---------- start-up ---------- */
function buildUI() {
  const tabs = $('#tabs'), panels = $('#panels');
  Object.keys(TABS).forEach(n => {
    tabs.append(el('button', { class: 'tab', 'data-tab': n, role: 'tab', 'aria-selected': 'false', onclick: () => showTab(n) }, TABS[n].title));
    panels.append(el('section', { class: 'panel', id: 'p-' + n, role: 'tabpanel' }));
  });
  $('#mapMode').onchange = e => setMapMode(e.target.value);
  $('#optCrops').onchange = e => { S.showCrops = e.target.checked; MapView.draw(); };
  $('#optDem').onchange = e => { S.showDem = e.target.checked; MapView.draw(); };
  $('#optLab').onchange = e => { S.labels = e.target.checked; MapView.draw(); };
  $('#btnExample').onclick = () => loadExample();
  $('#btnOpen').onclick = () => $('#filePick').click();
  $('#filePick').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
  $('#btnSave').onclick = () => { if (!needModel()) return; download((S.projectName || 'network').replace(/[^\w.-]+/g, '_') + '.in', C.writeIn(S.model)); };
  $('#btnInp').onclick = () => exportInp();
  const baseSel = $('#mapBase'), opW = $('#opWrap');
  baseSel.onchange = () => {
    const k = baseSel.value;
    if (k !== 'none' && !S.crs) { toast('The background map needs the coordinate system: load the .prj files or type an EPSG code / UTM zone in the GIS tab (step 3).', { err: true }); baseSel.value = 'none'; return; }
    S.basemap.kind = k; opW.hidden = k === 'none'; MapView.draw();
  };
  $('#mapOp').oninput = e => { S.basemap.opacity = +e.target.value / 100; MapView.draw(); };
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { if (e.target.closest('#drop')) return; e.preventDefault(); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
  MapView.init(); updateMapModes();
}
function loadExample() {
  const E = window.EXAMPLE; if (!E) { toast('Example data not available in this build.', { err: true }); return; }
  const net = C.parseIn(E.inText);
  S.plist = C.parsePipeList(E.pipeText); S.pipeFile = 'pipes2.pipe';
  loadExampleGis();
  setNetwork(net.nodes, net.links, 'D9S6 · Ofanto district 9, sector 6');
  S.evalResult = null;
  const rn = S.model.reservoirs.length ? S.model.nodes[S.model.reservoirs[0]] : null;
  if (E.reservoirQ) { S.evalParams.Qup = S.design.Qup = S.hy.Qup = E.reservoirQ; }
  updateChips(); invalidate();
}
async function boot() {
  buildUI();            // start empty: no district, layers, DEM or results are loaded
  invalidate(); showTab('gis');
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
})();</script>
